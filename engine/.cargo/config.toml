# =============================================================================
# Migo Engine - Android Build Configuration
# =============================================================================

# ARM64 (aarch64) - Most modern Android devices
# -----------------------------------------------------------------------------
[target.aarch64-linux-android]
ar = "aarch64-linux-android-ar"
linker = "aarch64-linux-android26-clang"
rustflags = [
  # Basic strip (equivalent to -s)
  "-C", "link-arg=-s",
  
  # Garbage collection of unused sections
  "-C", "link-arg=-Wl,--gc-sections",
  
  # No `-static-libstdc++`, and no shared libc++ either -- the result has
  # neither. The driver's default is `-lc++_shared`, but every C++ symbol this
  # library needs is already inside the static archives it links (Chromium's
  # libc++ inside `librusty_v8.a`, the NDK's inside skia-bindings), so nothing
  # resolves against the shared object and the linker drops the DT_NEEDED. The
  # shipped `libmigo.so` names exactly eight libraries and no libc++ is among
  # them; `readelf --dynamic` says so on every ABI.
  #
  # That is why #116 could stop shipping `libc++_shared.so` without changing a
  # single link flag: it had never been loaded. The comment here used to claim
  # the opposite -- "dynamically link libc++, libc++_shared.so is shipped in
  # jniLibs" -- and both halves were false by the time anyone read them.
  #
  # Passing `-static-libstdc++` instead is not a no-op: it makes the same
  # duplicate symbols the flag below tolerates into errors the driver reports
  # first. A third-party consumer meets the same six from the other side, which
  # is what `-DANDROID_STL=c++_static` needs `--allow-multiple-definition` for
  # (include/migo/README.md carries the matrix).
  #
  # Tolerate the duplicate std::* symbols V8 and Skia both define. The linker takes the
  # first definition, and what that tolerates was measured by removing the flag: exactly
  # six symbols, all ones libc++
  # explicitly instantiates in stdexcept.cpp (std::runtime_error and std::logic_error's
  # char-const* constructor, copy constructor and copy assignment). The two providers are
  # *different* libc++ implementations -- Chromium's, carried inside V8's rlib, and the NDK
  # r23 sysroot's libc++_static.a -- so the older justification here, "the same libc++ ABI",
  # was false. Taking the first definition is safe for a narrower reason: no std exception
  # object crosses the V8/Skia boundary, because each side throws and catches internally and
  # the surface between them is a C ABI. See ledger item 1.4.
  "-C", "link-arg=-Wl,--allow-multiple-definition",
  
  # Use LLD linker for better optimization (if available)
  "-C", "link-arg=-fuse-ld=lld",
  
  # ICF (Identical Code Folding) - merges identical functions
  "-C", "link-arg=-Wl,--icf=all",
  
  # Use GNU hash style (smaller than sysv)
  "-C", "link-arg=-Wl,--hash-style=gnu",
  
  # Strip all symbols including debug
  "-C", "link-arg=-Wl,--strip-all",
  
  # NOTE: do not add `embed-bitcode=no` here. [profile.release] uses lto="fat",
  # and rustc rejects `-C embed-bitcode=no` together with `-C lto` as a hard
  # error (breaks the release AAR link). cargo embeds bitcode as LTO requires,
  # and --strip-all drops it from the shipped .so, so there is no size cost.

  # Exclude frame pointers (smaller but harder to debug crashes)
  "-C", "force-frame-pointers=no",

  # Disable unwind tables (not needed with panic=abort)
  "-C", "force-unwind-tables=no",

  # Only link truly needed shared libraries
  "-C", "link-arg=-Wl,--as-needed",

  # Read-only relocations (security hardening)
  "-C", "link-arg=-Wl,-z,relro",
  "-C", "link-arg=-Wl,-z,now",

  # Pack the relative relocations.
  #
  # `.rela.dyn` was 2,173,992 bytes, and 90,430 of its 90,583 entries (99.8%)
  # are R_AARCH64_RELATIVE: 24 bytes each to say "add the load bias to this
  # word", one entry per word, for 2.07 MiB of table. Nothing in the file was
  # wrong -- that is simply what an unpacked RELA section costs a library with
  # this much pointer-bearing rodata. APS2 group-encodes the offsets instead,
  # and bionic has decoded that format since API 23 (minSdk here is 26).
  #
  # `android` and not `relr` deliberately. SHT_RELR would encode the same
  # 90,430 offsets in ~18 KB -- simulated exactly against this binary, not
  # estimated -- but bionic only learned DT_RELR in API 30 and this library
  # still has to load on 26. Worth revisiting if that floor ever moves.
  #
  # It is a load-time encoding and nothing else: no code is added, removed or
  # reordered, so nothing about *execution* speed can move.
  #
  # Load time was tested rather than argued, twice, because the first test was
  # wrong. Endless-runner on a Mate 30 Pro, three interleaved temperature-gated
  # rounds per arm:
  #
  #   confounded pair (the two builds also differed by four merged PRs)
  #     first frame   packed 330 [320, 330, 331]   unpacked 314 [313, 314, 317]
  #     -> "packed costs 16 ms, and the ranges do not overlap"
  #
  #   clean pair (one tree, ± this flag, nothing else)
  #     first frame   packed 322 [308, 322, 361]   unpacked 333 [320, 333, 356]
  #     game ready    packed 660 [645, 660, 756]   unpacked 746 [660, 746, 752]
  #     -> the effect flips sign and the ranges overlap almost entirely
  #
  # **It did not reproduce.** At n=3 on this device the flag has no startup
  # effect this harness can resolve, in either direction. The tidy-looking
  # non-overlap in the first pass came from comparing two different trees, which
  # is a reminder that a clean-looking result from a dirty comparison is more
  # dangerous than a noisy one.
  #
  # So the original claim stands, but as a tested one rather than a reasoned one:
  # 1.85 MiB off every installation, with no startup cost that three rounds can
  # find. If someone later needs certainty rather than "not resolvable at n=3",
  # the arms are `scripts/build-aar.sh` ± this line and the driver is
  # migo-bench's `jitless-ab.sh --label-a packed --label-b unpacked`.
  "-C", "link-arg=-Wl,--pack-dyn-relocs=android",

  # Version script: only export JNI symbols, hide everything else
  "-C", "link-arg=-Wl,--version-script=version.script",
]

# -----------------------------------------------------------------------------
# x86_64 - Emulators and Chromebooks
# -----------------------------------------------------------------------------
[target.x86_64-linux-android]
ar = "x86_64-linux-android-ar"
linker = "x86_64-linux-android26-clang"
rustflags = [
  "-C", "link-arg=-s",
  "-C", "link-arg=-Wl,--gc-sections",
  "-C", "link-arg=-Wl,--allow-multiple-definition",
  "-C", "link-arg=-fuse-ld=lld",
  "-C", "link-arg=-Wl,--icf=all",
  "-C", "link-arg=-Wl,--hash-style=gnu",
  "-C", "link-arg=-Wl,--strip-all",
  "-C", "force-frame-pointers=no",
  "-C", "force-unwind-tables=no",

  # Only link truly needed shared libraries
  "-C", "link-arg=-Wl,--as-needed",

  # Read-only relocations (security hardening)
  "-C", "link-arg=-Wl,-z,relro",
  "-C", "link-arg=-Wl,-z,now",

  # Pack the relative relocations -- same reasoning as the aarch64 block above,
  # where the measurement and the choice of APS2 over SHT_RELR are recorded.
  "-C", "link-arg=-Wl,--pack-dyn-relocs=android",

  # Version script: only export JNI symbols, hide everything else
  "-C", "link-arg=-Wl,--version-script=version.script",
]

# -----------------------------------------------------------------------------
# ARMv7 (32-bit) - Legacy devices
# -----------------------------------------------------------------------------
[target.armv7-linux-androideabi]
ar = "arm-linux-androideabi-ar"
linker = "armv7a-linux-androideabi26-clang"
rustflags = [
  "-C", "link-arg=-s",
  "-C", "link-arg=-Wl,--gc-sections",
  "-C", "link-arg=-Wl,--allow-multiple-definition",
  "-C", "link-arg=-fuse-ld=lld",
  "-C", "link-arg=-Wl,--icf=all",
  "-C", "link-arg=-Wl,--hash-style=gnu",
  "-C", "link-arg=-Wl,--strip-all",
  "-C", "force-frame-pointers=no",
  "-C", "force-unwind-tables=no",

  # Only link truly needed shared libraries
  "-C", "link-arg=-Wl,--as-needed",

  # Read-only relocations (security hardening)
  "-C", "link-arg=-Wl,-z,relro",
  "-C", "link-arg=-Wl,-z,now",

  # Pack the relative relocations -- see the aarch64 block above. DT_ANDROID_REL
  # is the 32-bit form and bionic decodes it from the same API level. Untested:
  # armv7 is not in build-android-so.sh's PLATFORM_MAP, so nothing builds this
  # target today. It is here so that whoever turns armv7 back on inherits the
  # flag set the shipped ABIs use rather than a quietly different one.
  "-C", "link-arg=-Wl,--pack-dyn-relocs=android",

  # Version script: only export JNI symbols, hide everything else
  "-C", "link-arg=-Wl,--version-script=version.script",
]

# -----------------------------------------------------------------------------
# OpenHarmony (arm64 + x86_64)
# -----------------------------------------------------------------------------
# ⚠ These targets report target_os = "linux" with target_env = "ohos", so every
# bare `cfg(target_os = "linux")` in the tree matches OHOS too. `platform/src/
# lib.rs` and `capi/src/platform/mod.rs` already spell
# `not(target_env = "ohos")` to keep the X11/Wayland presenters out; do not
# "simplify" those back to a bare linux check.
#
# The linker is the SDK's own target-prefixed driver, named exactly after the
# Rust triple -- the same arrangement as the Android entries above naming the
# NDK's wrappers. Each driver already resolves its own sysroot (verified with
# `-print-search-dirs`), so nothing machine-specific is committed here; the
# SDK's llvm/bin only has to be on PATH, which scripts/dev-setup-ohos.sh
# exports.
#
# The flag set is deliberately smaller than Android's. Only correctness and
# hardening flags are here. Android's --strip-all / --icf=all / -s are size
# optimizations from the .so-shrinking work, and OHOS ships a static library to
# an NDK consumer rather than a size-capped .so -- so those are a measurement
# to make, not a default to inherit. Nothing is added here without a number
# behind it.
# -----------------------------------------------------------------------------
[target.x86_64-unknown-linux-ohos]
linker = "x86_64-unknown-linux-ohos-clang"
rustflags = [
  # No --allow-multiple-definition here, and that is measured rather than assumed:
  # migo-capi is a staticlib on this target, so rustc never invokes a linker, and the
  # shipped consumption path is an OpenHarmony consumer linking that archive through
  # CMake -- which scripts/test-ohos-sdk-contract.sh does, with --gc-sections and
  # nothing else, successfully. A cargo-driven link for this target does not work at
  # all today (it fails on `unable to find library -lstdc++`), so a relaxation here
  # could only silence a duplicate nobody has reached.
  # skia-bindings has a translation unit referencing JPEG/PDF/pathops symbols
  # for features Skia was built without; an executable or .so only links
  # because --gc-sections reclaims the unreferenced sections.
  "-C", "link-arg=-Wl,--gc-sections",
  "-C", "link-arg=-Wl,--as-needed",
  "-C", "link-arg=-Wl,-z,relro",
  "-C", "link-arg=-Wl,-z,now",
]

[target.aarch64-unknown-linux-ohos]
linker = "aarch64-unknown-linux-ohos-clang"
rustflags = [
  # See the x86_64 OpenHarmony entry for why no duplicate-definition relaxation is here.
  "-C", "link-arg=-Wl,--gc-sections",
  "-C", "link-arg=-Wl,--as-needed",
  "-C", "link-arg=-Wl,-z,relro",
  "-C", "link-arg=-Wl,-z,now",
]

# -----------------------------------------------------------------------------
# Build Configuration
# -----------------------------------------------------------------------------
[build]
# Use all available CPU cores for compilation
# jobs = 8  # Uncomment and adjust if needed

# -----------------------------------------------------------------------------
# Nightly Features (Optional - requires nightly toolchain)
# -----------------------------------------------------------------------------
# Uncomment these lines if using nightly for additional size reduction:
# 
# [unstable]
# build-std = ["std", "panic_abort"]
# build-std-features = ["panic_immediate_abort"]

# -----------------------------------------------------------------------------
# Environment Variables for Build Scripts
# -----------------------------------------------------------------------------
[env]
# These can be overridden by actual environment variables
# CARGO_PROFILE_RELEASE_LTO = "fat"
# CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "1"
# CARGO_PROFILE_RELEASE_OPT_LEVEL = "z"

# ---- Skia GN build arguments ----------------------------------------------
# Disable fontconfig on Linux (we ship SkFontMgr_Android on device and a
# TypefaceFontProvider with bundled fonts for headless tests). This avoids
# the system libfontconfig-dev dependency.
#
# extra_cflags_cc adds C++-only flags WITHOUT overriding skia-bindings'
# own extra_cflags (-Oz / -D__ANDROID_API__). We drop unwind tables:
# the engine builds with panic=abort and Skia is compiled -fno-exceptions,
# so the .eh_frame / .eh_frame_hdr unwind data (~part of 3 MB) is dead
# weight in the final .so. -fno-asynchronous-unwind-tables removes the
# per-function CFI; -fno-unwind-tables drops the rest.
SKIA_GN_ARGS = "skia_use_fontconfig=false skia_enable_fontmgr_fontconfig=false extra_cflags_cc=[\"-fno-asynchronous-unwind-tables\",\"-fno-unwind-tables\"]"

# On WSL / Ubuntu hosts, Skia's C++20 consteval usage in src/base/SkTime.cpp
# does not compile with clang-12 against the GCC-13 libstdc++ shipped by
# Ubuntu 24.04 (see Skia bug 353527181).  Force a newer clang explicitly;
# the Android NDK still uses its own bundled clang for cross-compile.
# These defaults are overridden by environment variables if set.
CC = "clang-18"
CXX = "clang++-18"

# The two entries above have no per-target form -- cargo's `[env]` applies to
# every target -- so on Windows they name a compiler that does not exist and
# every cc-rs build script in the graph dies with `ToolNotFound: clang-18`.
#
# cc-rs resolves `CC_<target>` before plain `CC`, so naming the target here is
# provably inert for Android and Linux: those targets never read these keys.
# It is equally inert for the host-test path, which exports a plain `CC` to
# beat this non-forcing block (scripts/dev-test-host.sh) -- that precedence is
# unchanged because a plain `CC` is what it overrides.
#
# clang-cl rather than MSVC's cl: skia-bindings on Windows probes fixed paths
# for clang-cl.exe and refuses to build without it, so LLVM is already a hard
# prerequisite there. Naming the same compiler keeps one toolchain in play
# instead of two. Resolved through PATH, not an absolute path, so a non-default
# LLVM location still works.
#
# ⚠ PATH order matters, and getting it wrong fails deep instead of early. An
# Android NDK on PATH ships its own clang-cl.exe -- r23c's is clang 12 -- and
# it will be found first if it comes before the LLVM install. The failure
# surfaces a thousand build steps later inside MSVC's own headers
# (`STL1000: Unexpected compiler version, expected Clang 19.0.0 or newer`),
# which reads like a broken STL rather than a shadowed compiler. Put the LLVM
# directory ahead of the NDK's, or set CC_x86_64_pc_windows_msvc to an
# absolute path for that machine.
CC_x86_64_pc_windows_msvc = "clang-cl"
CXX_x86_64_pc_windows_msvc = "clang-cl"

# Same reasoning, the arm64 Windows runner: without this, cc-rs's own
# unpinned-CC fallback probes versioned names (clang-18, clang-17, ...)
# before trying plain clang/cc, and none of those exist on a runner that only
# has choco's LLVM on PATH -- surfaced by `ring`'s build script during
# release-windows-arm64's first real run ("failed to find tool clang-18").
CC_aarch64_pc_windows_msvc = "clang-cl"
CXX_aarch64_pc_windows_msvc = "clang-cl"

# The Apple targets, for the same reason and with the same shape. The block
# above worked out that a plain `CC` here reaches every target and named the
# Windows ones; the Apple ones have the identical problem and nobody had a
# machine on which to meet it.
#
# This is not a hypothetical. The first CI run that ever compiled this tree with
# an Apple toolchain -- `.github/workflows/apple-ci.yml`, on macos-15 -- died in
# `zstd-sys`'s build script with `ToolNotFound: failed to find tool "clang-18"`,
# before a single line of our own code was compiled. A Mac arriving in this
# project's future would have met exactly that, and the message points at the
# reader's toolchain rather than at this file.
#
# Plain `clang` and not a versioned name: on Apple platforms cc-rs's own default
# is `clang`, resolved through the active developer directory so it picks up the
# right SDK and `-arch` for the target. These keys exist only to stop the
# Linux-host `CC` above from shadowing that default -- they restore cc-rs's
# behaviour rather than replacing it.
#
# ⚠ THESE KEYS ONLY REACH cc-rs, AND THAT IS NOT EVERY C COMPILE IN THE GRAPH.
# skia-bindings does not ask cc-rs which compiler to use for Skia itself: it
# hands GN a compiler, GN writes ninja files, and what it hands over is the
# PLAIN `CC` above. So the keys below fixed `zstd-sys` and left Skia broken, and
# the first build that ever compiled Skia for an Apple target found out 1429
# ninja steps in:
#
#     clang-18 -isysroot .../iPhoneOS18.5.sdk --target=aarch64-apple-ios ...
#     /bin/sh: clang-18: command not found
#
# Android escapes this because skia-bindings takes its compiler from the NDK
# there, which is why a bare `CC` has been survivable for years without anyone
# noticing how broad it is. The Apple fix lives in scripts/build-apple-sdk.sh,
# which exports a plain `CC`/`CXX` before building -- a real environment
# variable beats this non-forcing block, and `[env]` has no per-target form for
# the unqualified name. If another Apple entry point appears that compiles Skia,
# it needs the same two lines.
CC_aarch64_apple_darwin = "clang"
CXX_aarch64_apple_darwin = "clang++"
CC_x86_64_apple_darwin = "clang"
CXX_x86_64_apple_darwin = "clang++"
CC_aarch64_apple_ios = "clang"
CXX_aarch64_apple_ios = "clang++"
CC_aarch64_apple_ios_sim = "clang"
CXX_aarch64_apple_ios_sim = "clang++"

# Khronos EGL/GL/GLES headers for Skia's GL EGL interface are expected in the
# environment via CPATH.  On WSL / minimal Ubuntu hosts without root access,
# run `scripts/dev-setup-skia.sh` once to fetch them to ~/.local/skia-headers
# and to export CPATH.  On machines with `libegl1-mesa-dev` installed, no
# extra setup is required.
