[package]
name = "migo-runtime-v8"
version.workspace = true
license.workspace = true
edition = "2024"

[lib]
name = "runtime_v8"
path = "src/lib.rs"

[features]
default = ["profile-full"]
profile-full = ["v8-limits", "code-signing", "api-sensors", "api-media", "api-connectivity", "api-commerce", "api-system"]
profile-slim = ["v8-limits", "code-signing"]
# Opt-in R9 A/B candidate. Android builds additionally require a validated,
# kind-bound Worker snapshot; the shipping default keeps source bootstrap.
worker-snapshot = []

# Measurement build. HarmonyOS NEXT forbids executable anonymous memory for
# third-party VMs, so V8 there runs interpreted whether we ask it to or not, and
# PLAN.md gates every HarmonyOS performance claim on knowing what that costs.
# `--jitless` is the closest faithful proxy on hardware we can actually measure.
# Never in a shipping build: it is off by default and no release path selects it.
v8-jitless = []
v8-limits = ["shared/v8-limits"]
code-signing = ["shared/code-signing"]
# Gate the image crate behind a feature flag — runtime-v8 does not use it directly.
# Image decoding is handled by the `io` crate (which has its own `rust-image-decode` feature).
rust-image-decode = ["dep:image"]

# ---- API group feature gates (M25) ----
#
# Each feature controls whether the corresponding API domain's extension
# modules (Rust ops + JS ESM files + global scope registration) are compiled
# and included in the extension chain.  When a feature is disabled the
# entire extension is excluded: no ops are registered, no JS files are
# bundled, and the corresponding APIs do not appear on globalThis.
#
# Mapping to extensions:
#   api-sensors      -> host_v8_device  (sensors, battery, clipboard, vibration, screen, network, location, scan)
#   api-media        -> host_v8_media (camera, image_api, video) + host_v8_audio (WebAudio, InnerAudio, Recorder)
#   api-connectivity -> host_v8_system  (bluetooth, auth, window/system/device info, login, settings, navigate, game_log)
#   api-commerce     -> host_v8_share (share menu) + host_v8_payment (Midas payment)
#   api-system       -> host_v8_ui (Toast/Modal/Loading/ActionSheet) + host_v8_update + host_v8_ad + host_v8_worker
api-sensors = []
api-media = []
api-connectivity = []
api-commerce = []
api-system = []

[dependencies]
# The WebGL command-stream validator, which used to live in this crate.
# default-features = false leaves the packet builder out: this crate reads
# the stream, it does not encode wire packets.
migo-frame-wire = { path = "../frame-wire", default-features = false }
# The command decoder. Engine-neutral by construction: the Apple Performance+
# product needs the same decoding with no JavaScript engine in its closure, and
# a second copy would be two decoders that have to agree.
frame-decode = { package = "migo-frame-decode", path = "../frame-decode", default-features = false }
deno_core.workspace=true
# Only enable tokio features actually needed (not "full")
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "rt-multi-thread", "net", "fs", "io-util"] }
tracing = { workspace = true }
# `vfs` names the filesystem/package module and the `op_state` that holds its
# handles; `codec` the text codecs. Both are `shared` defaults, and this crate
# opts out of defaults, so they have to be asked for by name -- otherwise a
# whole-workspace build unifies them in and a single-crate build does not,
# which is the shape where one of the two is silently green.
shared = { package = "migo-shared", path = "../shared", default-features = false, features = ["vfs", "codec"] }
migo-io = { path = "../io", default-features = false, features = ["zip-extract"] }
# The work behind the ops that have been moved out of them; see its manifest.
migo-services = { path = "../services" }
serde.workspace = true
reqwest.workspace = true
base64 = "0.22"
percent-encoding = "2.3"
thiserror.workspace = true
http.workspace = true
data-url.workspace = true
bytes.workspace = true
crossbeam-channel.workspace = true
deno_error.workspace = true
glow.workspace = true
bytemuck.workspace = true
image = { workspace = true, optional = true }
parking_lot = "0.12.4"
tokio-tungstenite.workspace = true
# Ensure rustls 0.23 has a concrete crypto provider selected for WebSocket TLS.
# tokio-tungstenite enables rustls with default-features = false; without ring/
# aws-lc-rs, runtime handshake panics on provider auto-detection.
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
futures.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# Section 7.3's steady-state allocation gate. A dev-dependency by construction:
# the counting allocator must never be reachable from a shipped cdylib.
migo-alloc-probe = { path = "../../testing/alloc-probe", default-features = false }
# Section 7.3's cross-session contention gate, same reasoning: dev-only by
# construction so no shipped build can reach it.
migo-contention-probe = { path = "../../testing/contention-probe", default-features = false }
# The gate holds the console registry's own lock, which only this feature exposes.
shared = { package = "migo-shared", path = "../shared", default-features = false, features = ["contention-probe", "vfs", "codec"] }
# Also a [build-dependencies] entry: the snapshot-fingerprint helper
# (build_snapshot.rs) is shared verbatim between build.rs and its regression test.
sha2 = "0.10"

[build-dependencies]
serde_json = "1"
sha2 = "0.10"
