[package]
name = "migo-services"
version.workspace = true
license.workspace = true
edition = "2024"

[lib]
name = "migo_services"

# The engine's host services, callable without a script runtime.
#
# An op is two things: the adapter that takes arguments out of V8 and puts an
# answer back, and the work -- resolve a path, read a file, charge a quota,
# decode an image. The embedded runtime used to hold both in one function, which
# was fine while V8 was the only caller. On iOS Performance+ the caller is a
# producer in another process, and the work has to run where no V8 is linked.
# So the work lives here, once, and both executions call it: the embedded ops
# as thin adapters, the external session's service dispatcher directly. Two
# copies of the same rules would be two behaviours for the same game.
#
# No JavaScript engine is reachable from this crate, and
# scripts/test-apple-performance-rust-closure.sh measures that through the
# external session that depends on it.
[dependencies]
shared = { package = "migo-shared", path = "../shared", default-features = false, features = ["vfs", "codec"] }
# `zip-extract` because `unzip` and `readZipEntry` are file-system calls every
# execution offers; the embedded runtime has always enabled it.
migo-io = { path = "../io", default-features = false, features = ["zip-extract"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "fs", "io-util", "net"] }
# `join_all` for the DNS warm-up, which resolves a capped batch at a time
# rather than spawning one task per host.
futures.workspace = true
# The HTTP client every outbound request is made with (network::http, built by
# network::client so the resolver and the redirect gate cannot be forgotten by a
# second constructor): hyper carries the protocol and
# the connection pool; the engine makes the connections -- the address policy on
# every lookup, each phase timed for a request's profile -- and follows the
# redirects. Same versions, TLS backend (rustls on ring) and Mozilla roots the
# engine has shipped with.
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "client-proxy", "http1", "http2", "tokio"] }
http-body = "1"
http-body-util = "0.1"
tower-service = "0.3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1.0.11"
# A socket's RTT (TCP_INFO / TCP_CONNECTION_INFO), for a request's profile.
libc = "0.2"
http.workspace = true
# A response body arrives as `Bytes`, and a chunk handed to content is a
# window into the one the connection produced rather than a copy of it.
bytes.workspace = true
# HTTP Content-Encoding only; no fetch/DOM stack or additional runtime.
async-compression = { version = "=0.4.51", default-features = false, features = ["tokio", "gzip", "brotli"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["io"] }
# `data:` URLs, which `fetch` answers without a connection.
data-url.workspace = true
# The same WHATWG parser as public URL. Policy, request targets and redirects
# must not disagree over a host or fall back to another parser on rejection.
ada-url.workspace = true
tracing = { workspace = true }
parking_lot = { workspace = true }
# Content's WebSocket: the connection, its limits and its handshake, held here
# so both executions open the same socket under the same policy.
tokio-tungstenite.workspace = true
# RFC7692 uses the existing miniz encoder, and a dictionary-capable inflater.
# The latter also restores takeover after valid BFINAL blocks; no C backend.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
zlib-rs = { version = "=0.6.8", default-features = false, features = ["std"] }
# `prefetchDns` takes its hostnames as a JSON array, which is the shape the
# engine's JavaScript has always passed; parsed here so both executions refuse
# a malformed list with the same words.
serde_json = { workspace = true }
# Data URLs carry base64 or percent-encoded payloads, and are cache-keyed by
# their SHA-256 (the same digest the package integrity check uses, taken here
# directly because that check is a code-signing feature this crate must not
# require).
base64 = "0.22"
percent-encoding = "2.3"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
# Give admission tests their own executor and quota; never saturate the
# process-global pool used by unrelated tests or product sessions.
migo-io = { path = "../io", default-features = false, features = ["admission-probe"] }
miniz_oxide = "=0.8.9"
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "test-util"] }
# Servers the HTTP client's tests run in-process (HTTP/1.1 and HTTP/2, over TCP and TLS), and the certificate
# authority their TLS is signed by.
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["server", "server-auto", "tokio", "http1", "http2"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
# The cross-session contention gate, for the image alias registry.
migo-contention-probe = { path = "../../testing/contention-probe", default-features = false }
# The same dependency, with the fixture signer the signed-mount tests use.
# A feature on an existing edge, so the lockfile -- and every V8 snapshot
# fingerprint that includes it -- does not move.
shared = { package = "migo-shared", path = "../shared", default-features = false, features = ["vfs", "codec", "signed-fixtures"] }

[features]
# Verify signed content before it is mounted (`content::MountedContent::mount_signed`).
# The execution that loads modules in-process verifies in its own loader; the
# external one, whose loader is another process, verifies here.
code-signing = ["shared/code-signing"]

# OHOS has no supported platform-verifier integration; its explicit Mozilla
# trust profile must not pull a Linux filesystem-root shim into the device.
[target.'cfg(not(target_env = "ohos"))'.dependencies]
rustls-platform-verifier = { version = "=0.7.1", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
# Kept behind the raw JNI boundary until the existing SDK JNI edges migrate.
jni-verifier = { package = "jni", version = "=0.22.4", default-features = false }
