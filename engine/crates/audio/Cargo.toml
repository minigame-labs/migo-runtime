[package]
name = "migo-audio"
version.workspace = true
license.workspace = true
edition = "2024"

[lib]
name = "audio"

[dependencies]

# Decoders - lightweight combination
#
# minimp3-sys directly, not the `minimp3` wrapper crate: this crate only ever
# calls the raw `mp3dec_*` C functions (see decoder/mp3.rs) and manages
# `mp3dec_t` itself, so the wrapper's own safe `Decoder` type -- and its
# `slice-ring-buffer` dependency, which RUSTSEC-2025-0044 documents as having
# four double-free vulnerabilities reachable through safe APIs and no fixed
# upgrade available -- is dead weight this crate never calls into. Depending
# on -sys directly removes it from the dependency tree instead of leaving it
# compiled in on the strength of "but we never call that part."
minimp3-sys = "0.6"  # MP3, MIT license
# Vorbis uses the mature bounded Ogg packetizer and gapless decoder verified by W09.
symphonia-core = { version = "=0.6.1", default-features = false, features = ["opt-simd"] }
symphonia-metadata = { version = "=0.6.1", default-features = false }
symphonia-format-ogg = { version = "=0.6.1", default-features = false, features = ["streaming"] }
symphonia-codec-vorbis = { version = "=0.6.1", default-features = false }
symphonia-format-riff = { version = "=0.6.1", default-features = false, features = ["wav", "streaming"] }
symphonia-codec-pcm = { version = "=0.6.1", default-features = false }
# AAC-LC full-file jobs reuse the verified ADTS/MP4 bounded ports.
symphonia-codec-aac = { version = "=0.6.1", default-features = false, features = ["streaming"] }
symphonia-format-isomp4 = { version = "=0.6.1", default-features = false, features = ["streaming"] }

# Mature band-limited whole-file sample-rate conversion; FFT stays unselected.
rubato = { version = "=5.0.1", default-features = false }

# Thread-safe audio buffer
ringbuf = "0.5"

# Shared CPU executor and host-domain cancellation, already in the service closure.
migo-io = { path = "../io", default-features = false }

# Async
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "time", "macros"] }

# The engine's HTTP client, for streaming a remote `src`: the same client, address
# policy and redirect gate every other outbound request uses.
migo-services = { path = "../services", default-features = false }
futures-util = "0.3"

# Shared
# `vfs` names the filesystem/package module and the `op_state` that holds its
# handles; `codec` the text codecs. Both are `shared` defaults, and this crate
# opts out of defaults, so they have to be asked for by name -- otherwise a
# whole-workspace build unifies them in and a single-crate build does not,
# which is the shape where one of the two is silently green.
shared = { package = "migo-shared", path = "../shared", default-features = false, features = ["vfs"] }
tracing = { workspace = true }

# Desktop/Apple use cpal. Android uses a narrow C ABI to pinned Oboe sources,
# without the old Rust binding's inline C++ builder layout. OpenHarmony's
# userspace is musl with no ALSA, and cpal has no OHAudio backend, so pulling cpal there
# drags in alsa-sys and pkg-config for a library that does not exist on the device -- which
# is why the OpenHarmony package had to be built with profile-slim and shipped no audio at
# all. src/output_ohaudio.rs is the backend that replaces it.
[target.'cfg(not(any(target_os = "android", all(target_os = "linux", target_env = "ohos"))))'.dependencies]
cpal = { version = "=0.18.2", default-features = false }
# Already used by the engine; safely exchange Copy error kinds without a mutex
# or an unsafe integer/enum conversion in the device callback.
crossbeam-utils = "0.8"

# WASAPI workers own scoped MMCSS registration. This uses CPAL's existing
# Windows bindings, without enabling cross-platform realtime/D-Bus capabilities.
[target.'cfg(target_os = "windows")'.dependencies]
cpal = { version = "=0.18.2", default-features = false, features = ["wasapi-mmcss"] }

# Already in the iOS CPAL closure. Reuse typed session/category/input ownership
# instead of handwritten Objective-C ABI casts; no capture/default frameworks.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-avf-audio = { version = "=0.3.2", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionRoute", "AVAudioSessionTypes"] }

[build-dependencies]
# Build-only. All native Android consumers use the same NDK libc++_shared.
cc = "1"

[dev-dependencies]
# Existing HTTP client public proxy type, only for deterministic loopback fixtures.
hyper-util = { version = "=0.1.21", default-features = false, features = ["client-proxy"] }
tokio = { workspace = true, features = ["net", "io-util"] }
# Isolate multi-host retirement bursts while retaining real shared queue caps.
migo-io = { path = "../io", default-features = false, features = ["admission-probe"] }
# Independent legacy WAVE oracle; not in the product runtime graph.
hound = "=3.5.1"
# Occupies the shared streaming worker and requires a co-tenant task to run anyway.
migo-executor-probe = { path = "../../testing/executor-probe", default-features = false }
# The steady-state allocation gate. A dev-dependency by construction:
# the counting allocator must never be reachable from a shipped cdylib.
migo-alloc-probe = { path = "../../testing/alloc-probe", default-features = false }
