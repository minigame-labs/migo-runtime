[package]
name = "migo-capi"
version.workspace = true
license.workspace = true
edition = "2024"

# `staticlib` is the controlled packaging input. The Linux SDK links it into
# `libmigo.so` with the public version script and audits the final dynamic
# symbol table; declaring a Rust `cdylib` here would add rustc's own export map
# and previously widened the public surface. `rlib` keeps the boundary directly
# testable from Rust. The verified Linux V8 component used for release is built
# for shared-library linkage by `scripts/build-v8-linux.sh`.
[lib]
name = "migo_capi"
crate-type = ["staticlib", "rlib"]

[features]
default = ["profile-full"]

# The two execution modes, mirroring migo-core's. Mutually exclusive there, so
# mutually exclusive here: `embedded-v8` links a JavaScript engine and
# `external-frames` exists to prove a product links none.
embedded-v8 = ["migo-core/embedded-v8"]
# The platform services profile is a separate axis from the execution mode, and
# the external lane still needs one. `slim` is the base the Apple capability
# tier is defined against: Guideline 4.7.2 makes every native capability a thing
# the embedding app has to justify to Apple, so the lane starts from the smaller
# surface and adds rather than starting from everything and removing.
external-frames = ["migo-core/external-frames", "platform/external-frames"]
test-support = ["migo-core/test-support"]

profile-full = ["embedded-v8", "migo-core/profile-full", "platform/profile-full"]
profile-slim = ["embedded-v8", "migo-core/profile-slim", "platform/profile-slim"]

[dependencies]
migo-core = { path = "../core", default-features = false }
migo-capi-abi = { path = "../capi-abi", default-features = false }
platform = { package = "migo-platform", path = "../platform", default-features = false }
shared = { package = "migo-shared", path = "../shared", default-features = false }
graphics = { package = "migo-graphics", path = "../graphics", default-features = false }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The keyboard options arrive from the engine as JSON, which must not reach C:
# a host should not have to link a parser to open a keyboard, so the boundary
# translates it into `MigoKeyboardShowOptions`.
serde_json = { workspace = true }

# Android builds leave the Rust image decoders out: the Java SDK decodes through
# BitmapFactory, which a C host cannot reach. Skia, as linked here, decodes PNG
# but not JPEG, so without these a C host on Android could not load a JPEG at all
# -- found by migo-conformance's image-decode bundle on v0.9.9. Every other
# platform's C ABI already carries them. Enabled through `platform` rather than a
# direct `migo-io` dependency, which would change Cargo.lock and with it every
# snapshot's fingerprint; the C ABI package is its own cargo build, so the Java
# SDK's AAR is unaffected.
[target.'cfg(target_os = "android")'.dependencies]
platform = { package = "migo-platform", path = "../platform", default-features = false, features = ["rust-image-decode"] }

[dev-dependencies]
migo-core = { path = "../core", default-features = false, features = ["test-support"] }
# The X11 arm of `build_target` decides whether a reattachment reuses the owned
# render connection or opens another, and only the connection can answer that.
# Enabled from here so the seam exists for this crate's tests and in no shipped
# build, the same arrangement `migo-core/test-support` already uses.
platform = { package = "migo-platform", path = "../platform", default-features = false, features = ["test-support"] }
# Test-only by construction: a `[dependencies]` entry here would carry a
# `#[global_allocator]` into the cdylib this crate exists to produce.
migo-alloc-probe = { path = "../../testing/alloc-probe", default-features = false }
