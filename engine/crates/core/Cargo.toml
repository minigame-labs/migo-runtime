[package]
name = "migo-core"
version.workspace = true
license.workspace = true
edition = "2024"

[lib]
name = "migo_core"

[features]
default = ["profile-full"]

# The embedded JavaScript engine, and the two execution modes that select it.
#
# `embedded-v8` exists so the Apple Performance+ product can prove it links no
# JavaScript engine at all -- on iOS the engine is WebKit's, in another process,
# and a second one here would pay twice for working set and package size while
# getting a JIT for neither. The claim is checked against the resolved
# dependency graph by scripts/test-apple-performance-rust-closure.sh, because a
# dependency three levels down is a fact about the graph and nothing about a
# crate's public surface reveals it.
#
# Every `profile-*` implies it: a profile is a description of an embedded
# engine's API surface, so a profile without an engine is not a smaller build,
# it is a contradiction. The `?` forms below say "if the engine is enabled,
# configure it this way" and cannot switch it on by themselves -- without them,
# naming `runtime-v8/anything` in a feature list quietly re-enables the optional
# dependency and the firewall would be off while still looking on.
embedded-v8 = ["dep:runtime-v8"]

# Frames produced outside this process, by an external JavaScript agent. Not a
# second script runtime: there is no engine on this side of that boundary, which
# is the whole point.
#
# TODAY THIS IS A MEASUREMENT POINT, NOT A PRODUCT CONFIGURATION. It compiles,
# and its resolved dependency graph is what the closure gate measures -- 114
# packages against 269 for profile-full, with v8, deno_core and migo-runtime-v8
# absent. What it does not yet have is a session shell: the host thread, the
# render bring-up and the command loop all live inside the embedded execution,
# so a build with this feature and nothing else exports the engine-neutral types
# and no way to run them, and the engine-neutral infrastructure it will use
# compiles without a caller. Those dead-code warnings are accurate.
#
# The shell is the next task, and the shape is already established: `Host::new`
# is 311 lines of which exactly four touch the JavaScript runtime, so the split
# is between the neutral bring-up above line ~150 and the runtime assembly
# below it -- not the 49 `self.js.*` call sites, which belong to the embedded
# execution either way and do not move.
external-frames = ["dep:migo-frame-wire", "dep:frame-decode", "dep:migo-services", "host-audio"]
# The host's audio thread: the WebAudio graph, InnerAudioContext and the device
# output, with no opinion about where the JavaScript that drives it runs. The
# embedded execution reaches it through its ops (`api-media`); the external one
# through the service stream -- on iOS Performance+ PCM never crosses to
# WebContent, so the audio has to play here.
host-audio = ["dep:audio"]

profile-full = ["embedded-v8", "runtime-v8?/profile-full", "v8-limits", "code-signing", "api-sensors", "api-media", "api-connectivity", "api-commerce", "api-system", "graphics/profile-full"]
profile-slim = ["embedded-v8", "runtime-v8?/profile-slim", "v8-limits", "code-signing", "graphics/profile-slim"]
worker-snapshot = ["embedded-v8", "runtime-v8?/worker-snapshot"]
# Measurement build only; see runtime-v8's manifest for what it costs and why.
v8-jitless = ["embedded-v8", "runtime-v8?/v8-jitless"]
test-support = []
v8-limits = ["embedded-v8", "runtime-v8?/v8-limits", "shared/v8-limits"]
code-signing = ["embedded-v8", "runtime-v8?/code-signing", "shared/code-signing"]
api-sensors = ["embedded-v8", "runtime-v8?/api-sensors"]
api-media = ["embedded-v8", "runtime-v8?/api-media", "host-audio"]
api-connectivity = ["embedded-v8", "runtime-v8?/api-connectivity"]
api-commerce = ["embedded-v8", "runtime-v8?/api-commerce"]
api-system = ["embedded-v8", "runtime-v8?/api-system"]

[dependencies]
# `vfs` names the filesystem/package module and the `op_state` that holds its
# handles; `codec` the text codecs. Both are `shared` defaults, and this crate
# opts out of defaults, so they have to be asked for by name -- otherwise a
# whole-workspace build unifies them in and a single-crate build does not,
# which is the shape where one of the two is silently green.
shared = { package = "migo-shared", path = "../shared", default-features = false, features = ["vfs"] }
runtime-v8 = { package = "migo-runtime-v8", path = "../runtime-v8", default-features = false, optional = true }
# The cross-process frame envelope. Reader only: no packet builder in a shipped
# build, which is what `default-features = false` buys here.
migo-frame-wire = { path = "../frame-wire", default-features = false, optional = true }
# The command decoder, shared with the embedded runtime. Engine-free, which is
# what puts it inside the Performance+ closure the gate measures.
frame-decode = { package = "migo-frame-decode", path = "../frame-decode", default-features = false, optional = true }
graphics = { package = "migo-graphics", path = "../graphics", default-features = false }
migo-io = { path = "../io", default-features = false }
# The work behind the ops, shared with the embedded runtime; the external
# session's service dispatcher calls it directly.
migo-services = { path = "../services", default-features = false, optional = true }
audio = { package = "migo-audio", path = "../audio", default-features = false, optional = true }
crossbeam-channel = { workspace = true }
futures = { workspace = true }
# Declared here rather than inherited. This crate uses `tokio::select!`, builds
# a multi-thread runtime and holds a `Notify`, and until the embedded engine
# became optional it compiled anyway: `migo-runtime-v8` enabled those features
# and Cargo unified them across the graph. Feature unification is not a
# dependency declaration -- it is a property of whoever else happens to be in
# the build -- and the external-frame product, which links no engine, is exactly
# the build where the other crate is not there.
#
# `net` was the half of that fix nobody could see, and it took building for a
# third platform to find it. `create_basic_runtime` calls `enable_io()` and
# `max_io_events_per_tick()`, both of which tokio puts behind `cfg_io_driver!`
# -- `feature = "net"`, per tokio's own src/macros/cfg.rs. When the paragraph
# above was written, the features it named were the ones `migo-runtime-v8`
# supplied; `net` was arriving from somewhere else entirely, `migo-shared`'s
#
#     [target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
#
# which is a legitimate declaration -- `raf_signal` really does use
# `tokio::io::unix::AsyncFd` there. So on Linux and Android the external-frame
# product compiled with no engine and still had an IO driver, and the missing
# declaration here stayed invisible.
#
# iOS is the first target with neither: no `migo-runtime-v8`, and not one of
# those two operating systems. The Apple Performance+ product -- the entire iOS
# architecture -- could never have compiled, and the error named `enable_io` as
# "private field, not a method", which reads like a tokio version problem.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-android = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
# The packet builder, for the external lane's own tests. Test-only by
# construction: the shipping dependency above takes the reader alone.
migo-frame-wire = { path = "../frame-wire", default-features = false, features = ["test-support"] }
# Test-only by construction: a `[dependencies]` entry here would carry a
# `#[global_allocator]` into every cdylib that links this crate.
migo-alloc-probe = { path = "../../testing/alloc-probe", default-features = false }
migo-contention-probe = { path = "../../testing/contention-probe", default-features = false }
# Section 7.3's contention gate holds the stats registry's lock, which is private to
# `shared`. Requested here rather than in `[dependencies]` so resolver 2 leaves the
# accessor out of the cdylib.
shared = { package = "migo-shared", path = "../shared", default-features = false, features = ["contention-probe", "vfs"] }

# On non-Android platforms, enable Rust-native implementations:
# - zip-extract: Unzip via Rust `zip` crate (Android uses java.util.zip via JNI)
# - codec-gbk: GBK encoding via `encoding_rs` crate (Android uses java.nio.charset via JNI)
# - rust-image-decode: image/zune-image decoders (Android uses BitmapFactory via JNI)
[target.'cfg(not(target_os = "android"))'.dependencies]
migo-io = { path = "../io", default-features = false, features = ["zip-extract", "rust-image-decode"] }
shared = { package = "migo-shared", path = "../shared", default-features = false, features = ["codec-gbk", "vfs"] }
