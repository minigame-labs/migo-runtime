[package]
name = "migo-platform"
version.workspace = true
license.workspace = true
edition = "2024"

[lib]
name = "platform"
# rlib only. This crate contains reusable platform policy and presenters, while
# each delivery boundary chooses its native artifact independently: Android's
# JNI `libmigo.so` lives in `android-jni`, and the Linux SDK links the C ABI
# static archive under an audited version script. Keeping artifact shape out of
# this crate also leaves host tests and the standalone player ordinary Rust
# consumers instead of forcing every target to emit the same library kind.
crate-type = ["rlib"]

[features]
default = ["profile-full"]
# Test-only seams that have to cross a crate boundary. Named and enabled the way
# `migo-core/test-support` already is -- only from a `[dev-dependencies]` entry,
# which resolver 2 keeps out of every shipped build. It exists because the C ABI
# layer's X11 arm is two crates away from the connection it must not reopen, so
# `#[cfg(test)]`, which does not cross crates, cannot reach it.
test-support = []
profile-full = ["v8-limits", "code-signing", "api-sensors", "api-media", "api-connectivity", "api-commerce", "api-system", "migo-core/profile-full", "graphics/profile-full"]
profile-slim = ["v8-limits", "code-signing", "migo-core/profile-slim", "graphics/profile-slim"]
# The external-frame product's profile. The service surface is the slim one --
# Guideline 4.7.2 makes every native capability something the embedding app has
# to justify to Apple, so the lane starts small and adds -- but it must not pull
# `migo-core/profile-slim`, which implies an embedded JavaScript engine. That is
# the whole distinction: same platform services, no engine.
external-frames = ["migo-core/external-frames", "graphics/profile-slim"]
worker-snapshot = ["migo-core/worker-snapshot"]
# The Rust image decoders (zune-image, the image crate), which every non-Android
# build already carries. The Java SDK's Android build leaves them out for
# BitmapFactory; the C ABI, which has no Java, turns them on (engine/crates/capi).
rust-image-decode = ["migo-io/rust-image-decode"]
v8-jitless = ["migo-core/v8-jitless"]
v8-limits = ["migo-core/v8-limits"]
code-signing = ["migo-core/code-signing"]
api-sensors = ["migo-core/api-sensors"]
api-media = ["migo-core/api-media"]
api-connectivity = ["migo-core/api-connectivity"]
api-commerce = ["migo-core/api-commerce"]
api-system = ["migo-core/api-system"]

[dependencies]
migo-core = { path = "../core", default-features = false }
shared = { package = "migo-shared", path = "../shared", default-features = false }
graphics = { package = "migo-graphics", path = "../graphics", default-features = false }
migo-io = { path = "../io", default-features = false }
crossbeam-channel = { workspace = true }
bytemuck = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
khronos-egl = { workspace = true }
libloading = "^0.8"
parking_lot = { workspace = true }

[dev-dependencies]
migo-core = { path = "../core", default-features = false, features = ["test-support"] }
# Test-only by construction: resolver 2 keeps a `[dev-dependencies]` entry out of every
# shipped build, which is what stops a probe crate reaching a cdylib.
migo-contention-probe = { path = "../../testing/contention-probe", default-features = false }

# On non-Android platforms, enable Rust-native implementations:
# - zip-extract: Unzip via Rust `zip` crate (Android uses java.util.zip via JNI)
# - codec-gbk: GBK encoding via `encoding_rs` crate (Android uses java.nio.charset via JNI)
[target.'cfg(not(target_os = "android"))'.dependencies]
migo-io = { path = "../io", default-features = false, features = ["zip-extract", "rust-image-decode"] }
shared = { package = "migo-shared", path = "../shared", default-features = false, features = ["codec-gbk"] }

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
tracing-android = { workspace = true }
