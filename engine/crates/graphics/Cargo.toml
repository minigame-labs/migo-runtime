[package]
name = "migo-graphics"
version.workspace = true
license.workspace = true
edition = "2024"

[lib]
name = "graphics"

[features]
# Default enables the embedded ICU data path so existing builds
# keep working unchanged.  To strip ~10 MiB from `libmigo.so`,
# build the workspace with
# `--no-default-features --features external_icudtl` and load
# `icudtl.dat` via the Android host bootstrap (see
# `MigoRuntime.initIcuData`).
default = ["profile-full"]
profile-full = ["embed_icudtl"]
profile-slim = ["embed_icudtl"]

# Embedded ICU data: baked into the .so at build time.  Lights up
# automatically when `default` is enabled.
embed_icudtl = ["skia-safe/embed-icudtl"]

# External ICU data: expects the host to load `icudtl.dat` before
# first text layout.  Mutually exclusive with `embed_icudtl`;
# turning this on also requires `--no-default-features` on the
# workspace build.
external_icudtl = []

# Gates the small-sprite texture atlas (`crate::atlas`) code
# paths (P1-13).  The atlas itself is always compiled so existing
# tests keep working, but `CanvasManager::maybe_atlas_small_image`
# and friends early-return `None` at runtime unless this feature
# is enabled, keeping the idle memory footprint of the engine at
# its pre-atlas levels until a profile-validated cutover.
experimental_atlas = []

[dependencies]
glow = { workspace = true }
khronos-egl = { workspace = true }
libloading = "^0.8"
tokio = { workspace = true }
skia-safe = { workspace = true }
crossbeam-channel = { workspace = true }
tracing = { workspace = true }
# `vfs` names the filesystem/package module and the `op_state` that holds its
# handles; `codec` the text codecs. Both are `shared` defaults, and this crate
# opts out of defaults, so they have to be asked for by name -- otherwise a
# whole-workspace build unifies them in and a single-crate build does not,
# which is the shape where one of the two is silently green.
shared = { package = "migo-shared", path = "../shared", default-features = false, features = ["vfs"] }
# The wire's definitions only (no dependencies of its own): the segments of a path carried by value, which the renderer
# builds paths from.
migo-frame-wire = { path = "../frame-wire", default-features = false }

parking_lot = "0.12.4"
bytemuck = { workspace = true }
lru = { workspace = true }
smallvec = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[dev-dependencies]
# The steady-state allocation gate. Reached only through a dev
# dependency so a `#[global_allocator]` cannot follow this crate into a shipped
# cdylib -- cargo enforces that, rather than a comment asking for it.
migo-alloc-probe = { path = "../../testing/alloc-probe", default-features = false }

# PNG encode/decode for golden image pixel-diff tests.
# Avoid the workspace `image` crate (drops PNG in release profile).
png = "0.17"
base64 = "0.22"
serde_json.workspace = true
