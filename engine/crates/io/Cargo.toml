[package]
name = "migo-io"
version.workspace = true
license.workspace = true
edition = "2024"

[lib]
name = "migo_io"

[features]
default = ["zip-extract", "rust-image-decode", "compress-brotli"]
zip-extract = ["dep:zip"]
# CPU-only resize of an already-decoded RGBA buffer.  Needs only the `image`
# crate's imageops; requires no format decoder.  A build that has a platform
# decoder (e.g. Android BitmapFactory via JNI) but still wants CPU-side resize
# can enable this feature alone without pulling in zune-image / zune-core.
cpu-image-resize = ["dep:image"]
# Full Rust image decoders (zune-image fast path + image crate fallback).
# Implies cpu-image-resize so that every build with the full decoder can also
# resize; removing this implication would silently disable resize for any
# caller that switches from rust-image-decode to a platform decoder later.
rust-image-decode = ["cpu-image-resize", "dep:zune-image", "dep:zune-core"]
compress-brotli = ["dep:brotli"]

[dependencies]
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
# `vfs` names the filesystem/package module and the `op_state` that holds its
# handles; `codec` the text codecs. Both are `shared` defaults, and this crate
# opts out of defaults, so they have to be asked for by name -- otherwise a
# whole-workspace build unifies them in and a single-crate build does not,
# which is the shape where one of the two is silently green.
shared = { package = "migo-shared", path = "../shared", default-features = false, features = ["vfs", "codec"] }
serde_json.workspace = true
parking_lot = "0.12.4"

# Image decoders — optional, excluded on Android (uses BitmapFactory via JNI)
image = { workspace = true, optional = true }
zune-image = { workspace = true, optional = true }
zune-core = { workspace = true, optional = true }

# LRU cache for decoded images
lru = { workspace = true }
memmap2 = "0.9"

# Base64 encoding for readZipEntry binary data
base64 = "0.22"

# Digest computation for getFileInfo API (md5/sha1/sha256)
digest = "0.10"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"

# Brotli decompression for readCompressedFile API — optional, behind "compress-brotli" feature
brotli = { version = "7", optional = true }

# Zip extraction — optional, disable default features to exclude bzip2/zstd/aes/lzma/xz/zopfli
# Only enable deflate (most common) to save ~200-400KB of compression codecs.
# NOTE: zip 2.x "deflate" feature pulls zopfli (compression encoder) even though we only
# decompress. The "deflate-flate2" feature alone doesn't activate flate2 in zip 2.4.x
# (upstream bug). Revisit when zip 3.x ships a decompression-only feature.
zip = { version = "2.2", optional = true, default-features = false, features = ["deflate"] }

# SQLite for KV storage. `bundled` statically links a vendored amalgamation
# so we don't depend on the platform's libsqlite (Android version drift,
# Google Play surface area, etc.). Default features are disabled to shrink
# the amalgamation — we only need the core KV surface (blob/TEXT + prepared
# statements). Further size trimming happens via the `LIBSQLITE3_FLAGS` env
# variable set by `scripts/build-android-so.sh`.
rusqlite = { version = "0.32", default-features = false, features = ["bundled", "blob"] }

# `O_NOFOLLOW` when creating a zip entry's output file, so the one path
# component a malicious archive controls cannot be redirected through a
# symlink. Already in the tree via memmap2 / tokio / parking_lot, so making it
# direct costs no binary size. Unix-only: the flag has no Windows counterpart.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
texture2ddecoder = "0.1.2"
tokio = { workspace = true, features = ["rt-multi-thread"] }
# Section 7.3's steady-state allocation gate. A dev-dependency by construction:
# the counting allocator must never be reachable from a shipped cdylib.
migo-alloc-probe = { path = "../../testing/alloc-probe", default-features = false }
