[package]
name = "migo-android-jni"
version.workspace = true
license.workspace = true
edition = "2024"

# `libmigo.so` — the artifact Android loads via `System.loadLibrary("migo")`.
# This crate is deliberately tiny: it owns only Android's JNI `cdylib`
# boundary. `platform` stays an rlib so its policy and presenters can be reused
# by host tests, native C packages, and standalone tools without imposing
# Android's artifact shape on any other target.
#
# `test = false` because it has no tests and its JNI half compiles only for Android,
# so a host test binary of it could only ever report zero. Cargo then builds none,
# and the host test audit asks no step to run one.
[lib]
name = "migo"
crate-type = ["cdylib"]
test = false

# Mirrored verbatim from `platform` so the build scripts can keep passing
# `--no-default-features --features profile-<slim|full>` unchanged.
[features]
default = ["profile-full"]
profile-full = ["platform/profile-full"]
profile-slim = ["platform/profile-slim"]
worker-snapshot = ["platform/worker-snapshot"]
v8-jitless = ["platform/v8-jitless"]
v8-limits = ["platform/v8-limits"]
code-signing = ["platform/code-signing"]
api-sensors = ["platform/api-sensors"]
api-media = ["platform/api-media"]
api-connectivity = ["platform/api-connectivity"]
api-commerce = ["platform/api-commerce"]
api-system = ["platform/api-system"]

[dependencies]
platform = { package = "migo-platform", path = "../platform", default-features = false }

# The JNI entry point is the only thing this crate contains, so `jni` is only
# needed where it is compiled.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
