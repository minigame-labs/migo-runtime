[package]
name = "migo-alloc-probe"
version.workspace = true
license.workspace = true
edition = "2024"
publish = false
description = "Counting allocator and burst assertion for the steady-state allocation gate. Test-only."

[lib]
name = "migo_alloc_probe"

[dependencies]

# Test utility only. Both already exist in the workspace's native closure.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
