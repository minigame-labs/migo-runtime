[workspace]
resolver = "2"

members = [
 "crates/android-jni",
 "crates/audio",
 "crates/capi",
 "crates/capi-abi",
 "crates/core",
 "crates/frame-decode",
    "crates/frame-wire",
 "crates/graphics",
 "crates/io",
 "crates/platform",
 "crates/runtime-v8",
 "crates/services",
 "crates/shared",
 "testing/alloc-probe",
 "testing/contention-probe",
 "testing/executor-probe",
 "tools/c-host-example",
 "tools/player",
 "tools/snapshot-gen",
]

# `crates/` is the engine; `tools/` is what builds or drives it; `testing/` is
# what measures it and ships nowhere. The engine/tools split is not cosmetic: the
# two desktop tools link X11/GL/Xlib, so a bare `cargo build`/`cargo test` used to
# fail on any machine (and every Android cross-check) that has no desktop graphics
# stack, which is why the contract scripts all carried `--exclude` lists.
# `default-members` keeps them in the workspace -- one lockfile, one `cargo update`,
# still buildable with `-p` -- while leaving them out of the default set.
#
# `testing/alloc-probe` is third-category on purpose. It declares a
# `#[global_allocator]`, which is unique per binary, so it must never be reachable
# from a shipped crate's `[dependencies]`; being a separate crate consumed only
# through `[dev-dependencies]` is what makes that cargo's rule instead of a promise.
default-members = [
 "crates/android-jni",
 "crates/audio",
 "crates/capi",
 "crates/capi-abi",
 "crates/core",
 "crates/frame-decode",
    "crates/frame-wire",
 "crates/graphics",
 "crates/io",
 "crates/platform",
 "crates/runtime-v8",
 "crates/services",
 "crates/shared",
 "testing/alloc-probe",
 "testing/contention-probe",
 "testing/executor-probe",
 "tools/snapshot-gen",
]

# Mirrors `release/VERSION`, which is the repository's single release-version
# source. Cargo cannot read a file here -- a manifest takes a literal -- so the
# two are held equal by `scripts/test-release-version-contract.sh` rather than by
# the format. Every member inherits it with `version.workspace = true`.
[workspace.package]
version = "0.9.7-rc.2"
license = "BSL-1.1"

[workspace.dependencies]
# Tokio runtime - avoid "full" feature, use only what's needed
tokio = { version = "1.46.1", default-features = false }
futures = "0.3.31"
serde = { version = "1.0.219", features = ["rc"] }
serde_json = "1.0.148"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream", "http2", "multipart"] }
# Note: reqwest "rustls-tls" already bundles webpki-roots (~100KB Mozilla root cert list).
# On Android, native root-store discovery may fail in some environments, causing
# WebSocket TLS handshake errors such as "no native root CA certificates found".
# Use webpki roots for tokio-tungstenite as well for deterministic behavior.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
thiserror = "2.0.12"
http = "1.0"
data-url = "=0.3.1"
bytes = "1.4.0"
glow = { version = "0.17", default-features = false }
khronos-egl = { version = "6", features = ["dynamic"] }

# Skia 2D renderer (Ganesh GL backend + SkParagraph text).
#   Features:
#     gl + egl        OpenGL ES + EGL context (required on Android)
#     textlayout      SkParagraph / SkShaper / HarfBuzz / ICU (browser-grade text)
#     binary-cache    would download prebuilt skia instead of compiling it, but
#                     never does for this feature set: rust-skia publishes no
#                     binary built with `embed-freetype`. Of the 13 prebuilt
#                     x86_64-unknown-linux-gnu archives in skia-binaries 0.93.1,
#                     zero carry the `ftembed` tag this combination asks for, so
#                     the lookup 404s and skia-bindings falls back to building
#                     from source -- every clean build, on CI and on a laptop.
#                     That is where host-engine-tests spends most of its ~50
#                     minutes, and it is why that job now caches its workspace.
#                     Kept enabled so the day a matching binary is published it
#                     starts being used; dropping `embed-freetype` to reach an
#                     existing archive would change what ships, not just how it
#                     is built.
#     embed-icudtl    bundle icudtl.dat (~10 MiB) into the binary
#     embed-freetype  bundle FreeType inside libmigo.so
#
# ICU packaging:
#   The default Skia feature set embeds `icudtl.dat` into libmigo.so,
#   adding ~10 MiB to the shipped .so.  Callers that prefer to ship
#   `icudtl.dat` as an APK asset (and load it at session init via
#   `MigoRuntime.initIcuData`) can build with the workspace flag
#   `--no-default-features --features external_icudtl`, which
#   rebuilds skia-safe without `embed-icudtl`.
#
#   The asset-based path requires a separate bootstrap step that
#   copies the asset to a known path and calls
#   `SkLoadICU(path)` / `SkInitializeICU` before the first text
#   layout call.
#
# `embed-icudtl` is opted in by the `graphics` crate's default
# feature set, not here, so downstream crates can build without
# it by passing `--no-default-features --features external_icudtl`
# (see `crates/graphics/Cargo.toml`).
# `egl` is deliberately absent: Migo assembles Skia's GL interface from the
# EGL implementation it injects itself (see Canvas2DContext::new), so Skia
# must not link an EGL of its own. Keeping it would also make Skia's
# GL-interface selection skip the Windows branch, leaving skia-bindings'
# unconditional MakeWin wrapper unresolvable there.
skia-safe = { version = "0.93", default-features = false, features = ["gl", "textlayout", "binary-cache", "embed-freetype"] }

# Image decoding - only enable formats actually needed
# Removing unused formats can save 500KB-1MB
image = { version = "=0.25.8", default-features = false, features = [
    "png",      # PNG format (fallback, JPEG handled by zune-image)
    # "jpeg",   # Removed: zune-image handles JPEG, avoids zune-jpeg 0.4 duplicate
    # "gif",    # GIF format
    # "webp",   # WebP format
    # "bmp",    # BMP format
    # "ico",    # ICO format
] }

# Fast image decoders - significantly faster than image crate
# zune-image: unified fast image decoder with SIMD, handles JPEG/PNG/BMP/etc
zune-image = { version = "0.5", default-features = false, features = ["jpeg", "png", "bmp", "simd"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }

# LRU cache for decoded images
lru = "0.18"
crossbeam-channel = "0.5.15"
parking_lot = "0.12"

tracing = { version = "0.1.41", default-features = false, features = ["std"] }
tracing-android = "0.2.0"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["std"] }
# `const_generics` is declared here rather than inherited: `graphics` uses
# `SmallVec<[u8; 65]>`, and without this feature smallvec implements `Array`
# only for a fixed set of sizes, so 65 is not one of them. It used to compile
# anyway because a larger package selection pulled the feature in through
# unification -- `cargo check -p migo-graphics` on its own failed on Linux and
# on Windows alike, which is how a Windows probe found a defect that was never
# Windows-specific.
smallvec = { version = "1.15.1", features = ["const_generics"] }
bytemuck = { version = "1.23.2", features = ["extern_crate_alloc"] }
deno_core = {version = "0.385.0", default-features = false}
zstd = { version = "0.13", default-features = false }
deno_error = "=0.7.3"


# =============================================================================
# Release Profile - Optimized for minimal binary size
# =============================================================================
[profile.release]
# Link-Time Optimization - enables cross-crate optimization
# "fat" is slower to compile but produces smaller binaries than "thin"
lto = "fat"

# Single codegen unit for maximum optimization opportunities
codegen-units = 1

# Optimize for size ("z" is more aggressive than "s")
opt-level = "z"

# Strip symbols from the final binary
strip = "symbols"

# Use abort on panic instead of unwinding (saves ~10-20KB)
panic = "abort"

# Disable debug info
debug = false

# Disable debug assertions
debug-assertions = false

# Disable overflow checks (saves a few KB)
overflow-checks = false

# Disable incremental compilation for better optimization
incremental = false

# =============================================================================
# Release Profile for Build Scripts
# =============================================================================
[profile.release.build-override]
opt-level = "z"
codegen-units = 1

# =============================================================================
# Release Profile for All Dependencies
# =============================================================================
[profile.release.package."*"]
opt-level = "z"
codegen-units = 1
debug = false

# =============================================================================
# Q14 Release Profiles - Hot workspace crates only
# =============================================================================
# These vary only the five audited hot workspace crates, so an Android device
# A/B is attributable to codegen level rather than to dependency or linker
# changes. `release` above stays the shipping build and the size baseline.
#
# hot2 has been measured, and the answer is no. On 2026-08-25, three interleaved
# rounds x three games on a Mate 30 Pro, twelve cells (first frame / game-ready /
# CPU / PSS): not one moved above the harness noise floor. What it costs is not
# in doubt -- `.so` +1,294,336 bytes (+3.2%), `.text` +1,507,336 (+5.2%) -- and
# that is 44,432 bytes past the `.text` budget in
# scripts/test-android-so-size-contract.sh, so the size gate rejects a hot2 AAR
# outright. Numbers, raw rows, and the two cells that cross the floor and then
# dissolve under paired deltas: ../migo-bench/CODEGEN.md.
#
# hot3 has NOT been measured. Do not infer it from hot2's table -- re-run the
# A/B (CODEGEN.md carries the invocation). The only thing hot3 inherits for free
# is the size direction: `opt-level = 3` does not emit smaller code than `2`,
# and `2` is already over budget.
#
# 2026-08-27, host microbenchmarks, and the reason they do not reopen the
# question. The GL state-shadow rewrite landed that day shipped eight A/B
# benchmarks (`cargo test --release -p migo-graphics --lib bench_ --
# --ignored`). Run at each codegen level on x86_64, they show `opt-level = "z"`
# to be 2.5-3.5x slower than `s` / `2` / `3` on the per-command dedup path, with
# `3` best or tied-best throughout. That looks like it contradicts hot2's device
# result. It does not, for two reasons, and both matter more than the ratio:
#
#   1. The path is small. Summed over one modelled frame -- per-command canvas
#      shadow lookup, GPU budget ledger, capability toggles, texture binds,
#      stencil, and 200 VAOs x 5 attributes -- `z` costs 26.5 us and `3` costs
#      14.8 us. Against 16.67 ms that is 0.16% of a frame, which is exactly the
#      shape of a result that dissolves into a device harness noise floor.
#      Three interleaved rounds on a Mate 30 Pro already said so.
#
#   2. The rewrite ate the headroom. The same composite over the *previous*
#      hash-keyed containers was 214 us at `z` and 68 us at `3` -- so before
#      that day, a codegen bump was worth ~146 us/frame on this path; after it,
#      ~11.7 us. Twelve and a half times less. Re-running the A/B against the
#      current tree is re-running it against a much smaller effect than the one
#      that already failed to register.
#
# So: measure the frame, not the microbenchmark. If a codegen bump is ever worth
# re-asking, the trigger is a profile showing the render thread CPU-bound in
# workspace code, not a ratio on a bench.
#
# They are kept, rather than deleted with the question they answered, because
# re-asking after the code changes should cost a build and not a reconstruction.
# test-q14-codegen-profiles.sh keeps them wired; it does not endorse shipping one.
[profile.release-hot2]
inherits = "release"

[profile.release-hot2.build-override]
opt-level = "z"
codegen-units = 1

[profile.release-hot2.package."*"]
opt-level = "z"
codegen-units = 1
debug = false

[profile.release-hot2.package.migo-audio]
opt-level = 2

[profile.release-hot2.package.migo-core]
opt-level = 2

[profile.release-hot2.package.migo-graphics]
opt-level = 2

[profile.release-hot2.package.migo-io]
opt-level = 2

[profile.release-hot2.package.migo-runtime-v8]
opt-level = 2

[profile.release-hot3]
inherits = "release"

[profile.release-hot3.build-override]
opt-level = "z"
codegen-units = 1

[profile.release-hot3.package."*"]
opt-level = "z"
codegen-units = 1
debug = false

[profile.release-hot3.package.migo-audio]
opt-level = 3

[profile.release-hot3.package.migo-core]
opt-level = 3

[profile.release-hot3.package.migo-graphics]
opt-level = 3

[profile.release-hot3.package.migo-io]
opt-level = 3

[profile.release-hot3.package.migo-runtime-v8]
opt-level = 3

# =============================================================================
# Dev Profile - Faster compilation for development
# =============================================================================
[profile.dev]
# Faster incremental builds
opt-level = 0
debug = true

[profile.dev.package."*"]
# Optimize dependencies even in dev mode
opt-level = 2
