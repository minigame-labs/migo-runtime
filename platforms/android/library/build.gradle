plugins {
    id 'com.android.library'
}

def supportedMigoAbis = ['arm64-v8a', 'x86_64']
def supportedMigoTargets = [
        'arm64-v8a': [arch: 'aarch64', triple: 'aarch64-linux-android'],
        'x86_64'   : [arch: 'x86_64', triple: 'x86_64-linux-android']
]
def migoAbis = providers.gradleProperty('migoAbis')
        .getOrElse(supportedMigoAbis.join(','))
        .split(',')
        .collect { it.trim() }
        .findAll { !it.isEmpty() }
        .unique()
if (migoAbis.isEmpty() || !supportedMigoAbis.containsAll(migoAbis)) {
    throw new GradleException("Invalid -PmigoAbis=${migoAbis}; expected arm64-v8a and/or x86_64")
}

def supportedMigoCodegenProfiles = ['z', '2', '3']
def migoCodegenProfile = providers.gradleProperty('migoCodegenProfile').getOrElse('z')
if (!supportedMigoCodegenProfiles.contains(migoCodegenProfile)) {
    throw new GradleException(
            "Invalid -PmigoCodegenProfile=${migoCodegenProfile}; expected z, 2, or 3")
}
def migoNativeProfileSuffix = migoCodegenProfile == 'z' ? '' : "-opt${migoCodegenProfile}"

def supportedMigoWorkerSnapshotValues = ['true', 'false']
def migoWorkerSnapshotValue = providers.gradleProperty('migoWorkerSnapshot').getOrElse('false')
if (!supportedMigoWorkerSnapshotValues.contains(migoWorkerSnapshotValue)) {
    throw new GradleException(
            "Invalid -PmigoWorkerSnapshot=${migoWorkerSnapshotValue}; expected true or false")
}
def migoWorkerSnapshot = migoWorkerSnapshotValue == 'true'
def migoWorkerSnapshotSuffix = migoWorkerSnapshot ? '-worker-snapshot' : ''

// Measurement build: V8 with --jitless (the HarmonyOS NEXT proxy). This suffix
// has to be mirrored here because Gradle recomputes the jniLibs directory
// rather than being handed the one build-aar.sh already resolved. Leaving it
// out is not a build failure -- the AAR is still named "-jitless" and still
// packages the JIT natives, so the A/B silently compares a build against
// itself. That is exactly how it failed the first time.
def supportedMigoJitlessValues = ['true', 'false']
def migoJitlessValue = providers.gradleProperty('migoJitless').getOrElse('false')
if (!supportedMigoJitlessValues.contains(migoJitlessValue)) {
    throw new GradleException(
            "Invalid -PmigoJitless=${migoJitlessValue}; expected true or false")
}
def migoJitless = migoJitlessValue == 'true'
def migoJitlessSuffix = migoJitless ? '-jitless' : ''

def supportedVerifiedReleasePackagingValues = ['true', 'false']
def migoVerifiedReleasePackagingValue = providers.gradleProperty('migoVerifiedReleasePackaging')
        .getOrElse('false')
if (!supportedVerifiedReleasePackagingValues.contains(migoVerifiedReleasePackagingValue)) {
    throw new GradleException(
            "Invalid -PmigoVerifiedReleasePackaging=${migoVerifiedReleasePackagingValue}; expected true or false")
}
def migoVerifiedReleasePackaging = migoVerifiedReleasePackagingValue == 'true'
def migoArtifactManifestToolValue = providers.gradleProperty('migoArtifactManifestTool')
        .getOrElse('')

// An explicit candidate may only configure a full-release artifact. The
// default property is false, so ordinary IDE sync and every shipping task keep
// their existing variant graph and native roots.
def requestedTasks = gradle.startParameter.taskNames.collect {
    it.tokenize(':').last().toLowerCase(Locale.ROOT)
}
def workerSnapshotNeutralTasks = [
        'clean', 'help', 'tasks', 'properties', 'projects', 'dependencies',
        'dependencyinsight', 'components', 'model', 'wrapper'
]
if (migoWorkerSnapshot && requestedTasks.any {
    !workerSnapshotNeutralTasks.contains(it) && !it.contains('fullrelease')
}) {
    throw new GradleException(
            'Worker snapshot requires a full release build task')
}

def sourceDateEpoch = providers.environmentVariable('SOURCE_DATE_EPOCH').getOrElse('')
Long sourceDateEpochMillis = null
if (!sourceDateEpoch.isEmpty()) {
    try {
        if (!(sourceDateEpoch ==~ /[0-9]+/)) {
            throw new NumberFormatException('not an unsigned integer')
        }
        sourceDateEpochMillis = Math.multiplyExact(Long.parseLong(sourceDateEpoch), 1000L)
    } catch (NumberFormatException | ArithmeticException ignored) {
        throw new GradleException(
                'Invalid SOURCE_DATE_EPOCH; expected non-negative Unix seconds that fit in milliseconds')
    }
}

// The repository's single release-version source. `rootProject.rootDir` is
// `platforms/android`, so the file sits two levels up.
def migoReleaseVersion() {
    def source = new File(rootProject.rootDir, "../../release/VERSION")
    if (!source.isFile()) {
        throw new GradleException("release version source missing: ${source.canonicalPath}")
    }
    def version = source.text.trim()
    if (version.isEmpty()) {
        throw new GradleException("release version source is empty: ${source.canonicalPath}")
    }
    return version
}

android {
    namespace 'com.migo.runtime'
    // Compile against the same level we target: compiling against an older SDK
    // hides the very behaviour changes `targetSdk` opts into, so the two move
    // together. `minSdk` does not -- see below.
    compileSdk 36

    // Output AAR file name
    project.archivesBaseName = "migo"

    defaultConfig {
        // Raised from 21 to 26 with the Skia renderer migration.
        // skia-bindings pins API 26 in its Android NDK preset (the first
        // Oreo API with full Vulkan support); matching that avoids ABI
        // mismatches between Skia and the Rust runtime.  <1.5% of Play
        // Store devices remain below API 26 as of April 2026.
        minSdk 26
        // Google Play has required API 36 for new apps and updates since
        // 2026-08-31 (an extension to 2026-11-01 could be requested). Migo ships
        // as an AAR, so the host app's own `targetSdk` decides its eligibility --
        // but the library has to be built and verified against 36 for a host to
        // be able to move, and the behaviour audit lives with the library.
        // Raising this does NOT raise `minSdk`: see scripts/test-android-sdk-levels-contract.sh.
        targetSdk 36
        versionCode 1
        // Read from the repository's single release-version source rather than
        // restated here. This value reaches an embedder through BuildInfo.VERSION,
        // and the AAR and the Android C-API SDK are built by different scripts --
        // which is how the two came to disagree, the AAR reporting one version
        // while the SDK metadata reported another.
        versionName migoReleaseVersion()

        consumerProguardFiles "consumer-rules-common.pro"

        ndk {
            abiFilters(*migoAbis)
        }
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions "product"
    productFlavors {
        full {
            dimension "product"
            buildConfigField "boolean", "MIGO_API_SENSORS", "true"
            buildConfigField "boolean", "MIGO_API_MEDIA", "true"
            buildConfigField "boolean", "MIGO_API_CONNECTIVITY", "true"
            buildConfigField "boolean", "MIGO_API_COMMERCE", "true"
            buildConfigField "boolean", "MIGO_API_SYSTEM", "true"
            proguardFile "proguard-full.pro"
            consumerProguardFiles "consumer-rules-full.pro"
        }
        slim {
            dimension "product"
            buildConfigField "boolean", "MIGO_API_SENSORS", "false"
            buildConfigField "boolean", "MIGO_API_MEDIA", "false"
            buildConfigField "boolean", "MIGO_API_CONNECTIVITY", "false"
            buildConfigField "boolean", "MIGO_API_COMMERCE", "false"
            buildConfigField "boolean", "MIGO_API_SYSTEM", "false"
            proguardFile "proguard-slim.pro"
            consumerProguardFiles "consumer-rules-slim.pro"
        }
    }

    buildTypes {
        release {
            // A library must not minify its own public API: R8 marks
            // MigoGameActivity's overridable hooks final, widens the documented
            // protected API to public, and renames the private RuntimeConfig
            // fields the native init reads by name via JNI -- each breaks an
            // external consumer of the shipped AAR. The size is in the native
            // .so, not the tiny classes.jar, so minifying Java saves ~nothing.
            // The consumer minifies using the shipped consumerProguardFiles.
            minifyEnabled false
        }
        debug {
            debuggable true
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDirs = []
            // Artifact manifests are generated only after `gradle clean` by
            // scripts/build-aar.sh. Keeping them under build/ prevents stale
            // identity from leaking into a later variant.
            assets.srcDirs = [
                    'src/main/assets',
                    "$buildDir/generated/migoArtifactManifest/assets"
            ]
            // include generated BuildInfo.java
            java.srcDirs += "$buildDir/generated/source/buildinfo"
        }
        full {
            jniLibs.srcDirs = ["../../../engine/jniLibs/full${migoNativeProfileSuffix}${migoWorkerSnapshotSuffix}${migoJitlessSuffix}"]
        }
        slim {
            jniLibs.srcDirs = ["../../../engine/jniLibs/slim${migoNativeProfileSuffix}${migoWorkerSnapshotSuffix}${migoJitlessSuffix}"]
        }
    }

    testOptions {
        unitTests {
            // Required for Robolectric: loads manifest, resources and the
            // android-all JAR so Activity, Handler and audio-API classes
            // are available in host JVM tests.
            includeAndroidResources = true
        }
    }
}

// A release AAR is a verified artifact only when build-aar.sh has generated
// and verified its per-slice identities. This gate prevents an accidental
// direct `gradle assemble*Release` from producing an unidentifiable package.
// The final AAR byte verification and external attestation still run in
// build-aar.sh after Gradle has completed.
def migoArtifactManifestRoot = layout.buildDirectory.dir(
        'generated/migoArtifactManifest/assets/migo/artifacts')
def migoArtifactManifestPackageRoot = layout.buildDirectory.dir(
        'generated/migoArtifactManifest')
['Full': 'full', 'Slim': 'slim'].each { variantName, productProfile ->
    def releaseNativeRoot = layout.projectDirectory.dir(
            "../../../engine/jniLibs/${productProfile}${migoNativeProfileSuffix}${migoWorkerSnapshotSuffix}${migoJitlessSuffix}")
    def gate = tasks.register("verifyMigoReleaseArtifactPackaging${variantName}") {
        group = 'verification'
        description = "Require verified Migo manifests before assembling ${productProfile} release"
        inputs.property('migoVerifiedReleasePackaging', migoVerifiedReleasePackagingValue)
        inputs.property('migoArtifactManifestTool', migoArtifactManifestToolValue)
        outputs.upToDateWhen { false }

        doLast {
            if (!migoVerifiedReleasePackaging) {
                throw new GradleException(
                        'Direct release assembly is unsupported; use scripts/build-aar.sh')
            }
            def manifestRoot = migoArtifactManifestRoot.get().asFile
            def indexFile = new File(manifestRoot, 'package-index.json')
            if (!indexFile.isFile()) {
                throw new GradleException("Verified package index is missing: ${indexFile}")
            }
            if (migoArtifactManifestToolValue.isEmpty()) {
                throw new GradleException(
                        'Verified release packaging requires the manifest tool from scripts/build-aar.sh')
            }
            def manifestTool = new File(migoArtifactManifestToolValue)
            if (!manifestTool.isFile() || !manifestTool.canExecute()) {
                throw new GradleException(
                        "Artifact manifest tool is missing or not executable: ${manifestTool}")
            }
            def packageRoot = migoArtifactManifestPackageRoot.get().asFile
            def verifyProcess = new ProcessBuilder(
                    manifestTool.absolutePath,
                    'verify-index',
                    indexFile.absolutePath,
                    packageRoot.absolutePath)
                    .redirectErrorStream(true)
                    .start()
            def verifyOutput = verifyProcess.inputStream.getText('UTF-8').trim()
            if (verifyProcess.waitFor() != 0) {
                throw new GradleException(
                        "Artifact manifest tool rejected the package index: ${verifyOutput}")
            }
            def index = new groovy.json.JsonSlurper().parse(indexFile)
            if (index.schema != 'migo-artifact-package-index/v1') {
                throw new GradleException("Unsupported package index schema ${index.schema}")
            }
            if (index.product_profile != productProfile) {
                throw new GradleException(
                        "Package index profile ${index.product_profile} does not match ${productProfile}")
            }
            if (index.build_type != 'release') {
                throw new GradleException(
                        "Package index build type ${index.build_type} is not release")
            }
            if (index.codegen_profile != migoCodegenProfile) {
                throw new GradleException(
                        "Package index codegen profile ${index.codegen_profile} does not match ${migoCodegenProfile}")
            }
            if (!(index.slices instanceof Collection) || index.slices.size() != migoAbis.size()) {
                throw new GradleException(
                        "Package index must contain exactly ${migoAbis.size()} requested slice(s)")
            }

            def sha256 = { File source ->
                if (!source.isFile()) {
                    throw new GradleException("Verified artifact input is missing: ${source}")
                }
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                source.withInputStream { input ->
                    byte[] buffer = new byte[64 * 1024]
                    int count
                    while ((count = input.read(buffer)) != -1) {
                        digest.update(buffer, 0, count)
                    }
                }
                digest.digest().encodeHex().toString()
            }
            def sha256Pattern = ~/[0-9a-f]{64}/
            migoAbis.each { abi ->
                def expectedTarget = supportedMigoTargets[abi]
                def manifestPath = "assets/migo/artifacts/slices/${abi}.json"
                def entries = index.slices.findAll { entry ->
                    entry instanceof Map && entry.manifest_path == manifestPath
                }
                if (entries.size() != 1) {
                    throw new GradleException(
                            "Package index must contain exactly one ${manifestPath}")
                }
                def entry = entries[0]
                def slice = new File(manifestRoot, "slices/${abi}.json")
                if (!slice.isFile()) {
                    throw new GradleException("Verified slice manifest is missing: ${slice}")
                }
                def sliceHash = sha256(slice)
                if (!(entry.manifest_sha256 instanceof String) ||
                        !(entry.manifest_sha256 ==~ sha256Pattern) ||
                        entry.manifest_sha256 != sliceHash) {
                    throw new GradleException(
                            "Package index manifest hash does not match ${manifestPath}")
                }
                def identity = new groovy.json.JsonSlurper().parse(slice)
                if (identity.schema != 'migo-artifact-manifest/v1' ||
                        identity.product_profile != productProfile ||
                        identity.build_type != 'release' ||
                        identity.codegen_profile != migoCodegenProfile) {
                    throw new GradleException(
                            "Slice identity profile/build/codegen does not match ${abi} release")
                }
                if (identity.target?.arch != expectedTarget.arch ||
                        identity.target?.triple != expectedTarget.triple ||
                        identity.target?.runtime_floor?.android_api != '26' ||
                        entry.arch != expectedTarget.arch ||
                        entry.target_triple != expectedTarget.triple) {
                    throw new GradleException(
                            "Slice target identity does not match Android API 26 ${abi}")
                }
                if (!(identity.artifact_id instanceof String) ||
                        !(identity.artifact_id ==~ sha256Pattern) ||
                        entry.artifact_id != identity.artifact_id) {
                    throw new GradleException(
                            "Package index artifact_id does not match ${abi} slice")
                }
                def nativeRoot = new File(releaseNativeRoot.asFile, abi)
                if (identity.hashes?.runtime_binary != sha256(new File(nativeRoot, 'libmigo.so'))) {
                    throw new GradleException(
                            "Slice JNI hashes do not match the release inputs for ${abi}")
                }
                // `libc++_shared.so` is shipped only when `libmigo.so` names it
                // in DT_NEEDED, which today none of the Android binaries does --
                // V8's archive carries Chromium's libc++ statically. So the file
                // and the hash must agree about whether they exist, and when both
                // do they must match. Demanding it unconditionally here is what
                // made "stop shipping a megabyte nobody loads" a build failure.
                def cxxFile = new File(nativeRoot, 'libc++_shared.so')
                def cxxHash = identity.hashes?.cxx_runtime
                if (cxxFile.isFile() != (cxxHash != null)) {
                    throw new GradleException(
                            "${abi}: libc++_shared.so is " +
                            (cxxFile.isFile() ? "present but unhashed" : "hashed but absent"))
                }
                if (cxxFile.isFile() && cxxHash != sha256(cxxFile)) {
                    throw new GradleException(
                            "Slice JNI hashes do not match the release inputs for ${abi}")
                }
            }
        }
    }
    tasks.configureEach { task ->
        if (task.name == "pre${variantName}ReleaseBuild" ||
                task.name == "assemble${variantName}Release" ||
                task.name == "bundle${variantName}ReleaseAar") {
            task.dependsOn(gate)
        }
    }
}

// ---------------------------------------------------------------------------
// Generate BuildInfo.java from gradle version
// ---------------------------------------------------------------------------
task generateBuildInfo {
    def outputDir = file("$buildDir/generated/source/buildinfo/com/migo/runtime")
    def versionName = android.defaultConfig.versionName ?: "0.0.0"
    def taskProjectDir = projectDir
    outputs.dir outputDir
    inputs.property("sdkVersion", versionName)
    inputs.property("sourceDateEpoch", sourceDateEpoch)
    // BuildInfo contains BUILD_TIME and COMMIT; always regenerate to avoid stale metadata.
    outputs.upToDateWhen { false }

    doLast {
        outputDir.mkdirs()
        def timestamp = new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'")
                .with { timeZone = TimeZone.getTimeZone("UTC"); it }
                .format(sourceDateEpochMillis == null
                        ? new Date()
                        : new Date(sourceDateEpochMillis))

        def commitHash = "unknown"
        try {
            def proc = "git rev-parse --short HEAD".execute(null, taskProjectDir)
            proc.waitFor()
            if (proc.exitValue() == 0) {
                commitHash = proc.text.trim()
            }
        } catch (Exception ignored) {}

        def ver = versionName
        def buildInfoFile = new File(outputDir, "BuildInfo.java")
        buildInfoFile.text = """\
package com.migo.runtime;

/**
 * Auto-generated by the Gradle build. Do not edit manually.
 */
public final class BuildInfo {
    /** SDK version string */
    public static final String VERSION = "${ver}";
    /** Build timestamp (UTC) */
    public static final String BUILD_TIME = "${timestamp}";
    /** Git commit hash */
    public static final String COMMIT = "${commitHash}";

    private BuildInfo() {}
}
"""
    }
}

// Ensure BuildInfo is generated before Java compilation
tasks.configureEach { task ->
    if (task.name.startsWith('compile') && task.name.endsWith('JavaWithJavac')) {
        task.dependsOn generateBuildInfo
    }
}
preBuild.dependsOn generateBuildInfo

dependencies {

    // Zero *shipping* dependencies - no AndroidX required.
    // All annotations are replaced with JavaDoc comments.
    //
    // JUnit is `testImplementation`, so it is on the unit-test compile/runtime
    // classpath only and never enters the published AAR. The host-JVM state
    // machines it exercises (VsyncSchedulerState, LifecycleRequestState, ...)
    // are deliberately free of android.* precisely so they can be tested here
    // rather than on a device.
    testImplementation 'junit:junit:4.13.2'
    // Robolectric is test-only: its Android shadows and android-all runtime
    // support host orchestration tests, and never enter the published AAR.
    testImplementation 'org.robolectric:robolectric:4.17'

    // The real org.json, test-only. The android.jar the unit-test classpath uses
    // is a stub whose every method throws "not mocked", so any host test over
    // code that builds a JSON result fails on the first `put`. The alternative
    // the platform offers -- `unitTests.returnDefaultValues = true` -- is
    // module-wide and turns every unmocked android.* call into a silent default,
    // which is the opposite of what a test should do. This shadows the stub for
    // `org.json` only, and never enters the AAR.
    testImplementation 'org.json:json:20240303'
}

// ---------------------------------------------------------------------------
// Mutation testing — pitest for the Java half of the SDK
// ---------------------------------------------------------------------------
//
// This is an Android *library* module (com.android.library), not a plain
// java/java-library module. The info.solidsoft.pitest Gradle plugin registers
// its DSL extension only after detecting a JavaPlugin, which com.android.library
// never applies — so we drive pitest directly as a JavaExec task, pulling the
// pitest JARs from their own dependency configuration.
//
// We target the `full` flavour / `Debug` build type for two reasons:
//   1. `full` enables MIGO_API_CONNECTIVITY and MIGO_API_SENSORS, so the BLE
//      and permission classes (the concurrency invariants we care most about)
//      are compiled in. `slim` strips them via BuildConfig flags, leaving a
//      mostly-empty mutation surface for exactly the code we want to gate.
//   2. `Debug` keeps the bytecode unobfuscated (minifyEnabled false in debug),
//      so R8 cannot rewrite mutants into dead code before pitest instruments.
//
// Run with:
//   cd platforms/android && ./gradlew :library:pitestFullDebug
//   Reports land in: library/build/reports/pitest/
//
// Read *test strength* (killed / covered), not the mutation score. Most of this
// package touches Android APIs; Robolectric now loads the orchestration classes
// in host tests, while genuinely device-bound microphone ownership and driver
// blocking remain no-coverage. The number that moves when a guard stops guarding
// is test strength.
//

// ---- pitest dependency configuration ----
configurations {
    pitestRuntime
}

dependencies {
    // pitest command-line entry point and its JUnit 4 test runner plugin. Kept in
    // a dedicated configuration so these JARs never enter the AAR, and so an
    // `--offline` build that does not invoke the task never resolves them.
    pitestRuntime 'org.pitest:pitest:1.16.1'
    pitestRuntime 'org.pitest:pitest-command-line:1.16.1'
    pitestRuntime 'org.pitest:pitest-entry:1.16.1'
}

// ---- pitestFullDebug task ----
tasks.register('pitestFullDebug', JavaExec) {
    group       = 'verification'
    description = 'Run PIT mutation testing against the fullDebug unit-test variant.'

    // Ensure compiled classes exist before pitest instruments them.
    // Also depend on the full test task so its classpath is resolved and
    // android.jar / stub-framework transforms are populated in the cache.
    dependsOn(
        'compileFullDebugJavaWithJavac',
        'compileFullDebugUnitTestJavaWithJavac',
        'generateFullDebugUnitTestStubRFile',
        'processFullDebugUnitTestJavaRes'
    )

    // pitest's main class lives in pitest-command-line.
    mainClass = 'org.pitest.mutationtest.commandline.MutationCoverageReport'

    // Declared rather than worked around. The classpath pitest must instrument is
    // whatever Gradle resolved for the unit-test task, and reading another task's
    // resolved state at execution time is exactly what the configuration cache
    // forbids -- without this the task fails with "Cannot reference a Gradle
    // script object from a Groovy closure". Resolving it at configuration time
    // instead would make every build, including `--offline` ones that never run
    // pitest, resolve this variant's whole test classpath. This is a
    // developer-invoked mutation run on no gate's path, so the honest trade is to
    // opt this one task out and leave the cache on for everything else.
    notCompatibleWithConfigurationCache(
        'reads the resolved fullDebugUnitTest classpath at execution time'
    )

    // The JARs pitest needs on ITS OWN classpath (not the tested code).
    classpath = configurations.pitestRuntime

    def classesDir       = layout.buildDirectory.dir('intermediates/javac/fullDebug/classes')
    def testClassesDir   = layout.buildDirectory.dir('intermediates/javac/fullDebugUnitTest/classes')
    def rJarDir          = layout.buildDirectory.dir('intermediates/compile_r_class_jar/fullDebug')
    def testRJarDir      = layout.buildDirectory.dir(
            'intermediates/compile_and_runtime_not_namespaced_r_class_jar/fullDebugUnitTest')
    def reportDir        = layout.buildDirectory.dir('reports/pitest')

    doFirst {
        // Build the list of args pitest will use to load and run the tests.
        // We borrow the testFullDebugUnitTest task's already-resolved classpath
        // rather than re-resolving fullDebugUnitTestRuntimeClasspath ourselves;
        // the latter fails with an attribute-ambiguity error when resolved from
        // within the same Android library project (it tries to consume :library
        // as a dependency of itself).
        def testTask = tasks.named('testFullDebugUnitTest').get()

        def cpEntries = [] as List<String>
        cpEntries << classesDir.get().asFile.absolutePath
        cpEntries << testClassesDir.get().asFile.absolutePath
        fileTree(rJarDir).include('*.jar').each    { cpEntries << it.absolutePath }
        fileTree(testRJarDir).include('*.jar').each { cpEntries << it.absolutePath }
        // Append the test task's runtime classpath (android.jar stub, JUnit 4,
        // hamcrest, etc.) — everything Gradle resolved when it last ran the tests.
        testTask.classpath.each { cpEntries << it.absolutePath }
        cpEntries = cpEntries.unique()

        // pitest accepts multiple --classPath arguments (one per entry).
        // Passing a single colon-joined string treats the whole value as ONE
        // opaque classpath element; pitest then cannot find the target classes.
        // Scope, overridable per run. The full package is 4,400 mutations and about
        // eight minutes, which is a per-batch cost, not a per-edit one -- narrowing to
        // the class under change brings it under a minute:
        //   ./gradlew :library:pitestFullDebug -PpitestClasses=com.migo.runtime.internal.TouchEventHandler*
        // The default stays the whole package so an unscoped run cannot quietly
        // measure less than the last one did.
        def targetClasses = project.findProperty('pitestClasses')
                ?: 'com.migo.runtime.internal.*'
        def targetTests = project.findProperty('pitestTests')
                ?: 'com.migo.runtime.internal.*'

        def pitestArgs = [
            '--reportDir',            reportDir.get().asFile.absolutePath,
            '--targetClasses',        targetClasses,
            '--targetTests',          targetTests,
            // A mutated test is not a finding. Without this the survivor count is
            // mostly mutations of the assertions themselves, which buries the
            // production survivors that are the point of running this.
            '--excludedClasses',      'com.migo.runtime.internal.*Test,com.migo.runtime.internal.*Test$*,com.migo.runtime.internal.AllocationProbe',
            '--sourceDirs',           'src/main/java',
            '--outputFormats',        'HTML,XML',
            '--timestampedReports',   'false',
            '--threads',              '4',
            '--verbose',              'false',
        ]
        cpEntries.each { pitestArgs.addAll(['--classPath', it]) }
        args = pitestArgs
    }
}
