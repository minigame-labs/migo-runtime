# Reuse task outputs across builds and across worktrees. Off until 2026-08-08,
# which meant every verification run recompiled and re-ran what the previous one
# had already proven -- on a repository whose verification entry point runs both
# product variants' unit tests.
# AGP 9 runs Java-resource compression transforms inside the daemon; on the
# robolectric runtime jars the 512 MiB default heap fails with "Java heap space"
# (PR CI, testFullDebugUnitTest/testSlimDebugUnitTest). Hosted runners have 16 GiB.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.workers.max=8
android.useAndroidX=true