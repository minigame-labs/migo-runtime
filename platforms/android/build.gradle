plugins {
    id 'com.android.library' version '9.5.1' apply false
    id 'com.android.application' version '9.5.1' apply false
}

// Every external module resolved by any project/variant must be present in the
// committed lock state. STRICT turns an unrecorded configuration into an error
// instead of silently teaching a release machine a new dependency graph.
allprojects {
    dependencyLocking {
        lockAllConfigurations()
        lockMode = org.gradle.api.artifacts.dsl.LockMode.STRICT
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

task assembleDebug {
    dependsOn ':library:assembleDebug'
    doLast {
        println "[INFO] Root assembleDebug completed (includes library:assembleDebug)"
    }
}

task assembleRelease {
    dependsOn ':library:assembleRelease'
    doLast {
        println "[INFO] Root assembleRelease completed (includes library:assembleRelease)"
    }
}

task assemble {
    dependsOn ':library:assemble'
    doLast {
        println "[INFO] Root assemble completed (includes library:assemble)"
    }
}
