name: Android Release Device Evidence

# One job owns the physical device for the entire run. Splitting install,
# performance, power, and conformance into parallel jobs lets them overwrite
# each other's package/process state and cannot prove they exercised one AAR.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Host app package built by the external device suite"
        required: true
        default: "com.example.migo.demo"
      duration:
        description: "Steady-state power measurement duration in seconds"
        required: false
        default: "60"
      test_suite_path:
        description: "External device-suite path, relative to this checkout"
        required: false
        default: "../migo-test-suite"
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: android-release-device
  cancel-in-progress: false

jobs:
  build-install-and-gate:
    runs-on: [self-hosted, android-device]
    timeout-minutes: 180

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # Named, because the action's default is `tools platform-tools` and
          # `tools` -- the SDK Tools package cmdline-tools replaced -- is gone from
          # the repository the runner's cmdline-tools 20.0 reads: sdkmanager
          # reports "Failed to find package 'tools'" and exits 1 before any step
          # that builds. Nothing here uses it; platform-tools is what adb comes from.
          packages: platform-tools

      - name: Install pinned Android NDK and cargo-ndk
        uses: ./.github/actions/setup-android-ndk

      - name: Cache Gradle downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: device-gradle-${{ hashFiles('platforms/android/**/*.gradle*', 'platforms/android/gradle/verification-metadata.xml', 'platforms/android/**/gradle.lockfile') }}

      - name: Fetch verified Android V8 inputs
        run: bash scripts/fetch-v8-archives.sh

      - name: Build current full release AAR
        run: |
          rm -rf platforms/android/dist
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          bash scripts/build-aar.sh --product-profile full release

      - name: Install current bytes and produce device evidence
        env:
          DEVICE_PACKAGE: ${{ github.event.inputs.package || 'com.example.migo.demo' }}
          DEVICE_DURATION: ${{ github.event.inputs.duration || '60' }}
          DEVICE_SUITE: ${{ github.event.inputs.test_suite_path || '../migo-test-suite' }}
        run: |
          ARTIFACT="platforms/android/dist/migo-$(cat release/VERSION)-android.aar"
          bash scripts/ci/run_android_device_evidence.sh \
            --artifact "$ARTIFACT" \
            --package "$DEVICE_PACKAGE" \
            --test-suite "$DEVICE_SUITE" \
            --source-revision "$GITHUB_SHA" \
            --duration "$DEVICE_DURATION" \
            --out-dir artifacts/android-release-evidence

      - name: Upload artifact-bound device evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-release-evidence-${{ github.sha }}
          path: |
            artifacts/android-release-evidence
            platforms/android/dist/migo-*-android.aar
          if-no-files-found: error
          retention-days: 30
