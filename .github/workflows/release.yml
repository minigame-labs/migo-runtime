name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # ── Job 1: Quality gate (same as PR CI, ensures tag is clean) ───────
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # No LFS download: freshness reads committed pointer oid/size identities.

      - name: Setup Python for contract gates
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install hash-pinned Python contract dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-deps
          --only-binary=:all: --require-hashes
          --requirement scripts/ci/requirements-contracts.txt

      # Block the release if any committed profile/ABI snapshot identity is
      # stale. Regenerate all affected products (see snapshots/README.md) before
      # tagging.
      #
      # The worker variant needs its own call: check-snapshot-freshness.sh
      # defaults --snapshot-kind to host, so the two profile calls below cover
      # neither worker blob. Measured before this line existed -- with
      # SNAPSHOT-worker-full-x86_64.bin.manifest.json perturbed, both host calls
      # exited 0 while the worker call exited 1, so a stale worker snapshot
      # reached a tag while the same push on a branch was red.
      - name: Check snapshot freshness
        run: |
          bash scripts/check-snapshot-freshness.sh --product-profile full
          bash scripts/check-snapshot-freshness.sh --product-profile slim
          bash scripts/check-snapshot-freshness.sh --snapshot-kind worker --product-profile full
          bash scripts/check-snapshot-freshness.sh --product-profile full --os linux
          bash scripts/check-snapshot-freshness.sh --snapshot-kind worker --product-profile full --os linux

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: rustfmt, clippy
          # The iOS device target's standard library, on a Linux runner. It is
          # what lets the engine-free closure gate below compile for a phone
          # here rather than only on the macOS lane -- the gate treats a missing
          # target as a failure, not a skip, so this is load-bearing.
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine -> target
          cache-on-failure: true

      - name: Check Rust formatting
        working-directory: engine
        run: cargo fmt --all -- --check

      # Several contract gates run cargo with `--locked --offline`: `--locked`
      # proves they cannot rewrite the lockfile, `--offline` proves they cannot
      # reach for a dependency that is not already pinned. Both are worth
      # keeping, but `--offline` needs a populated registry, and the rust-cache
      # key includes Cargo.lock -- so the first PR that changes the lockfile
      # (a crate rename, a dependency bump) gets a cache miss and every one of
      # those gates fails with "config.json not found in registry", which reads
      # like a registry outage rather than a cold cache. Fetching once here
      # populates it without giving the gates network access.
      - name: Populate the cargo registry for the offline gates
        working-directory: engine
        run: cargo fetch --locked

      - name: Install the pinned RustSec scanner
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Dependency advisory, source and license gate
        run: bash scripts/check-rust-supply-chain.sh

      - name: Supply-chain mutation contract
        run: bash scripts/test-supply-chain-contract.sh

      - name: Repository hygiene mutation contract
        run: bash scripts/test-repository-hygiene-contract.sh

      - name: Tracked publication hygiene gate
        run: python3 scripts/check-repository-hygiene.py --root .

      - name: Immutable workflow input gate
        run: python3 scripts/check-supply-chain.py actions --workflows-dir .github

      - name: Gradle wrapper, lock and checksum gate
        run: >-
          python3 scripts/check-supply-chain.py gradle
          --project-dir platforms/android --policy supply-chain.toml

      - name: C ABI and Surface candidate contract
        # gcc-multilib is what lets the ILP32 lane compile at all. Without it
        # the lane prints SKIPPED and passes, and the layout assertions for
        # 32-bit hosts go unchecked -- which is how `sizeof(MigoHostCallbacks)`
        # sat wrong on ILP32 for two appended fields before anyone compiled it.
        # `MIGO_ABI_REQUIRE_ILP32=1` turns a skip into a failure, so an install
        # that regresses is loud instead of invisible.
        # Same bounded install as the PR gate -- see pr-ci.yml for the 988s
        # mirror stall that made an unbounded one a job-killer.
        run: |
          can_target_m32() {
            printf 'int main(void){return 0;}' \
              | "$1" -m32 -ffreestanding -std=c11 -c -x c - -o /dev/null 2>/dev/null
          }
          install_multilib() {
            timeout 90 sudo apt-get update -qq || return 1
            timeout 150 sudo apt-get install -y -qq gcc-multilib || return 1
          }
          if ! can_target_m32 gcc || ! can_target_m32 clang; then
            install_multilib || {
              echo "multilib install stalled or failed; retrying once" >&2
              install_multilib
            }
          fi
          MIGO_ABI_REQUIRE_ILP32=1 bash scripts/test-c-abi-surface-candidate.sh
          CC=clang CXX=clang++ MIGO_ABI_REQUIRE_ILP32=1 bash scripts/test-c-abi-surface-candidate.sh

      - name: SurfaceAttachment lifecycle contract
        # ripgrep is not preinstalled on the runners, and the contract needs it
        # for its multiline patterns.
        run: |
          command -v rg >/dev/null 2>&1 || sudo apt-get install -y ripgrep
          bash scripts/test-surface-attachment-contract.sh
          bash scripts/test-x11-owned-connection-contract.sh

      - name: Platform/V8 dependency boundary contract
        run: bash scripts/test-platform-v8-boundary-contract.sh

      - name: Core/V8 dependency boundary contract
        run: bash scripts/test-core-v8-boundary-contract.sh

      - name: Foundation/runtime dependency boundary contract
        run: bash scripts/test-foundation-runtime-boundary-contract.sh

      - name: Platform services capability contract
        run: bash scripts/test-platform-services-capability-contract.sh

      # Source-only, so it runs here rather than in the NDK job: everything it
      # reads is a Rust file. It guards a value that no host test can reach --
      # `platform/src/android/**` compiles only on Android -- plus the two ways
      # the host-testable core it delegates to could stop being exercised.
      - name: Android frame-rate compatibility contract
        run: bash scripts/test-android-frame-rate-contract.sh

      # Three numbers nothing checked: `compileSdk`/`targetSdk` sat at 34 while
      # Play began requiring 36, and `minSdk` is a device-reach decision that
      # must not drift in either direction to make a target bump compile.
      - name: Android SDK levels contract
        run: bash scripts/test-android-sdk-levels-contract.sh

      - name: Release asset ordering contract
        run: bash scripts/test-release-asset-ordering-contract.sh

      # A release version is a fact about a set of bytes, and it was stated
      # independently in four build systems. They drifted: the Android AAR said
      # 0.9.0 while the Android C-API SDK beside it defaulted to 0.1.0, the Windows
      # SDK hardcoded 0.1.1 and discarded the version it had read, and HarmonyOS
      # fell back to 0.1.0 in silence. A package labelled with a version nobody
      # chose is not recallable.
      - name: Release version contract
        run: bash scripts/test-release-version-contract.sh

      # A fixed Change Date shrinks with every release made under it, and nothing
      # notices: a release cut after it passes is published under Apache-2.0 on day
      # one. The date is re-stamped each release as publication + 4 years; this
      # checks it is still a date, still ahead, still inside BSL's four-year cap,
      # and still what LEGAL.md and both READMEs tell readers.
      - name: License change date contract
        run: bash scripts/test-license-change-date-contract.sh

      # A release artifact that records when it was built cannot be rebuilt and
      # compared, which is what Phase 1's same-source byte equality rests on. The
      # AAR metadata recorded the SOURCE_DATE_EPOCH it was given and then stamped a
      # local wall clock on the next line; the SBOM and the committed snapshot
      # manifests did the same.
      - name: Reproducible timestamp contract
        run: bash scripts/test-reproducible-timestamp-contract.sh

      - name: Example content namespace contract
        run: bash scripts/test-content-namespace-contract.sh

      # Mirrors of pr-ci.yml's doc contract gates -- the release gate parity
      # contract requires the tag workflow to be at least as strict as the PR
      # one, and a release page is exactly where a stale `migo-X.Y.Z` in a
      # README, a missing `## v<version>` changelog section, a 404 doc link or
      # a wrong Rust version costs a reader.
      - name: Doc version-reference contract
        run: bash scripts/test-doc-version-refs-contract.sh

      - name: CHANGELOG release-section contract
        run: bash scripts/test-changelog-release-section-contract.sh

      - name: Doc links contract
        run: bash scripts/test-doc-links-contract.sh

      - name: Doc Rust-version contract
        run: bash scripts/test-doc-rust-version-contract.sh

      # The prescreen scanner is what a prospective customer runs against their own
      # bundle, so its wrong answers are the expensive kind: a gap it invents gets
      # checked, does not exist, and the rest of the report stops being believed.
      # It went un-gated for a while because it was git-ignored, and in that time it
      # learned to count string literals and assignments as API calls -- on one real
      # bundle, four reported gaps were really one. Fixture-driven and hermetic: no
      # player run, no device, so the scanner's logic is what is under test rather
      # than whatever the runtime happens to publish today.
      - name: Prescreen scanner contract
        run: bash scripts/test-prescreen-scanner.sh

      # The prescreen report tells a customer which published APIs their bundle
      # calls are inert. That list is derived from `@stub` markers in the engine
      # sources, and a marker that stops resolving -- a rename, a type name where
      # an entry point belongs -- silently shortens it with nothing red. The
      # report then quietly stops warning about a stub. Source-only, no device.
      - name: Stub surface contract
        run: bash scripts/test-stub-surface-contract.sh

      # Mirrors pr-ci.yml; test-release-gate-parity-contract.sh requires it.
      - name: Runtime answers are not invented
        run: bash scripts/test-runtime-answers-are-not-invented.sh

      # An input listener published to content must have native code that can
      # fire it. This caught `migo.onMouseDown` and friends being live on the
      # content surface with no producer anywhere -- registering them worked and
      # they simply never fired.
      - name: Input trigger producer contract
        run: bash scripts/test-input-trigger-producer-contract.sh

      # The runtime must not be able to mint an ad reward. `isEnded` on a
      # rewarded-video close is what content uses to pay the player, so it has
      # to originate in the host's ad SDK. A regression here is invisible in a
      # demo -- every callback still fires -- and only surfaces in someone's
      # revenue reconciliation weeks later.
      - name: Ad reward integrity contract
        run: bash scripts/test-ad-reward-integrity-contract.sh

      # Content must not reach the native op table. The migo namespace is
      # mirrored off globalThis before `harden_global_scope` removes deno_core's
      # internals, so anything hardening deletes has to be excluded from the
      # mirror too -- a published namespace's `.Deno.core.ops` once handed content 616 invocable ops.
      - name: Runtime internals not published contract
        run: bash scripts/test-runtime-internals-not-published.sh

      # Every op reaching a gated capability must ask the host first. A
      # permission system covering most of its surface advertises a guarantee it
      # does not hold, to a customer making a compliance decision on it -- so the
      # required set is derived from the sources, not from a register someone
      # has to remember to update.
      - name: Permission coverage contract
        run: bash scripts/test-permission-coverage-contract.sh

      # The gate above holds the *source* manifests to the policy, which is a
      # different claim from what a consumer installs: the merged manifest is what
      # ships, a dependency or a `tools:` directive can add a permission to it, and
      # nothing compared it until now. This holds the merged manifests to the same
      # table -- exactly, in both directions -- and states the set each profile
      # requests at API 26, 28 and 31.
      - name: Android merged manifest permission contract
        run: bash scripts/test-android-merged-manifest-permissions.sh

      # Cargo's RUSTFLAGS replaces `[target.<triple>].rustflags` rather than
      # merging, and the AAR build has to set RUSTFLAGS. For as long as it did
      # that blindly, every flag in the config was dropped on the one build that
      # ships: 3.47 MiB of `.text` that `--gc-sections` and `--icf=all` should
      # have removed. Costs nothing to run; builds nothing.
      - name: Android rustflags reach the linker
        run: bash scripts/test-android-rustflags-reach-the-linker.sh

      # Mirrors pr-ci.yml; test-release-gate-parity-contract.sh requires it.
      - name: Host-only gates nothing else runs
        run: |
          bash scripts/test-q14-codegen-profiles.sh
          bash scripts/test-gtk4-surface-capability.sh
          bash scripts/test-r7-ahb-image-decode.sh
          bash scripts/test-r8-install-receipt.sh
          bash scripts/test-r9-worker-snapshot.sh
          bash scripts/test-v8-gn-pin-contract.sh
          bash scripts/test-apple-frame-channel-contract.sh
          bash scripts/test-v8-patch-application-contract.sh

      - name: Every contract gate is invoked by something
        run: bash scripts/test-every-gate-is-invoked.sh

      # The host-bridge holder is reachable from content (`Symbol.for` reads the
      # global registry), and closing that is an all-or-nothing migration of
      # every call site -- one left behind evaluates against a deleted holder
      # and fails silently on the channel every async result travels. Until that
      # lands, the debt is pinned so it cannot grow unnoticed.
      - name: Host bridge channel inventory
        run: bash scripts/test-host-bridge-channel-contract.sh

      # Embedders compile against com.migo.runtime and ship that binding inside
      # their app, so a method that quietly changes shape costs them a release.
      # Read from the compiled classes rather than scraped from sources: a rule
      # for what "looks public" misses things, and what it misses is what
      # changes unnoticed.
      # quality-gate runs ./gradlew twice (this step and the merged-manifest
      # permission contract) but cached nothing, so every run re-downloaded the
      # wrapper distribution from services.gradle.org. That is a network round
      # trip a contract gate does not need, and it fails the job outright when
      # the download is reset mid-flight -- which it has been. Same cache the
      # Android build job already uses.
      - name: Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('platforms/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Android host API v0 contract
        run: |
          (cd platforms/android && ./gradlew --no-daemon :library:compileFullDebugJavaWithJavac)
          bash scripts/test-android-host-api-contract.sh


      - name: Bounded input transport contract
        run: bash scripts/test-input-transport-contract.sh

      - name: Android owned Host shutdown contract
        run: bash scripts/test-android-owned-host-shutdown-contract.sh

      - name: Camera frame JNI descriptor contract
        run: bash scripts/test-camera-frame-jni-contract.sh

      # A restart replaces the isolate but not the Android objects around it, so
      # an event a retired runtime's listener produces must carry the generation
      # that listener captured. Re-reading the live generation at report time
      # always matches, which is a check that cannot fail. Structural because it
      # has to be: five of the six producer groups need a Context or a main
      # Looper, so no host test can build one and restart a session behind it.
      - name: Runtime generation fence contract
        run: bash scripts/test-runtime-generation-fence-contract.sh

      # The engine resolves every outbound call on NativeExports by name *and*
      # descriptor, and the two sides are one contract written twice: string
      # literals in Rust, a method in Java, with nothing a compiler can tie
      # together. A mismatch fails GetStaticMethodID on a device, at the moment the
      # feature is first used. Measured: widening a descriptor and leaving the Java
      # method alone passes the profile contract, both R8 root checks, the host API
      # contract and javac -- the profile contract compares names, never shapes.
      - name: JNI outbound signature contract
        run: bash scripts/test-jni-outbound-signature-contract.sh

      # The third spelling of that same boundary: the stats packet crosses as a raw
      # little-endian byte[], so its layout is written twice and both sides compile.
      # A disagreement is not a crash but a number -- the overlay and
      # PerformanceSnapshot report a neighbouring counter under the wrong name, and
      # the Java test used to assert the offsets it was written against, so a reader
      # taking input_coalesced out of the Canvas2D tail agreed with its own test.
      # Instruments are what memory and CPU claims are argued from.
      - name: Stats packet offset contract
        run: bash scripts/test-stats-packet-offset-contract.sh

      # A GL constant the executor can hand to content must be one content can name.
      # A missing one is not an error but a silent wrong branch: `gl.THAT_NAME` is
      # `undefined`, which is a fine argument to a GL call and a fine thing to compare
      # against. That has shipped four times in 01_constants.js -- UNIFORM_BUFFER (a UBO
      # upload targeted undefined, nothing visible), INVALID_INDEX (the documented check
      # never took its branch), the whole WebGL 2 sync set (fenceSync got undefined as its
      # condition), and DRAW_FRAMEBUFFER (blitFramebuffer implemented and unreachable).
      # Fixing them one at a time did not converge; this derives the set instead.
      - name: WebGL constant reach contract
        run: bash scripts/test-webgl-constant-reach-contract.sh

      # The inbound half of the same boundary, and the same reason a compiler
      # cannot help: `platform/src/android/jni/**` is `cfg(target_os =
      # "android")`, so nothing in it is executed by any test on any machine here.
      #
      # Its field readers return a Result carrying the field name and the reason,
      # and every caller used to write `.unwrap_or(default)`. For a Java
      # primitive or enum that is never right -- those fields always have a
      # value, so a failed read means the field is not on the class this code
      # names, which is a host built against a different SDK. Defaulted silently,
      # a version mismatch looks exactly like a host that chose the default: a
      # host calling setLogLevel(INFO) could be read as WARN with nothing in the
      # log to say so, which is how the engine's own boundary counter came to
      # have never been observed working on a device.
      - name: JNI silent default contract
        run: bash scripts/test-jni-silent-default-contract.sh

      # The OpenHarmony API floor gate compares imports against a sysroot newer
      # than the floor. Choosing the wrong one does not fail -- it produces a
      # confident pass computed against the wrong symbol set, which is the shape
      # that stays green for months. The selection was a heredoc inside
      # build-ohos-sdk.sh and so had never been exercised; it is now a unit with
      # fixtures whose layouts make a name-ordering rule and an apiVersion rule
      # disagree, checked load-bearing by reinstating the wrong first draft (4 of
      # 8 cases go red).
      - name: OpenHarmony newer-sysroot selection contract
        run: bash scripts/test-ohos-newer-sysroot-selection.sh

      # The OpenHarmony floor is one decision written twice -- compatibleSdkVersion
      # in the app package and MIN_OHOS_API in the C SDK -- so raising it in one
      # place leaves the other advertising support nothing gates. The audited
      # sysroot is a third, different claim: it is deliberately stricter than the
      # published floor, so the invariant against it is an inequality. Both
      # directions checked load-bearing by injection.
      - name: OpenHarmony API floor declaration contract
        run: bash scripts/test-ohos-api-floor-declaration-contract.sh

      # Two Apple numbers that look like one: the deployment target the binary
      # loads on, and the lowest OS a given runtime lane is eligible for. The
      # superseded design collapsed them and paid user coverage for a build
      # simplification. This also sweeps the tree so the consumer added later
      # cannot quietly carry its own copy -- the check that survives, since the
      # per-file checks only see the consumers that exist today.
      - name: Apple deployment floor contract
        run: bash scripts/test-apple-deployment-floor-contract.sh

      # The lane a Session gets, and why. Checks the Swift reason-code mirror
      # against the policy from both directions -- a case with no policy entry
      # is a value nobody can read in a report, and a policy entry with no case
      # is a reason the resolver cannot emit. Both compile.
      - name: Apple profile policy contract
        run: bash scripts/test-apple-profile-policy-contract.sh

      # The one claim the whole iOS fast lane rests on: the Performance+ product
      # links no JavaScript engine. Content JavaScript runs in WebKit's
      # WebContent process, where the system grants a JIT this process cannot
      # have; an archive that also embedded an engine would pay twice for
      # working set and package size and get a JIT for neither.
      #
      # It reads the resolved dependency graph, because that is the only thing
      # that can answer it -- the violation this exists to catch is a
      # convenience dependency three levels down, and nothing about a crate's
      # public surface reveals one. The gate carries its own positive control:
      # the embedded build must still be reported as containing V8, so a clean
      # result cannot come from a detector that stopped working.
      - name: Apple Performance+ engine-free dependency closure
        run: bash scripts/test-apple-performance-rust-closure.sh

      # The other Apple closure, and it asks a different question. The gate
      # above asks what the Performance+ product links; this one asks whether
      # the three engine-free crates can be compiled for an iPhone AT ALL from a
      # machine with no Apple SDK.
      #
      # They could not, until `migo-shared`'s filesystem module became optional.
      # `migo-frame-decode` wanted four types from that crate and inherited its
      # whole capability set, including `zstd` -- a C library whose build script
      # shells out to `xcrun`. So every Apple fact about the decoder was only
      # obtainable on the macOS runner, and the failure named the reader's
      # toolchain rather than the dependency that caused it.
      #
      # It also holds a package-count ceiling per crate. These are parsers for
      # bytes produced by content JavaScript in another process, so a new
      # dependency is a widening of a trust boundary and should be a decision
      # somebody wrote down.
      - name: Apple engine-free layer cross-compiles from Linux
        run: bash scripts/test-apple-engine-free-closure.sh

      # The Swift package that is the only Swift a compiler ever sees.
      #
      # It exists because `platforms/apple/Package.swift` declares a binary
      # target for an xcframework built by an hour of Skia on a Mac, so until
      # that artifact exists nothing in that package compiles -- and what sat in
      # there uncompiled were the two files mirroring contracts/apple/*.json,
      # whose own gates compare text and would agree perfectly with a file that
      # does not build.
      #
      # Host-independent, so it runs here rather than only on the macOS lane:
      # what it checks is that the package still declares no binary target and
      # no dependencies, imports no engine module, and leaves no source
      # directory that SwiftPM would silently not compile.
      - name: Apple engine-free Swift package stays engine-free
        run: bash scripts/test-apple-swift-core-engine-free.sh

      # The other side of that boundary: the SHIPPING Apple package must consume
      # the xcframework it declares.
      #
      # While no target named the binary target, SwiftPM never had to resolve a
      # slice for the platform being built, so `swift build` in the Apple SDK
      # lane passed on an artifact it never opened -- the lane whose entire
      # purpose is to check that artifact was green while checking nothing about
      # it. The same walk also keeps the WebKit compatibility lane out of the
      # engine's dependency closure, which was a comment about intent until
      # something actually linked the engine and is a claim about bytes now.
      #
      # Host-independent: it reads the manifest and the build script, so it runs
      # here rather than only on the macOS lane that can act on it.
      - name: Apple shipping Swift package consumes the engine it declares
        run: bash scripts/test-apple-shipping-package-contract.sh

      - name: Apple SDK assembly preserves slices and runtime dependencies
        run: bash scripts/test-apple-sdk-packaging.sh

      # ANGLE-Metal is what fills the hole apple-sdk.yml measured: there is no GL
      # framework on iOS, so the renderer has no GL to link. Building it is a
      # 12 GB checkout and half an hour on a macOS runner (.github/workflows/apple-angle.yml),
      # but the properties that decide whether that build is CORRECT are all
      # checkable here in a second.
      #
      # Two of them cost a real checkout to learn. `target_os="ios"` alone is not
      # a configuration -- gn asserts target_environment is device or simulator --
      # and a recipe that set the wrong one would build successfully and produce a
      # simulator library shipped as a device library. And ANGLE has to be built
      # for exactly the slices scripts/build-apple-sdk.sh builds the engine for,
      # because both xcframeworks are linked into one application; if the two
      # lists ever disagree, the failure lands in a consumer's link step naming
      # neither script.
      - name: The Apple ANGLE recipe is total, derived and fails closed
        run: bash scripts/test-apple-angle-recipe-contract.sh

      # The pin is complete, hashed, and nothing downstream names an asset or a
      # hash itself. Beside the recipe gate because they check the two halves of
      # one lock file: the recipe gate keeps the SOURCE half derived, this keeps
      # the ARTIFACT half honest. Neither needs a Mac.
      - name: The Apple ANGLE pin is complete and fetched by hash
        run: bash scripts/test-apple-angle-pin-contract.sh

      # The same question about the other downloaded dependency, and it is the
      # sharper of the two. `apple-skia-gl-env.sh` points macOS builds at Skia
      # archives this project published with `skia_gl_standard=""`; upstream's
      # are compiled with `SK_ASSUME_GL=1`, under which every Canvas2D surface on
      # macOS fails to build a GrDirectContext and NOTHING goes red -- WebGL does
      # not go through Skia and nothing else asks. So an asset that 404s costs
      # eight minutes, and an asset that was replaced costs the defect returning
      # invisibly. No Mac needed: it is a download and a hash.
      - name: The corrected macOS Skia is published and unchanged
        run: bash scripts/test-apple-skia-pin-contract.sh

      # The rule that decides whether ANGLE loads at all, held between the two
      # places that state it. A release is the last point at which the presenter
      # naming a library the published archives do not contain is still cheap to
      # find: after this it is a device-only failure at `eglGetDisplay`.
      - name: The Apple presenter opens the ANGLE the recipe produces
        run: bash scripts/test-apple-egl-loader-name-contract.sh

      # A release is the last cheap moment to notice that the renderer and the C
      # ABI stopped naming the same surface kind. After it, the symptom is a host
      # that preflights, is told its own surface kind is not attachable, and
      # declines to render.
      - name: The Apple renderer and the C ABI name the same surface kind
        run: bash scripts/test-apple-host-surface-kind-contract.sh

      # A release publishes these headers. An output record whose caller-owned
      # `struct_size` contract is undocumented ships a refusal that integrators
      # cannot explain from the header they were given.
      - name: Every caller-owned output record documents its struct_size input
        run: bash scripts/test-capi-output-record-doc-contract.sh

      # The macOS V8 source pin agrees with cargo, the peer locks, the Apple
      # deployment floor and the fetch script. Every number in that lock is also
      # stated somewhere with more authority, and a pin that drifts from one of
      # them fails later as somebody else's bug -- a `v8_revision` a version
      # behind yields an archive whose `src_binding.rs` describes a different V8
      # API, and the error lands in a consumer's link step naming neither file.
      #
      # It also asserts the artifact half is ABSENT rather than half-present: no
      # macOS runner has built these bytes yet, so a lock carrying their hashes
      # would be the worse failure.
      - name: The macOS V8 source pin agrees with its neighbours
        run: bash scripts/test-apple-v8-pin-contract.sh

      # macOS ships bash 3.2, where expanding an EMPTY array under `set -u` is an
      # unbound-variable error rather than nothing. Linux's bash 5 expands it to
      # nothing, so the entire class is invisible here and fatal there -- and
      # `scripts/build-apple-sdk.sh` carried two instances of it, which meant two
      # of its three documented invocations could never have worked on the only
      # OS that can run it. Nobody knew because the script had never been run.
      #
      # Scope is derived from the workflows: whichever scripts a `macos-*` job
      # invokes are the ones checked. A list kept in the gate would go stale the
      # first time a step was added, and a stale scope reads like a clean result.
      - name: macOS-facing scripts survive bash 3.2
        run: bash scripts/test-macos-bash32-contract.sh

      # The Apple product cannot be compiled on this runner -- it needs Skia built
      # by an Apple SDK -- so the cheap way to notice it has drifted is to compare
      # what Cargo RESOLVES for it against a target that is compiled here daily.
      #
      # The drift this catches spent the whole life of the external-frame product
      # in the tree: `migo-core` calls `enable_io()`, tokio puts that behind
      # `feature = "net"`, and `migo-core` never declared it. Linux and Android
      # supplied it from `migo-shared`'s target-gated dependency, so the omission
      # was invisible -- and iOS, which has neither that gate nor
      # `migo-runtime-v8`, could never have compiled at all.
      - name: Apple and Linux Performance+ products resolve alike
        run: bash scripts/test-apple-product-feature-parity.sh

      # The same claim, asked of the bytes rather than the dependency graph.
      # A closure that resolves clean is necessary and not sufficient: what
      # ships is an archive, and the question a customer's linker asks is
      # whether V8's symbols are in it. This builds the external-frames product
      # and audits the archive it produced.
      - name: Apple Performance+ archive contains no engine symbols
        run: |
          cd engine
          cargo build -p migo-capi --no-default-features --features external-frames
          cd ..
          bash scripts/test-apple-performance-rust-closure.sh \
            --artifact engine/target/debug/libmigo_capi.a

      # The other half of the wire contract. The format says two encoders are
      # measured against one fixed corpus; the JavaScript one runs inside
      # WebContent and cannot be checked by any Rust test, so it gets its own
      # step. The corpus carries 128-bit and 64-bit values on purpose: a
      # JavaScript encoder that reached for Number instead of BigInt is correct
      # for every value written by hand and wrong for a real session's identity.
      - name: Frame wire JavaScript encoder against the golden corpus
        run: bash scripts/test-frame-wire-js-encoder.sh

      # Three tables name the same opcodes: the Rust wire format, the in-process
      # JavaScript encoder, and the WebContent producer. A record header is
      # twelve bits of opcode and twenty of word count, so nothing across that
      # boundary is typed -- a disagreement is a frame that does not draw, on a
      # device, rather than anything that fails to build.
      - name: Render opcode table agreement
        run: bash scripts/test-render-opcode-agreement.sh

      # The G0 decision procedure, months before the first Mac. Its input needs
      # a device; its rules do not, and the alternative is finding out on lab
      # day that the thing turning measurements into a choice has a bug. Each
      # case breaks one evidence rule -- simulator data, half a matrix, arms the
      # data does not separate -- and checks that the tool refuses.
      # A command that waits for an answer is a decision, so it is written down.
      # The Apple Performance+ lane runs content in an agent whose ability to
      # block is the whole difference between the two candidate topologies -- a
      # Window main agent's `[[CanBlock]]` is false, so a synchronous reply
      # there is not slower, it is impossible. On Android each of these stalls
      # the JavaScript thread for a round trip, and two are polled every frame.
      # The list is derived from the protocol enums; the contract classifies it.
      - name: Synchronous surface contract
        run: bash scripts/test-synchronous-surface-contract.sh

      # `isEnabled` is answered on the producer side, from a ten-bit shadow of
      # the capabilities content has enabled. A capability missing from the
      # JavaScript half of that table is silent: the query answers `false`
      # forever for something the driver has genuinely turned on.
      - name: WebGL capability table contract
        run: bash scripts/test-webgl-capability-table-contract.sh

      - name: Apple probe decision procedure
        run: bash scripts/test-apple-probe-decision.sh

      # The harness half of the same lab day. The decision tool refuses a whole
      # run over one missing field, so a record shape that disagrees with the
      # contract turns a session on borrowed devices into a folder of JSON that
      # decides nothing -- and says so only once the devices are gone.
      - name: Apple probe records match their contracts
        run: bash scripts/test-apple-probe-record-contract.sh

      # G0.3's static half. The loopback origin is cleartext, and the one-line
      # way to make it load is to turn App Transport Security off for
      # everything -- which measures a configuration the product cannot ship.
      - name: The probe app needs no exemption the product cannot ship
        run: bash scripts/test-apple-probe-app-ats-contract.sh

      # The runner's two refusals, executed rather than read. Gate 1's answers
      # include two nobody can query -- Lockdown Mode and the local-network alert
      # -- so an unattended device run records them as not_probed, and admit.py
      # then calls every arm that needed one unmeasured. On the page that reads as
      # an arm the device ruled out, which is what the first unattended run of
      # this gate actually produced.
      - name: The probe runner refuses an unattested device run
        run: bash scripts/test-apple-probe-run-contract.sh

      # The WebKit Full lane's compliance surface, which is the fact an App Store
      # submission rests on. 4.7.2 requires Apple's prior permission before an app
      # exposes native APIs to mini games, so a bridge method present in the
      # runtime and absent from the contract is exactly the finding that guideline
      # produces -- and it is invisible, because the file a reader checks is the
      # contract and the file content meets is the Swift.
      - name: The WebKit Full surface says one thing in both files
        run: bash scripts/test-apple-webkit-surface-contract.sh

      - name: OpenHarmony host and package metadata contracts
        run: |
          bash scripts/test-ohos-host-contract.sh
          bash scripts/test-ohos-package-metadata-contract.sh

      - name: Linux SDK packaging tooling
        # Unit tests only. The packaging gate itself
        # (scripts/test-linux-sdk-contract.sh) needs the Debian bullseye
        # sysroot, a linux-gnu V8 archive and lld, none of which a stock runner
        # has -- it runs on the release machine after scripts/build-linux-sdk.sh.
        # These tests cover the parsers that gate depends on, and they are where
        # the subtle failures were: a substring match that counted local-dynamic
        # relocations as local-exec, and an export audit that read nm instead of
        # objdump and so reported 190 exports for a library that exports 12.
        #
        # Discovered rather than listed. The list this replaced had drifted: it
        # omitted test_collect_render_metrics.py, test_compare_render_results.py and
        # test_v8_source_proof.py, so those never ran here -- and the last of them
        # guards the provenance proof behind every V8 component manifest.
        run: |
          python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py'

      - name: Artifact manifest tooling and contract
        run: |
          cargo fmt --manifest-path tools/artifact-manifest/Cargo.toml -- --check
          cargo test --manifest-path tools/artifact-manifest/Cargo.toml --locked
          bash scripts/test-artifact-manifest-contract.sh

      # An attestation is worth something only if the bytes it swears to can be
      # arrived at independently. Until scripts/package-sdk.sh existed, every
      # migo-sdk-*.tar.gz was a `tar` typed on a release machine: the published
      # Linux archive records the builder's account as the owner of every entry and
      # that machine's wall clock as every mtime, so its package_sha256 is a number
      # only that machine could produce. This packages a synthetic prefix twice and
      # fails if the two runs differ.
      - name: SDK release packaging contract
        run: bash scripts/test-sdk-package-reproducibility-contract.sh

      # Scope to the host-buildable crates (graphics needs skia/EGL, audio needs
      # alsa — system deps absent on this runner) and cap lints to warn against
      # the pre-existing backlog. Mirrors pr-ci.yml so the tag gate matches PR CI.
      - name: Run clippy lints (host-buildable crates)
        working-directory: engine
        run: cargo clippy -p migo-shared -p migo-io -p migo-runtime-v8 -p migo-capi-abi -p migo-frame-wire -p migo-frame-decode -p migo-alloc-probe -p migo-contention-probe -p migo-executor-probe --all-targets

      # `--tests` mirrors pr-ci.yml: `--lib` skipped the frame-boundary allocation
      # gate (shared/tests/frame_cycle_allocation.rs) and both snapshot round-trips,
      # so the tag gate was narrower than the PR gate on the binaries that exist
      # because a property belongs to a binary rather than to a lib.
      - name: Run Rust tests (host-buildable crates)
        working-directory: engine
        run: |
          cargo test -p migo-shared -p migo-runtime-v8 --tests
          # `--tests` so the ASTC fixture emitter in `tests/` is compiled here.
          # Its cases are `#[ignore]`d and belong to the ASTC gate, but a
          # binary nothing builds is one that stops building unnoticed.
          cargo test -p migo-io --tests
          cargo test -p migo-capi-abi --all-targets
          cargo test -p migo-frame-wire --all-targets
          cargo test -p migo-frame-decode --all-targets
          # The other half of that crate's feature arrangement: the reader must
          # still build with the packet builder excluded, which is how the
          # shipping path takes it. Proving it here makes the exclusion a
          # checked fact instead of a comment.
          cargo build -p migo-frame-wire --no-default-features
          cargo test -p migo-alloc-probe
          cargo test -p migo-contention-probe
          cargo test -p migo-executor-probe
        env:
          RUST_BACKTRACE: 1

      - name: Shell script syntax check
        run: bash -n scripts/*.sh scripts/ci/*.sh platforms/*/spike/*.sh

      - name: Artifact manifest Python syntax check
        run: |
          python3 -m py_compile \
            scripts/gen-android-package-metadata.py \
            scripts/gen-linux-package-metadata.py \
            scripts/generate-android-artifact-manifests.py \
            scripts/write-android-build-metadata.py \
            scripts/write-linux-build-metadata.py \
            scripts/write-linux-v8-component-manifest.py \
            scripts/write-v8-component-manifest.py \
            scripts/verify-android-aar-manifests.py

      - name: Product profile and R8 contract gates
        run: |
          bash scripts/test-product-profiles.sh
          bash scripts/test-r8-profile-contract.sh

      # The local verification entry point decides which target builds a change
      # needs. Its own answer has to be checked: an under-reporting selector reads
      # as "this change needs nothing", which is how three Android compile errors
      # rode a green host loop for several sessions.
      - name: Local verification entry point contract
        run: bash scripts/test-local-verification-contract.sh

      - name: Python script syntax check
        run: |
          python3 -m py_compile \
            scripts/ci/compare_baseline.py \
            scripts/ci/check_migo_test_suite.py \
            scripts/gen-android-package-metadata.py \
            scripts/gen-linux-package-metadata.py \
            scripts/generate-android-artifact-manifests.py \
            scripts/write-android-build-metadata.py \
            scripts/write-linux-build-metadata.py \
            scripts/write-linux-v8-component-manifest.py \
            scripts/write-v8-component-manifest.py \
            scripts/verify-android-aar-manifests.py

      # When this was written, ten pr-ci quality-gate steps were absent from
      # release.yml's quality-gate: Release asset ordering contract, Release version
      # contract, Reproducible timestamp contract, Android merged manifest permission
      # contract, Runtime generation fence contract, JNI outbound signature contract,
      # OpenHarmony newer-sysroot selection contract, OpenHarmony API floor
      # declaration contract, Local verification entry point contract, and Python
      # script syntax check. The three release-specific gates did not run on the
      # workflow that cuts releases. This step fails whenever that gap reopens.
      - name: Release gate parity contract
        run: bash scripts/test-release-gate-parity-contract.sh

  # ── Job 2: Linux Qt Host Kit (isolated source contract; no V8/LFS) ──
  linux-qt-host-kit:
    runs-on: ubuntu-24.04
    # Normally 1-2 min. The ceiling is headroom for the bounded apt retries
    # above, so a slow mirror costs a retry rather than the whole job.
    timeout-minutes: 25

    steps:
      - name: Checkout (without LFS)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Install Qt/X11 Host Kit dependencies
        # Bounded and retried like the other apt steps; see pr-ci.yml for the
        # stall this guards against. A release is the worst place to discover a
        # slow mirror, because the tag has already been pushed.
        run: |
          # `update` is advisory. Against a mirror that is down, apt retries
          # internally and reports `Ign:` per index, then falls back to the
          # indexes already on the image -- from which these packages still
          # install. Bounding it and treating that as fatal turned a survivable
          # mirror outage into a failed job, which is what happened here when
          # azure.archive.ubuntu.com went dark. Still bounded, so a hung mirror
          # cannot sit on the runner.
          timeout 180 sudo apt-get update \
            || echo "apt-get update incomplete; continuing on the image's indexes" >&2
          # The install is the real gate: if the packages cannot be had, the
          # contract below cannot run, so this one fails the step.
          install_pkgs() {
            timeout 300 sudo apt-get install -y \
              cmake ninja-build g++ ripgrep xvfb xauth \
              qt6-base-dev qt6-base-dev-tools qt6-qpa-plugins \
              libx11-dev libxkbcommon-x11-dev libxcb-cursor0 \
              libasound2-dev || return 1
          }
          install_pkgs || {
            echo "Qt/X11 package install failed; retrying once" >&2
            install_pkgs
          }

      # --sanitize reruns the same binaries under ASan/UBSan. Enforced here
      # rather than left to a developer's machine: the input tests count
      # allocations, and that counter has to use ASan's hook instead of
      # interposing malloc, so the combination breaks silently if nobody runs it.
      - name: Linux Qt Host Kit contract
        run: bash scripts/test-linux-qt-host-kit.sh --sanitize

      # The Linux player is the conformance suite's *reference* runner: every
      # other platform must produce the same verdict lines from the same
      # bundles, so if it does not build, the cross-platform claim has no
      # referee. It is a workspace member but not a default member (it links
      # X11/GL, which headless jobs do not have), so `cargo build` never reaches
      # it -- and a signature change in `migo-core` broke it while pr-ci stayed
      # green on every job. This is the one Linux job that installs the desktop
      # stack, so it is where the player can be type-checked at all.
      - name: Linux player type-checks
        run: cd engine && cargo check -p migo-player --locked

  # ── Job 4: Host engine tests — graphics, core, capi, platform, audio ─
  # These five crates' test suites ran in no release job: the AAR build cross-
  # compiles them and runs nothing. Mirrors pr-ci.yml's host-engine-tests job
  # exactly (same packages, same system deps, same flags) so the tag gate is
  # not narrower than the PR gate on the crates that need a graphics stack.
  # NO Rust cache, same reason as the Android job: Swatinem/rust-cache prunes
  # librusty_v8.a while keeping the fingerprint fresh, which fails the link on
  # the second run.
  host-engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: clippy

      # This job compiles Skia from source, which fetches a large tarball from
      # codeload.github.com on every run. Uncached that is both the slowest step
      # here and a recurring flake: a 429 from that host failed this job outright
      # on an unrelated PR. quality-gate and build already cache the same
      # workspace; this job was the one longest-pole job left without it.
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine -> target
          cache-on-failure: true

      - name: Install the engine's host build dependencies
        # Bounded and retried like the other apt steps; see pr-ci.yml for the
        # stall this guards against.
        run: |
          # Advisory for the same reason as the Qt job: a mirror that is down
          # makes `update` report per-index failures, and the packages still
          # install from the indexes already on the image.
          timeout 180 sudo apt-get update -qq \
            || echo "apt-get update incomplete; continuing on the image's indexes" >&2
          install_pkgs() {
            timeout 300 sudo apt-get install -y -qq \
              ninja-build \
              libgl-dev libegl-dev libgles-dev \
              libgl1-mesa-dri libegl-mesa0 \
              libfontconfig1-dev libfreetype-dev \
              libasound2-dev || return 1
          }
          install_pkgs || {
            echo "host build dependency install failed; retrying once" >&2
            install_pkgs
          }

      # The ASTC encoder, checked by a decoder that is not ours.
      #
      # ASTC packs eleven bits of block mode whose layout is a five-row table,
      # endpoint values as base-three trits interleaved with raw bits, and
      # weights written from the top of the block downwards in reverse bit
      # order. A misreading of any of those lands in an encoder and in a decoder
      # written by the same author from the same specification, so the oracle is
      # whatever ASTC decoder the GL stack ships -- here Mesa's software one.
      #
      # It lives in this job rather than quality-gate because this is the job
      # that owns a GL stack, which is the rule test-every-gate-is-invoked.sh
      # states for a gate needing a toolchain: it goes where that toolchain is.
      #
      # A host whose decoder does not do ASTC fails rather than skips. That is
      # deliberate -- it cannot answer the question, and reporting that as
      # success is how a check stops being one -- and it means this step is also
      # the thing that tells us if a runner image regresses.
      - name: ASTC encoder round trip
        run: bash scripts/test-astc-encoder.sh

      - name: Run clippy lints (crates needing host system packages)
        working-directory: engine
        run: cargo clippy -p migo-graphics -p migo-core -p migo-capi -p migo-platform -p migo-audio --all-targets

      - name: Run Rust tests (graphics, core, capi, platform, audio)
        working-directory: engine
        run: |
          cargo test -p migo-graphics --tests
          cargo test -p migo-core --lib
          cargo test -p migo-capi --lib
          cargo test -p migo-platform --lib
          cargo test -p migo-audio --lib
        env:
          RUST_BACKTRACE: 1

  # ── Job 5: Release AAR build ────────────────────────────────────────
  release-android:
    needs: [quality-gate, linux-qt-host-kit, host-engine-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      # The V8 archives live on a release asset rather than in LFS; see
      # scripts/fetch-v8-archives.sh. It fails closed on a missing or mismatched
      # archive, which is what a release needs -- silently taking the slower
      # source-JS fallback would ship a different artifact than intended.
      - name: Fetch and verify the Android V8 archives
        run: bash scripts/fetch-v8-archives.sh

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      # NO Rust cache — Swatinem/rust-cache prunes librusty_v8.a out of the v8
      # crate's build-script OUT_DIR while keeping the fingerprint "fresh", so a
      # warm-cache run fails the link with "could not find native static library
      # rusty_v8" (same reason it was dropped from the pr-ci build job). A cold
      # release build is well within the 120-min timeout.

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      # Pins one NDK for the whole job (see the action for why every NDK env var
      # must point at it, not just ANDROID_NDK_HOME).
      - name: Install Android NDK + cargo-ndk
        uses: ./.github/actions/setup-android-ndk

      # Layout-only compatibility check; official Android release slices stay
      # arm64-v8a/x86_64 until an ARMv7 artifact profile is explicitly added.
      - name: C ABI API 26 ARMv7 layout contract
        run: |
          CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang" \
          CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang++" \
            bash scripts/test-c-abi-surface-candidate.sh


      # The C ABI must compile for every platform it claims to support. This
      # lives in the Android job because it needs the NDK and the aarch64 V8
      # archive; the quality-gate job has neither.
      - name: C ABI platform contract
        run: bash scripts/test-capi-platform-contract.sh

      - name: Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('platforms/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Release artifact manifest gate contract
        run: bash scripts/test-android-release-manifest-gate.sh

      - name: Build Android AARs (release)
        run: |
          # Start clean: build-aar.sh does not clear the output directory
          # before writing, so a checkout with history (or a re-run) can
          # leave stale AARs from earlier builds or older naming schemes
          # sitting next to this run's output. The publish step below ships
          # whatever is in this directory, so anything stale here would be
          # uploaded as a release asset with no way for a consumer to tell
          # it apart from the real thing.
          rm -rf platforms/android/dist
          bash scripts/build-aar.sh --product-profile full release
          # arm64-only variants. The Rust artefacts are already built, so these
          # only re-run Gradle with abiFilters -- a host shipping arm64 alone
          # should not have to carry the x86_64 payload, and quoting the
          # multi-ABI size at an integrator overstates it by roughly double.

      # No release may ship a libmigo.so that cannot dlopen on the API 26 floor
      # Migo claims to support. Checks every strong import against the NDK's
      # API-26 stub libraries; see scripts/test-android-symbol-floor.sh.
      - name: Android minimum-API symbol floor
        run: bash scripts/test-android-symbol-floor.sh

      # Android 15 brought 16 KB memory pages and Android 16 requires targeting
      # apps to have 16 KB-aligned native libraries to install on such a device.
      # Migo's own libraries already are -- but nothing said so, and the pinned
      # NDK's `libc++_shared.so` is 4 KB-aligned, so the day a build starts
      # needing it the package would fail to install on hardware we do not own.
      - name: Android 16 KB page alignment
        run: bash scripts/test-android-so-page-alignment.sh

      # An SDK that ships a runtime library picks that library's version for its
      # host, and the published v0.9.3 AAR shipped ~2 MB of `libc++_shared.so`
      # that no shipped .so ever named in DT_NEEDED. Needs the freshly built
      # AARs from the step above.
      - name: Android shipped natives are reachable
        run: bash scripts/test-android-native-deps-contract.sh

      # Three separate size regressions -- a silently-skipped ICU swap, thirteen
      # rustflags replaced out of the shipped link, and a libc++ nothing loaded --
      # each shipped or nearly shipped with every test green, because the size of
      # the binary was nobody's assertion. This puts a budget on it. It lives here
      # rather than in pr-ci because pr-ci builds debug AARs, and a debug .so is
      # ~340 MB: there is no meaningful ceiling to hold it to. Needs the release
      # AARs from the step above.
      - name: Android engine size budget
        run: bash scripts/test-android-so-size-contract.sh

      # The slice manifests record which snapshot each ABI embeds, but until here
      # nothing reads the .so. generate-android-artifact-manifests.py validates the
      # snapshot *file* and refuses to emit a slice without it, while
      # runtime-v8/build.rs decides embedding independently and fails safe -- every
      # failure path warns and continues. So a slice can claim a snapshot the binary
      # does not contain, and the result is a cold-start regression with nothing red:
      # the artifact still runs, it just parses extension JS instead of
      # deserialising a heap.
      #
      # This lives outside engine/crates/runtime-v8/ on purpose. That crate's snapshot
      # fingerprint walks every .rs in its own directory, build.rs included, so making
      # build.rs fail closed invalidates all six committed snapshots and regenerating
      # the aarch64 pair needs physical arm64 hardware. Checking the artifact proves
      # the stronger property anyway -- the bytes are there, not that the build script
      # meant to put them there.
      #
      # Named explicitly rather than globbed: a glob matching zero AARs would pass.
      - name: Android snapshot embedding contract
        run: |
          bash scripts/test-android-snapshot-embedding-contract.sh \
            "platforms/android/dist/migo-$(cat release/VERSION)-android.aar"

      # The C ABI package is published by this release too, so it is verified
      # here rather than only by hand. Runs per ABI: the entry-point set, the
      # standalone header compile and the find_package consumer are all
      # per-target, and a package that is correct for one is not evidence for
      # the other. Placed after the AAR build so it reuses the NDK, Rust
      # toolchain and verified V8 archives already set up above.
      - name: Android C SDK package contract
        run: |
          for arch in aarch64 x86_64; do
            echo "::group::android C SDK ($arch)"
            bash scripts/build-android-sdk.sh --arch "$arch"
            bash scripts/test-android-sdk-contract.sh --arch "$arch"
            echo "::endgroup::"
          done

      # The manifest and freshness gates prove the snapshot *file* is valid;
      # this is the only check that reads the compiled libmigo_capi.a to prove
      # the bytes actually landed there, same property as the AAR check above.
      - name: Android C SDK snapshot embedding contract
        run: |
          bash scripts/test-capi-snapshot-embedding-contract.sh \
            dist/migo-android-arm64 dist/migo-android-x86_64

      # The two Android C SDK archives on v0.9.0 were produced by a `tar` typed on
      # a release machine, which is why their attestations swear to bytes nobody
      # receiving them can reproduce. scripts/package-sdk.sh is the reproducible
      # path, and staging its output here rather than beside the staged prefix puts
      # both archives under the SHA256SUMS.txt generated below.
      - name: Package the Android C SDK for release
        run: |
          for arch in arm64 x86_64; do
            bash scripts/package-sdk.sh "dist/migo-android-$arch" \
              --output-dir platforms/android/dist
          done

      # Per-symbol size attribution is a diagnostic, not something a consumer
      # downloads: it shipped as size-report-full.txt / size-report-slim.txt on every
      # release and nothing read it. Kept as a workflow artifact so a size regression
      # stays visible, and `|| true` stays -- an analyzer failure must not block a
      # release.
      - name: Analyze AAR size report
        run: |
          mkdir -p reports
          python3 scripts/size_report/analyze_so.py \
            "platforms/android/dist/migo-$(cat release/VERSION)-android.aar" \
            > reports/size-report.txt || true

      - name: Upload the size report as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: size-report
          path: reports/size-report.txt
          if-no-files-found: warn

      # Everything published comes from this one directory, so the asset list exists
      # once -- as its contents -- instead of in the three hand-copied places it used
      # to: an 18-name presence check, a 20-pattern `files:` block, and the implicit
      # coverage of `sha256sum *`. Missing any one of them published a set nobody had
      # agreed to, and platforms/android/dist also holds internal build products
      # (per-variant version metadata, single-ABI AARs) that were never meant to ship.
      #
      # `cp` is the completeness assertion the presence check used to be: a build that
      # silently stopped producing an artifact makes a copy fail and aborts the job.
      # The source paths are named once, here, in the step that knows them.
      #
      # A literal asset list is no longer expressible at all -- the names carry
      # release/VERSION, and hardcoding it in YAML would stand up a second version
      # source beside the one scripts/test-release-version-contract.sh exists to
      # protect.
      - name: Stage the published assets
        run: |
          VERSION="$(cat release/VERSION)"
          rm -rf dist/release
          mkdir -p dist/release
          for asset in \
            "migo-$VERSION-android.aar" \
            "migo-$VERSION-android.aar.attestation.json" \
            "migo-$VERSION-android-nojni.aar" \
            "migo-$VERSION-android-nojni.aar.attestation.json" \
            "migo-$VERSION-jni-android-arm64.tar.gz" \
            "migo-$VERSION-jni-android-arm64.tar.gz.attestation.json" \
            "migo-$VERSION-jni-android-x86_64.tar.gz" \
            "migo-$VERSION-jni-android-x86_64.tar.gz.attestation.json" \
            "migo-$VERSION-capi-android-arm64.tar.gz" \
            "migo-$VERSION-capi-android-arm64.tar.gz.attestation.json" \
            "migo-$VERSION-capi-android-x86_64.tar.gz" \
            "migo-$VERSION-capi-android-x86_64.tar.gz.attestation.json" \
          ; do
            cp "platforms/android/dist/$asset" dist/release/
          done

      # Before the checksums, so nothing unvalidated gets a hash, and before publish,
      # so an asset from an older naming scheme fails here instead of appearing beside
      # the real one with no way for a consumer to tell them apart. This is what
      # replaces the `rm -rf platforms/android/dist` precaution above.
      # Handed to the publish job rather than published from here. A job that builds
      # one platform cannot see the release, and until it can there is no point in the
      # graph where a whole-release checksum manifest is even expressible -- which is
      # exactly why SHA256SUMS.txt used to cover only this job's output while its name
      # implied the release.
      - name: Upload the staged Android assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-android
          path: dist/release
          if-no-files-found: error
          retention-days: 1

  # Release bytes are tested after the hosted builder uploads them. The physical
  # runner never rebuilds the AAR: it installs the exact workflow artifact, pulls
  # the installed APK back, and proves the embedded native hash before measuring.
  #
  # Opt-in, and NOT a publish dependency, until the two things #136 shipped it
  # without both exist:
  #   1. a runner labelled `self-hosted, android-device` -- none is registered;
  #   2. `../migo-test-suite` with the `install.sh` / `run.sh` entry points
  #      `run_android_device_evidence.sh` calls -- that repo ships neither.
  # With it gating `publish` the first tagged release since #136 could not
  # publish at all: the job sat queued forever waiting for a runner. A gate that
  # can never pass is worse than no gate; v0.9.4 published without this job.
  # Once both are in place, set repo variable MIGO_DEVICE_EVIDENCE=true and add
  # `release-android-device-evidence` back to `publish`'s `needs`.
  release-android-device-evidence:
    needs: [release-android]
    if: ${{ vars.MIGO_DEVICE_EVIDENCE == 'true' }}
    runs-on: [self-hosted, android-device]
    timeout-minutes: 150

    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Setup Java for the external host application
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK and adb
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Download the hosted builder's Android release bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets-android
          path: dist/device-input

      - name: Install, measure, gate, and seal release evidence
        env:
          DEVICE_PACKAGE: ${{ vars.MIGO_DEVICE_TEST_PACKAGE || 'com.example.migo.demo' }}
          DEVICE_DURATION: ${{ vars.MIGO_DEVICE_TEST_DURATION || '300' }}
          DEVICE_SUITE: ${{ vars.MIGO_DEVICE_TEST_SUITE_PATH || '../migo-test-suite' }}
        run: |
          ARTIFACT="dist/device-input/migo-$(cat release/VERSION)-android.aar"
          bash scripts/ci/run_android_device_evidence.sh \
            --artifact "$ARTIFACT" \
            --package "$DEVICE_PACKAGE" \
            --test-suite "$DEVICE_SUITE" \
            --source-revision "$GITHUB_SHA" \
            --duration "$DEVICE_DURATION" \
            --out-dir artifacts/android-release-evidence

      - name: Upload sealed device evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-release-evidence-${{ github.sha }}
          path: artifacts/android-release-evidence
          if-no-files-found: error
          retention-days: 30

  # ── Linux SDK ───────────────────────────────────────────────────────────
  # Every dependency is fetchable and hash-pinned, which is what made this the first
  # platform to move off the release machine: the Chromium sysroot comes from
  # fetch-linux-sysroot.sh and the V8 archive from the v8-archives release asset, both
  # verified against committed sha256s. Windows and OpenHarmony have since followed
  # (release-windows, release-ohos below) once their own librusty_v8 archives were
  # published to the same tag.
  #
  # Both architectures build in this one job, cross-compiling aarch64 from this
  # x86_64 runner, the same shape release-ohos already uses for its own two
  # architectures (one job, one runner, per-arch script invocations) rather than
  # a matrix with a native arm64 runner: cross-compilation is already proven
  # here (scripts/lib/linux-sysroot.sh pins CC/CXX/RUSTFLAGS at the matching
  # Debian sysroot regardless of host arch), so a second, unverified runner
  # type would only add risk this platform does not need. aarch64 ships
  # without an embedded V8 snapshot (see build-linux-sdk.sh's own header
  # comment) -- generating one needs to run natively on real AArch64 Linux,
  # which is a separate piece of work, not a gap in this job.
  release-linux:
    needs: [quality-gate, host-engine-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      # lld is not preinstalled. build-linux-sdk.sh explains why it is load-bearing
      # rather than a preference, and it fails with an actionable message when absent
      # -- but failing 40 minutes into a release is worse than installing it here.
      - name: Install the linker the SDK links with
        run: |
          command -v lld >/dev/null 2>&1 || sudo apt-get install -y lld

      # The sysroot each V8 archive was built against, verified by sha256. The SDK
      # build refuses when the engine's sysroot identity and the archive's disagree,
      # so this is not merely a convenience: fetching the wrong one is a build
      # failure, not a silently different artifact.
      - name: Fetch and verify the pinned Chromium sysroots
        run: |
          bash scripts/fetch-linux-sysroot.sh --key bullseye_amd64
          bash scripts/fetch-linux-sysroot.sh --key bullseye_arm64

      - name: Fetch and verify the linux-gnu V8 archives
        run: bash scripts/fetch-v8-archives.sh x86_64-linux-gnu aarch64-linux-gnu

      - name: Build the Linux SDK (x86_64)
        run: bash scripts/build-linux-sdk.sh x86_64

      - name: Build the Linux SDK (aarch64)
        run: bash scripts/build-linux-sdk.sh aarch64

      - name: Linux SDK package contract (x86_64)
        run: bash scripts/test-linux-sdk-contract.sh x86_64

      - name: Linux SDK package contract (aarch64)
        run: bash scripts/test-linux-sdk-contract.sh aarch64

      # Same property as the Android C SDK check: the manifest and freshness
      # gates validate the snapshot file, this reads the compiled libmigo.a /
      # libmigo.so.<version> to prove the bytes are actually embedded. x86_64
      # only: aarch64 has no snapshot to embed yet (snapshot_policy: "none").
      - name: Linux SDK snapshot embedding contract (x86_64)
        run: bash scripts/test-capi-snapshot-embedding-contract.sh dist/migo-linux-x86_64

      # Straight into the staging directory: package-sdk.sh derives the published name
      # from the staged prefix, so there is nothing to rename on the way.
      - name: Package the Linux SDKs for release
        run: |
          mkdir -p dist/release
          bash scripts/package-sdk.sh dist/migo-linux-x86_64 --output-dir dist/release
          bash scripts/package-sdk.sh dist/migo-linux-arm64 --output-dir dist/release

      - name: Upload the staged Linux assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-linux
          path: dist/release
          if-no-files-found: error
          retention-days: 1

  # ── OpenHarmony SDK ─────────────────────────────────────────────────────
  # The last platform to have nothing published at all. Unblocked once the two
  # librusty_v8-*-linux-ohos.a archives went onto the v8-archives tag: their component
  # manifests were already committed, so the sha256 to verify a download against
  # existed before the download did.
  #
  # Also the first release to carry OHOS arm64. Every release so far shipped only
  # ohos-x86_64, which is the emulator architecture -- real HarmonyOS devices are arm64.
  release-ohos:
    needs: [quality-gate, host-engine-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      # No `targets:` here on purpose. engine/rust-toolchain.toml already names
      # aarch64-unknown-linux-ohos and x86_64-unknown-linux-ohos and calls itself the
      # reproducible-build contract; restating them in the workflow would be a second
      # list to keep in step. The build scripts run cargo from engine/, so that file
      # applies and rustup installs what it names.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0

      # Two reasons, and the second one is not about space. Measured sizes: the
      # extracted SDK is 2.9 GB, each OpenHarmony cargo target directory is 4.4 GB, and
      # the materialised V8 archives are 683 MB -- 12.4 GB against a runner's ~14 GB of
      # free space, before the toolchain and checkout. And the preinstalled Android SDK
      # is an active hazard for this job specifically: build-ohos-sdk.sh warns that a
      # machine with an Android NDK on PATH "silently compiles the C dependencies with
      # the NDK's clang and bionic headers for a musl target". Removing it frees the
      # space and removes that failure mode at the same time. Do not delete this step to
      # speed up CI without reading both halves.
      - name: Make room, and remove the Android NDK this job must not see
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      # Version and sha256 come from contracts/artifact-manifest/ohos-sdk.lock.json, not
      # from the mirror: fetching a checksum from the same server as the artifact
      # verifies transport and nothing else.
      - name: Install the pinned OpenHarmony SDK
        run: bash scripts/fetch-ohos-sdk.sh

      - name: Fetch and verify the OpenHarmony V8 archives
        run: bash scripts/fetch-v8-archives.sh x86_64-linux-ohos aarch64-linux-ohos

      # Self-gating: build-ohos-sdk.sh runs test-ohos-sdk-contract.sh and the symbol
      # floor per architecture, so there is no separate contract step to add here. Both
      # arches in one invocation because they share the SDK and the toolchain setup.
      - name: Build and gate the OpenHarmony SDK for both architectures
        run: bash scripts/build-ohos-sdk.sh --all

      - name: Package the OpenHarmony SDKs for release
        run: |
          mkdir -p dist/release
          for arch in arm64 x86_64; do
            bash scripts/package-sdk.sh "dist/migo-ohos-$arch" --output-dir dist/release
          done

      - name: Upload the staged OpenHarmony assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-ohos
          path: dist/release
          if-no-files-found: error
          retention-days: 1

  # ── Windows SDK ──────────────────────────────────────────────────────────
  # The last platform this workflow builds by hand instead of building. Not
  # because the build itself needed CI-only capability -- build-windows-sdk.sh
  # has produced a correct, contract-verified package all along -- but because
  # that script crosses a WSL/Windows boundary (wslpath, a synced
  # /mnt/c/migo-win worktree, cmd.exe-dispatched batch files) that only exists
  # on this project's own dual-boot dev machine. A windows-latest runner has no
  # WSL: the checkout already sits on native NTFS, so there is no boundary for
  # that machinery to cross. scripts/build-windows-sdk-native.sh is the other
  # side of that split -- see scripts/lib/windows-sdk-package.sh for the
  # packaging/manifest logic the two share, and scripts/build-windows-sdk.sh's
  # own header comment for why WSL still gets its own entry point rather than
  # a branch inside this one.
  release-windows:
    needs: [quality-gate, host-engine-tests]
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      # skia-safe's binary-cache feature downloads a prebuilt skia-bindings for
      # host targets and normally succeeds, but 404's when a given commit's
      # prebuilt is unavailable (reproduced locally while developing this job)
      # and falls back to compiling Skia from source via ninja. Mirrors the
      # precedent already in this workflow: linux-qt-host-kit/host-engine-tests
      # install ninja-build for the identical reason. Failing 40 minutes into a
      # build with "ninja: command not found" is worse than a 10-second
      # defensive install.
      - name: Install ninja (Skia from-source fallback)
        shell: bash
        run: command -v ninja >/dev/null 2>&1 || choco install ninja -y --no-progress

      # engine/.cargo/config.toml pins CC_x86_64_pc_windows_msvc/CXX_... to
      # clang-cl, resolved through PATH -- skia-bindings probes fixed paths for
      # clang-cl.exe and refuses to build without it, so this is a hard
      # prerequisite for every crate cc-rs compiles here (skia-bindings itself,
      # and smaller C dependencies like minimp3-sys), not merely a Skia
      # concern. windows-latest images bundle a Clang/LLVM bundled with Visual
      # Studio, but its exact version has been observed to vary between image
      # updates (actions/runner-images#10001, #12435) and whether vcvars alone
      # puts it on PATH is not something this job wants to depend on silently
      # -- so this pins a known-good copy the same defensive way as ninja
      # above, and appends its directory to PATH for every later step.
      - name: Install LLVM/clang-cl
        shell: bash
        run: |
          command -v clang-cl >/dev/null 2>&1 || choco install llvm -y --no-progress
          echo 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"

      - name: Fetch and verify the windows-msvc V8 archive
        shell: bash
        run: bash scripts/fetch-v8-archives.sh x86_64-pc-windows-msvc

      - name: Fetch and verify the pinned ANGLE runtime
        shell: bash
        run: bash scripts/fetch-windows-angle.sh

      - name: Build the Windows SDK
        shell: bash
        run: bash scripts/build-windows-sdk-native.sh

      - name: Windows SDK package contract
        shell: bash
        run: bash scripts/test-windows-sdk-contract.sh --strict

      - name: Package the Windows SDK for release
        shell: bash
        run: |
          mkdir -p dist/release
          bash scripts/package-sdk.sh dist/migo-windows-x86_64 --output-dir dist/release

      - name: Upload the staged Windows assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-windows
          path: dist/release
          if-no-files-found: error
          retention-days: 1

  # Same steps as release-windows above, on a native windows-11-arm runner --
  # unlike this project's own WSL2 dev machine (x64 host), there is no
  # cross-compilation here at all: ilammy/msvc-dev-cmd with arch: arm64 on an
  # actually-arm64 runner just puts native arm64 cl.exe/link.exe on PATH, the
  # same way it puts native x64 tools on PATH for release-windows. The V8 and
  # ANGLE archives this job fetches were themselves built by cross-compiling
  # from an x64 dev machine (scripts/build-v8-windows.sh /
  # scripts/build-angle-windows.sh aarch64) -- that cross-compilation
  # complexity lives entirely in those two scripts and the machine that ran
  # them once, not in this job, which only links against their output.
  #
  # skia-safe's prebuilt binary cache is unlikely to carry an
  # aarch64-pc-windows-msvc entry (a target this rare), so the from-source
  # Skia build via ninja that release-windows treats as a defensive fallback
  # is the expected path here -- hence the longer timeout.
  release-windows-arm64:
    needs: [quality-gate, host-engine-tests]
    runs-on: windows-11-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: aarch64-pc-windows-msvc

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: arm64

      - name: Install ninja (Skia from-source fallback)
        shell: bash
        run: command -v ninja >/dev/null 2>&1 || choco install ninja -y --no-progress

      - name: Install LLVM/clang-cl
        shell: bash
        run: |
          command -v clang-cl >/dev/null 2>&1 || choco install llvm -y --no-progress
          echo 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"

      - name: Fetch and verify the windows-msvc V8 archive
        shell: bash
        run: bash scripts/fetch-v8-archives.sh aarch64-pc-windows-msvc

      - name: Fetch and verify the pinned ANGLE runtime
        shell: bash
        run: bash scripts/fetch-windows-angle.sh arm64

      - name: Build the Windows SDK
        shell: bash
        run: bash scripts/build-windows-sdk-native.sh aarch64

      - name: Windows SDK package contract
        shell: bash
        run: bash scripts/test-windows-sdk-contract.sh aarch64 --strict

      - name: Package the Windows SDK for release
        shell: bash
        run: |
          mkdir -p dist/release
          bash scripts/package-sdk.sh dist/migo-windows-arm64 --output-dir dist/release

      - name: Upload the staged Windows arm64 assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-windows-arm64
          path: dist/release
          if-no-files-found: error
          retention-days: 1

  # ── The only publisher ──────────────────────────────────────────────────
  # Publishing lived inside release-android, so no point in the graph saw every
  # platform's output. That is what made a whole-release checksum manifest impossible
  # and what let scripts/publish-release.sh grow into a second publisher: it pushed the
  # tag (triggering this workflow), then created the same release and `--clobber`ed the
  # assets the workflow had just uploaded. That script is deleted; this job is the only
  # thing that publishes.
  #
  # Adding a platform is now additive: one job, one entry in `needs`.
  publish:
    # release-android-device-evidence is intentionally absent: it is opt-in (see
    # its own comment) and cannot run until its runner and suite exist. Add it
    # back here the moment MIGO_DEVICE_EVIDENCE is set.
    needs: [release-android, release-linux, release-ohos, release-windows, release-windows-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0

      - name: Populate the locked Cargo graph for offline SBOM generation
        working-directory: engine
        run: cargo fetch --locked

      # merge-multiple puts every platform's staged assets in one directory, which is
      # the whole point: the published asset list exists once, as this directory's
      # contents, instead of in a pattern list that has to be kept in step with the
      # jobs.
      - name: Collect every platform's staged assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: dist/release

      # Generated only after all platform jobs converge so the same audited
      # implementation binds every payload. Cargo metadata needs no target
      # linker or std component; --filter-platform selects each resolved graph,
      # while the already-built file supplies the identity and SHA-256.
      - name: Generate an artifact-bound SBOM for every runtime payload
        run: |
          VERSION="$(cat release/VERSION)"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"

          make_sbom() {
            local artifact="$1" kind="$2" target_label="$3" cargo_target="$4" root_package="$5" manifest="$6"
            bash scripts/generate-sbom.sh \
              --artifact "dist/release/$artifact" \
              --artifact-kind "$kind" \
              --target "$target_label" \
              --cargo-target "$cargo_target" \
              --profile full \
              --root-package "$root_package" \
              --manifest "$manifest" \
              --out "dist/release/$artifact.sbom.cdx.json"
          }

          make_sbom \
            "migo-$VERSION-android.aar" android-aar android-arm64+x86_64 \
            aarch64-linux-android migo-android-jni engine/crates/android-jni/Cargo.toml

          for platform in android linux ohos windows; do
            for arch in arm64 x86_64; do
              case "$platform-$arch" in
                android-arm64) triple=aarch64-linux-android ;;
                android-x86_64) triple=x86_64-linux-android ;;
                linux-arm64) triple=aarch64-unknown-linux-gnu ;;
                linux-x86_64) triple=x86_64-unknown-linux-gnu ;;
                ohos-arm64) triple=aarch64-unknown-linux-ohos ;;
                ohos-x86_64) triple=x86_64-unknown-linux-ohos ;;
                windows-arm64) triple=aarch64-pc-windows-msvc ;;
                windows-x86_64) triple=x86_64-pc-windows-msvc ;;
              esac
              make_sbom \
                "migo-$VERSION-capi-$platform-$arch.tar.gz" capi-sdk "$platform-$arch" \
                "$triple" migo-capi engine/crates/capi/Cargo.toml
            done
          done

      # Release-level, so it belongs here rather than in whichever platform job
      # happened to run first.
      - name: Write version metadata
        run: |
          cat > dist/release/version.json <<VEOF
          {
            "tag": "${{ github.ref_name }}",
            "sha": "${{ github.sha }}",
            "type": "release",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          VEOF

      - name: Release asset naming contract
        run: bash scripts/test-release-asset-naming-contract.sh dist/release

      # Must stay last among the steps that write into dist/release: SHA256SUMS.txt is
      # a manifest over everything currently there, so anything written afterwards
      # ships uncovered. That bug shipped once already -- version.json was written
      # after the checksums and went out unverified -- and
      # scripts/test-release-asset-ordering-contract.sh is what keeps the ordering from
      # regressing again.
      # Generated from the staging directory rather than from a template, so the asset
      # table cannot describe a set other than the one being uploaded.
      # generate_release_notes on the publish step appends GitHub's commit-derived
      # notes underneath this.
      #
      # Placed before the checksums, not after: the notes' table already excludes
      # SHA256SUMS.txt, so the output is identical either way, and
      # test-release-asset-ordering-contract.sh is deny-by-default about later steps
      # that name the staging directory -- it cannot prove a script invocation is
      # read-only, and it is right not to guess.
      - name: Write the release notes
        run: bash scripts/write-release-notes.sh dist/release "$RUNNER_TEMP/release-notes.md"

      #
      # `sha256sum *` is correct here only because the staging step recreates the
      # directory: bash expands the glob before performing the redirection, so a
      # SHA256SUMS.txt left over from an earlier run would be listed in its own
      # successor while empty. The `rm -rf dist/release` above is what rules that out.
      - name: Generate checksums
        run: |
          cd dist/release
          sha256sum * > SHA256SUMS.txt

      # One glob over one directory, which every platform job's upload-artifact
      # (if-no-files-found: error) guarantees is populated and the naming contract has
      # validated. That is what makes fail_on_unmatched_files usable at last:
      # action-gh-release resolves it per pattern, so the previous 20-pattern list could
      # not enable it -- size-report-*.txt was written with `|| true` and reports/*.json
      # only existed when there were power metrics to compare, so a legitimately empty
      # pattern would have failed every release. Neither is published now (the size
      # report is a workflow artifact, power metrics are internal), leaving a single
      # pattern that must match.
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/release/*
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true

  # ── What was actually published ─────────────────────────────────────────
  # Separate from `publish` on purpose, and the reason is the threat model. For the
  # assets this workflow builds, the coverage invariant holds by construction:
  # `sha256sum *` covers everything in the staging directory, and the naming contract
  # has already refused anything that does not belong there. The only way an
  # unverifiable asset can appear is for someone to add one *after* the workflow ran --
  # which nothing inside the workflow can see.
  #
  # So this reads the published release rather than the directory it came from. Every
  # platform this workflow currently ships (android/linux/ohos/windows) is built and
  # uploaded by this workflow, so nothing here depends on a by-hand step anymore --
  # but the same command is still what to run after hand-uploading a platform this
  # workflow does not build yet (Phase 2/3 arm64 targets), at the same scope:
  #
  #   bash scripts/verify-release-assets.sh <tag>
  #
  # (An earlier revision put this inside `publish`, after the checksum step.
  # test-release-asset-ordering-contract.sh refused it -- deny-by-default, `bash
  # <script>` cannot be proven read-only against the staging directory -- and it was
  # right to: the step was in the wrong place, not the gate too strict.)
  verify-published:
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Release asset coverage contract
        run: bash scripts/verify-release-assets.sh "${{ github.ref_name }}"
