name: Build V8 Snapshot

# V8 startup snapshots are PLATFORM-bound (OS + CPU arch): a snapshot serializes
# a live V8 heap, so it must be produced by the *same* android-<arch> V8 that
# the target .so links — a host-linux V8 (or the wrong CPU arch) produces a
# snapshot that fails V8's magic-number check at load and hard-crashes.
#
# We therefore generate the snapshot the "Deno issue #27496" way: cross-compile
# `migo-snapshot-gen` to the target Android ABI (linking the committed,
# self-built android V8 archive via Git LFS), then RUN it on that ABI's Android
# emulator/device.
#
#   x86_64 -> GitHub-hosted `ubuntu-latest` HAS /dev/kvm, so we boot a
#             hardware-accelerated x86_64 Android emulator and run the generator
#             on it (job below).
#
#   arm64  -> GitHub-hosted `ubuntu-24.04-arm` runners do NOT expose /dev/kvm,
#             so an arm64 Android emulator cannot be hardware-accelerated and
#             this approach is not available on hosted runners. Generate the
#             arm64 snapshot on a real arm64 device and commit/upload
#             engine/crates/runtime-v8/snapshots/SNAPSHOT-<profile>-android-aarch64.bin.
#             The exact device steps are documented in snapshot-gen/src/main.rs.
#             (A self-hosted arm64 runner with an attached device could automate
#             this later.)
#
# This workflow uploads the snapshot as an artifact. Embedding into the .so is
# done by runtime-v8/build.rs at .so build time: it picks
# snapshots/SNAPSHOT-<profile>-<os>-<target arch>.bin, one V8 archive per (os, arch).

on:
  workflow_dispatch:
    inputs:
      product_profile:
        description: Product profile to regenerate
        required: true
        default: full
        type: choice
        options:
          - full
          - slim
      snapshot_kind:
        description: Runtime heap to regenerate
        required: true
        default: host
        type: choice
        options:
          - host
          - worker
  push:
    branches:
      - "**"
    # On push only the fast `freshness` gate runs (the x86_64 generator is
    # workflow_dispatch-only). Schema v3 binds runtime kind and fingerprints extension JS, runtime-v8
    # and snapshot-gen Rust/feature inputs, Cargo.lock, product features, and the
    # exact Android V8 archive, so every one of those changes must run the gate.
    paths:
      - "engine/crates/runtime-v8/**/*.js"
      - "engine/crates/runtime-v8/**/*.rs"
      - "engine/crates/runtime-v8/Cargo.toml"
      - "engine/crates/runtime-v8/snapshots/**"
      - "engine/tools/snapshot-gen/**/*.rs"
      - "engine/tools/snapshot-gen/Cargo.toml"
      - "engine/third_party/rusty_v8/**/librusty_v8.a"
      - "engine/Cargo.lock"
      - "scripts/lib/snapshot-fingerprint.sh"
      - "scripts/check-snapshot-freshness.sh"
      - "scripts/write-snapshot-manifest.sh"
      - ".github/workflows/build-snapshot.yml"

concurrency:
  group: build-snapshot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Confirm all committed kind/profile/ABI snapshots match every schema-v3 input.
  # The host-only gate reads Git LFS pointer oid/size identities, so it does not
  # need to download the large snapshot or V8 archive objects.
  freshness:
    name: snapshot freshness gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # No LFS download: the gate validates large objects from pointer oid/size.
      - name: Check snapshot freshness
        run: |
          bash scripts/check-snapshot-freshness.sh --snapshot-kind host --product-profile full
          bash scripts/check-snapshot-freshness.sh --snapshot-kind host --product-profile slim
          bash scripts/check-snapshot-freshness.sh --snapshot-kind worker --product-profile full

  # Runs ONLY on manual workflow_dispatch. The ~15 min cross-compile + emulator
  # generation is wasteful on every push. On push only the fast `freshness`
  # gate runs; when any schema-v3 input makes it red, manually regenerate the
  # selected x86_64 product here. arm64 still requires a matching real device.
  snapshot-x86_64:
    name: snapshot (${{ inputs.snapshot_kind }} / x86_64 / emulator)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # This manual job alone pushes the regenerated snapshot branch. The
    # push-triggered freshness job remains read-only.
    permissions:
      contents: write
    env:
      SNAPSHOT_KIND: ${{ inputs.snapshot_kind }}
      SNAPSHOT_PREFIX: ${{ inputs.snapshot_kind == 'worker' && 'SNAPSHOT-worker' || 'SNAPSHOT' }}
    steps:
      # must link the android-x86_64 one so the snapshot's external-reference
      # table matches the .so's V8 exactly.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Validate snapshot identity selection
        run: |
          if [[ "$SNAPSHOT_KIND" == worker && "${{ inputs.product_profile }}" != full ]]; then
            echo "Worker snapshot requires product profile full" >&2
            exit 1
          fi

      # Same as the other workflows: the archive comes from a release asset and is
      # checked against the component manifest, so this job no longer depends on
      # LFS bandwidth to get a V8 it can link.
      - name: Fetch and verify the Android V8 archives
        run: bash scripts/fetch-v8-archives.sh

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: x86_64-linux-android

      # NOTE: intentionally NO Rust cache here. Swatinem/rust-cache prunes large
      # files out of each crate's build-script OUT_DIR to shrink the cache —
      # including the `librusty_v8.a` that the `v8` crate's build script copies
      # there — while keeping that build script's fingerprint "fresh". On a cache
      # hit cargo then skips re-running the build script (so the archive is never
      # re-copied) and the final link fails with "could not find native static
      # library rusty_v8". This generator job runs only when the snapshot inputs
      # change, so a reliable ~15 min cold build beats a fragile cached one.

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          # Named, because the action's default is `tools platform-tools` and
          # `tools` -- the SDK Tools package cmdline-tools replaced -- is gone from
          # the repository the runner's cmdline-tools 20.0 reads: sdkmanager
          # reports "Failed to find package 'tools'" and exits 1 before any step
          # that builds. Nothing here uses it; platform-tools is what adb comes from.
          packages: platform-tools

      # Pins the same NDK the .so build uses, exported via $GITHUB_ENV for the
      # cross-compile AND emulator steps. See the action for why every NDK env
      # var must point at it, not just ANDROID_NDK_HOME.
      - name: Install Android NDK + cargo-ndk
        uses: ./.github/actions/setup-android-ndk

      # ReactiveCircus/android-emulator-runner needs /dev/kvm group-accessible.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cross-compile the generator to android-x86_64 against the committed
      # android V8 archive. `--allow-multiple-definition` tolerates the handful
      # of libc++ symbols defined in both V8 and (later) Skia archives; `-landroid`
      # supplies AHardwareBuffer symbols. NOTE: unlike arm64, x86_64 does NOT need
      # libclang_rt.builtins (no __clear_cache reference in cpu-x64.cc).
      - name: Cross-compile snapshot-gen (x86_64-android)
        working-directory: engine
        run: |
          export RUSTY_V8_ARCHIVE="$PWD/third_party/rusty_v8/x86_64-linux-android/librusty_v8.a"
          export RUSTY_V8_SRC_BINDING_PATH="$PWD/third_party/rusty_v8/x86_64-linux-android/src_binding.rs"
          export RUSTFLAGS="-C link-arg=-Wl,--allow-multiple-definition -C link-arg=-landroid"
          cargo ndk -t x86_64 --platform 26 build -p migo-snapshot-gen \
            --no-default-features --features profile-${{ inputs.product_profile }} --locked
          # Stage libc++_shared.so next to the binary here (ANDROID_NDK_HOME is
          # reliably set in this run-step) so the emulator-runner script below
          # does not depend on it being propagated into the action's shell.
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" \
             target/x86_64-linux-android/debug/libc++_shared.so

      # Boot a hardware-accelerated x86_64 emulator and run the generator on it.
      # IMPORTANT: android-emulator-runner executes each line of `script` as a
      # SEPARATE `/usr/bin/sh -c <line>`. So: no cross-line shell variables (they
      # don't persist), no `set ...` lines (no effect on later lines, and
      # `set -o pipefail` is even illegal in dash). Each line is a self-contained
      # command with literal paths. The action stops on the first failing line.
      - name: Generate snapshot on x86_64 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb push engine/target/x86_64-linux-android/debug/libc++_shared.so /data/local/tmp/libc++_shared.so
            adb push engine/target/x86_64-linux-android/debug/migo-snapshot-gen /data/local/tmp/migo-snapshot-gen
            adb shell chmod 755 /data/local/tmp/migo-snapshot-gen
            adb shell "cd /data/local/tmp && LD_LIBRARY_PATH=/data/local/tmp MIGO_SNAPSHOT_KIND=$SNAPSHOT_KIND MIGO_SNAPSHOT_OUT=/data/local/tmp/SNAPSHOT.bin ./migo-snapshot-gen"
            mkdir -p engine/crates/runtime-v8/snapshots
            adb pull /data/local/tmp/SNAPSHOT.bin engine/crates/runtime-v8/snapshots/$SNAPSHOT_PREFIX-${{ inputs.product_profile }}-android-x86_64.bin

      - name: Inspect snapshot
        run: |
          f=engine/crates/runtime-v8/snapshots/$SNAPSHOT_PREFIX-${{ inputs.product_profile }}-android-x86_64.bin
          ls -la "$f"
          echo "size:  $(stat -c %s "$f") bytes"
          echo "sha256:"; sha256sum "$f"

      - name: Write manifest
        run: bash scripts/write-snapshot-manifest.sh ${{ inputs.product_profile }} android x86_64 engine/crates/runtime-v8/snapshots/$SNAPSHOT_PREFIX-${{ inputs.product_profile }}-android-x86_64.bin $SNAPSHOT_KIND

      # Push the regenerated snapshot to a branch and surface a one-click
      # "create PR" link in the run summary. We deliberately do NOT call
      # `gh pr create`: that needs the repo-wide "Allow GitHub Actions to create
      # and approve pull requests" setting (off by default, and a broad security
      # toggle we'd rather not flip). Pushing the branch (incl. the LFS object)
      # works with the default GITHUB_TOKEN; opening the PR is one click.
      - name: Push regen branch + surface PR link
        run: |
          set -euo pipefail
          bin=engine/crates/runtime-v8/snapshots/$SNAPSHOT_PREFIX-${{ inputs.product_profile }}-android-x86_64.bin
          man="$bin.manifest.json"
          # `git diff` ignores untracked files, so require both artifacts to be
          # tracked before considering the first Worker generation unchanged.
          # Ignore only informational manifest fields; all schema/fingerprint/
          # artifact identities remain authoritative even when bytes match.
          if git ls-files --error-unmatch "$bin" "$man" >/dev/null 2>&1 && \
             git diff --quiet -- "$bin"; then
            git show "HEAD:$man" > /tmp/committed-snapshot-manifest.json
            if python3 - "$man" /tmp/committed-snapshot-manifest.json <<'PY'
          import json
          import pathlib
          import sys

          def identity(path):
              value = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              value.pop("generated_at", None)
              value.pop("git_commit", None)
              return value

          raise SystemExit(0 if identity(sys.argv[1]) == identity(sys.argv[2]) else 1)
          PY
            then
              echo "android x86_64 snapshot bytes and identity unchanged — nothing to push."
              echo "android x86_64 snapshot bytes and identity unchanged — no regen branch pushed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          branch="bot/regen-${SNAPSHOT_KIND}-${{ inputs.product_profile }}-android-x86_64-snapshot"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$bin" "$man"
          git commit -m "chore(snapshot): regenerate ${SNAPSHOT_KIND} ${{ inputs.product_profile }} android x86_64 snapshot"
          git push -f origin "$branch"
          url="${{ github.server_url }}/${{ github.repository }}/compare/${{ github.ref_name }}...${branch}?expand=1"
          {
            echo "### android x86_64 snapshot regenerated"
            echo ""
            echo "Pushed to \`$branch\`. Open the PR (one click): $url"
            echo ""
            echo "> arm64 must be regenerated separately on a device — \`scripts/gen-snapshot.sh arm64 --os android --snapshot-kind ${SNAPSHOT_KIND} --product-profile ${{ inputs.product_profile }} --device <serial>\` — and committed into the same PR."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Open the PR: $url"

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: snapshot-${{ inputs.snapshot_kind }}-${{ inputs.product_profile }}-android-x86_64
          path: |
            engine/crates/runtime-v8/snapshots/${{ inputs.snapshot_kind == 'worker' && 'SNAPSHOT-worker' || 'SNAPSHOT' }}-${{ inputs.product_profile }}-android-x86_64.bin
            engine/crates/runtime-v8/snapshots/${{ inputs.snapshot_kind == 'worker' && 'SNAPSHOT-worker' || 'SNAPSHOT' }}-${{ inputs.product_profile }}-android-x86_64.bin.manifest.json
          if-no-files-found: error
