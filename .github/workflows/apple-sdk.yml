name: Apple SDK

# iOS builds the shipping external-frame product. The macOS external-frame
# build is a renderer/ABI diagnostic in an isolated package; it does not prove
# the shipping macOS V8 supply chain. No release is published by this workflow.
on:
  workflow_dispatch:
    inputs:
      measure_drawables:
        description: >-
          Also measure throughput at maximumDrawableCount 2 and 3, back to back
          on the macos-v8 archive. Off by default: it is a measurement, not a
          gate, and it costs a minute of a runner nobody is waiting on.
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 0'
  push:
    branches:
      - 'apple/**'
  # Apple-touching pull requests, because until this trigger existed the Swift in
  # the shipping package was compiled by nothing a pull request runs.
  #
  # platforms/apple/Package.swift declares a .binaryTarget for an xcframework that
  # scripts/build-apple-sdk.sh produces, and SwiftPM validates every binary target
  # when it loads the manifest -- so `swift build --target MigoAppleWebKit` in a
  # checkout without the artifact fails on the artifact, not on the target. Asked
  # on the Mac, it reports all three missing frameworks and builds nothing. That
  # makes every source file under platforms/apple/Sources code no cheap lane has
  # ever compiled, which is the exact state apple-ci.yml was created to end for
  # the engine-free package next door, and the state that put two wrong pointer
  # widths into the C ABI's ILP32 assertions.
  #
  # The reason it was not here before was a cost estimate that measurement has
  # since retired: this lane was budgeted at an hour of Skia and actually runs in
  # 7 to 19 minutes wall clock across its three-platform matrix, on runners that
  # are free for a public repository. The path filter keeps that bill where the
  # risk is -- a pull request that touches no Apple path pays nothing, and an
  # engine-wide change that breaks the Apple build is still caught by the weekly
  # cron, which is the cadence expensive verification is supposed to get.
  pull_request:
    paths:
      - 'platforms/apple/**'
      - 'contracts/apple/**'
      - 'engine/crates/capi/**'
      - 'engine/crates/frame-wire/**'
      - 'engine/crates/frame-decode/**'
      # The crate this workflow runs `cargo test -p migo-platform` on, and it
      # was not here. So a change to the Apple presenter -- the EGL provider,
      # the layer ownership, the ANGLE bring-up tests that live in it -- could
      # land without the lane that tests it ever running. Found by pushing a new
      # presenter test and watching the Apple lanes not start.
      - 'engine/crates/platform/**'
      # The crate that owns every Skia surface, and it was not here either. The
      # cost of that: Skia's macOS build assumes desktop GL while Migo's only
      # Apple GL implementation is ANGLE, which is ES, so no `GrDirectContext`
      # could be built on macOS at all -- and no Apple lane ran on a change to
      # the crate where that lives. WebGL never goes through Skia, so nothing
      # else went red. See scripts/apple-skia-gl-env.sh.
      #
      # It is a wide path on a busy crate, and that is the trade being made
      # deliberately: an Apple-only rendering defect has now been found here
      # once, and the Android work that dominates this crate's traffic is
      # exactly the traffic that would not notice.
      - 'engine/crates/graphics/**'
      - 'scripts/apple-skia-gl-env.sh'
      - 'scripts/build-apple-sdk.sh'
      # The gate that runs a game through the shipping macOS archive, and the
      # fixture it runs. Both are macOS-only and neither was here.
      - 'scripts/test-macos-archive-runs-js.sh'
      - 'scripts/fixtures/headless-js-probe/**'
      - 'scripts/apple-sdk-package.py'
      - 'scripts/embed-apple-angle.sh'
      - 'scripts/fetch-apple-angle.sh'
      - 'scripts/test-apple-*.sh'
      - '.github/workflows/apple-sdk.yml'

concurrency:
  # One group for a branch however this lane was reached. A push to apple/foo and
  # a pull request from apple/foo are two events for one tree, and two 19-minute
  # matrices for one tree is the bill this filter exists to keep down.
  group: apple-sdk-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  performance-plus:
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            product: performance-plus
            targets: aarch64-apple-ios
            destination: generic/platform=iOS
            package_path: platforms/apple
            scheme: MigoApplePerformancePlus
            host_slice: false
          - platform: ios-simulator
            product: performance-plus
            targets: aarch64-apple-ios-sim,x86_64-apple-ios
            destination: generic/platform=iOS Simulator
            package_path: platforms/apple
            scheme: MigoApplePerformancePlus
            host_slice: false
          - platform: macos
            product: external-frames-diagnostic
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            destination: platform=macOS
            package_path: build/apple/diagnostics/Debug/package
            scheme: MigoApplePerformancePlus
            host_slice: true
          # The macOS V8 product, and the reason this row exists at all:
          # `MigoMacV8` is a target no lane has ever compiled. It sat as a one-line
          # placeholder because the product links in-process V8 and there was no
          # macOS V8 archive to link -- which stopped being true on 2026-09-09,
          # when scripts/build-v8-apple.sh produced both darwin triples, they were
          # published, and scripts/fetch-v8-archives.sh verified them against their
          # committed component manifests.
          #
          # Everything A2.3 adds after this lands in that target, so landing it
          # before the code is the whole point: this repository has twice shipped an
          # arm nothing compiled, and both times the defect was found by a customer's
          # toolchain rather than by a lane.
          - platform: macos
            product: macos-v8
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            destination: platform=macOS
            package_path: platforms/apple
            scheme: MigoMacV8
            host_slice: false
    env:
      MIGO_APPLE_BUILD_ROOT: ${{ github.workspace }}/build/apple
      MIGO_APPLE_PACKAGE_ROOT: ${{ github.workspace }}/${{ matrix.package_path }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: ${{ matrix.targets }}

      # Not for macos-v8. The rule and its mechanism are written once, in
      # `scripts/lib/v8-materialise.sh`'s header, next to the code they are about;
      # this repository had already settled it on three other lanes and the new
      # product did not inherit it, which is what moving it there is meant to stop
      # happening a fifth time.
      #
      # Swatinem/rust-cache prunes large files out of each crate's build-script
      # OUT_DIR to shrink the cache, and `librusty_v8.a` is one: the v8 crate's
      # build script copies the archive to `target/<triple>/debug/gn_out/obj` and
      # records `cargo:rustc-link-search` pointing there. The cache keeps the
      # fingerprint that says that script is fresh and drops the file it produced,
      # so on a warm run cargo replays the search path without re-running the
      # copy, and the link fails with "could not find native static library
      # rusty_v8".
      #
      # Measured here rather than assumed: the first run built green on a cold
      # cache, the next two failed on `full match: true` restores of the same key,
      # and a step that listed the restored tree showed `gn_out/obj` and the
      # materialise directories both present and EMPTY while the recorded output
      # still named them. A cold build of both darwin slices is 13 minutes against
      # a 180-minute timeout.
      - name: Rust cache
        if: matrix.product != 'macos-v8'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine -> target
          key: apple-sdk-${{ matrix.product }}-${{ matrix.platform }}
          cache-on-failure: true

      - name: Record the toolchain
        run: |
          rustc --version --verbose
          xcodebuild -version
          bash scripts/build-apple-sdk.sh --print-deployment-target ios
          bash scripts/build-apple-sdk.sh --print-deployment-target macos

      - name: Check the packaging contract and failure controls
        run: |
          bash scripts/test-apple-shipping-package-contract.sh
          bash scripts/test-apple-sdk-packaging.sh

      # All declared binary paths must exist when SwiftPM resolves a package,
      # even when a dependency is conditional on the destination platform.
      - name: Install the pinned ANGLE runtime dependencies
        run: |
          bash scripts/fetch-apple-angle.sh ios
          bash scripts/fetch-apple-angle.sh ios-simulator
          bash scripts/fetch-apple-angle.sh macos

      - name: Build ${{ matrix.product }} for ${{ matrix.platform }}
        run: >-
          bash scripts/build-apple-sdk.sh
          --platform ${{ matrix.platform }}
          --product ${{ matrix.product }}
          --configuration Debug
          --code-signing off

      # Linking is not running, and until this step the macOS V8 supply chain had
      # only ever been shown to link. `migo-runtime-v8`'s two integration tests
      # create a V8 startup snapshot and restore it, which is real execution: the
      # bug they were written for -- `delete globalThis.Deno` baked into the
      # snapshot -- surfaced as a panic during restore, not as a link error.
      #
      # It reuses the archive the build step already fetched, verified and
      # materialised, through the same helper, so this asserts the SHIPPED bytes
      # run rather than whatever rusty_v8 would have downloaded for itself.
      - name: The macOS V8 archive runs JavaScript, not just links
        if: matrix.product == 'macos-v8'
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          # shellcheck source=scripts/lib/v8-materialise.sh
          source scripts/lib/v8-materialise.sh
          v8_materialise "engine/third_party/rusty_v8/$host" \
            "$PWD/engine/target/v8-materialised"
          export RUSTY_V8_ARCHIVE="$V8_MATERIALISED_ARCHIVE"
          export RUSTY_V8_SRC_BINDING_PATH="$V8_MATERIALISED_BINDING"
          cd engine
          cargo test -p migo-runtime-v8 --locked --target "$host"

      # The step above proves the *V8* archive evaluates script -- it is
      # rusty_v8's own integration tests, run against the bytes we ship. It says
      # nothing about ours. Everything else that looks at an assembled Migo
      # archive is a link check or a symbol audit, and an archive that links,
      # exports every symbol and cannot run a game passes all of them; the first
      # person to find out would be whoever integrated it.
      #
      # So this links a host against that archive and runs a game through it.
      # The content sums 1..1000, which has to be executed to exist, draws and
      # reads back a Canvas2D pixel, and then calls migo.exitMiniProgram() -- so
      # a pass means V8 ran, Skia built a GL context on ANGLE and drew what it
      # was told, AND the migo capability surface was installed.
      #
      # The Canvas2D half was added on 2026-09-11 because until then every macOS
      # check here was satisfiable by an engine whose 2D backend could not build
      # a single surface, which is exactly what it was: WebGL never goes through
      # Skia, so nothing went red. See scripts/apple-skia-gl-env.sh.
      - name: The shipping macOS archive runs a game, not just links
        if: matrix.product == 'macos-v8'
        run: >-
          bash scripts/test-macos-archive-runs-js.sh
          --archive "$MIGO_APPLE_BUILD_ROOT/${{ matrix.product }}/Debug/${{ matrix.platform }}/libmigo.a"

      # Pixel evidence that ANGLE-Metal draws what it is told, rather than that it
      # links and turns frames.
      #
      # G0's P2 asks for `glReadPixels` verification and not for somebody looking
      # at a screen. The half of it that is reachable today runs here: macOS is
      # the Apple platform whose shipping product carries an engine, so content
      # JavaScript runs in process and can read its own framebuffer back. It
      # exercises the SAME presenter iOS will use -- `platform/src/apple/
      # presenter.rs` on ANGLE's Metal backend against a CAMetalLayer.
      #
      # The other half waits: on iOS content runs in WebKit's WebContent process,
      # so there is no in-process readPixels, and `include/migo/external_frames.h`
      # offers submit, request and take-error and no readback. P2 on a phone falls
      # out of A3's bring-up rather than preceding it.
      - name: ANGLE-Metal draws the pixels it was told to
        if: matrix.product == 'macos-v8'
        run: >-
          bash scripts/test-macos-archive-runs-js.sh
          --archive "$MIGO_APPLE_BUILD_ROOT/${{ matrix.product }}/Debug/${{ matrix.platform }}/libmigo.a"
          --content headless-webgl-probe

      # The configuration macos-v8 actually ships in, which until now nothing ran.
      #
      # `Sources/MigoMacV8/README.md` states the requirement: "Hardened runtime
      # with `com.apple.security.cs.allow-jit`". Every check on this archive so
      # far -- including the one above that runs a game through it -- ran an
      # UNSIGNED binary, which is not that. Distribution stays the integrator's
      # (they notarize their app with their own identity); whether the engine
      # works in the shape they ship it in is ours, and it needs no paid account:
      # an ad-hoc signature carries entitlements the kernel reads.
      - name: The shipping archive runs under a hardened runtime with allow-jit
        if: matrix.product == 'macos-v8'
        run: >-
          bash scripts/test-macos-archive-runs-js.sh
          --archive "$MIGO_APPLE_BUILD_ROOT/${{ matrix.product }}/Debug/${{ matrix.platform }}/libmigo.a"
          --harden with-jit

      # The negative control for it, and it asserts a promise rather than a
      # mechanism. The same README: without the entitlement "the profile
      # resolver selects a WebKit lane. It does not silently fall back to a
      # jitless V8: that configuration deletes WebAssembly outright." A run that
      # COMPLETES with the entitlement withheld is that silent fallback, whatever
      # produced it -- and on iOS the measured cost of jitless is 750M
      # iterations/s falling to 17M, with WebAssembly going undefined.
      - name: Withholding allow-jit does not silently produce a jitless V8
        if: matrix.product == 'macos-v8'
        run: >-
          bash scripts/test-macos-archive-runs-js.sh
          --archive "$MIGO_APPLE_BUILD_ROOT/${{ matrix.product }}/Debug/${{ matrix.platform }}/libmigo.a"
          --harden without-jit

      # The drawable pool, measured rather than argued about -- and measured as a
      # PAIR, in one job, minutes apart on one machine. A shared runner is no
      # place for an absolute frame rate, but the question here is relative: does
      # a pool of 2 cost throughput against a pool of 3? Both runs see the same
      # cold caches, the same neighbours and the same thermal state, which is
      # most of what a CI runner gets wrong about a measurement.
      #
      # Off unless asked for, because it answers a question nobody is blocked on
      # per commit. The other half of what maximumDrawableCount buys -- latency
      # to a display -- is not answerable here at all: there is no display.
      - name: Throughput at drawable pool 2 against 3
        if: matrix.product == 'macos-v8' && inputs.measure_drawables
        run: |
          archive="$MIGO_APPLE_BUILD_ROOT/${{ matrix.product }}/Debug/${{ matrix.platform }}/libmigo.a"
          for pool in 3 2 3 2; do
            bash scripts/test-macos-archive-runs-js.sh \
              --archive "$archive" --content headless-perf-probe --drawables "$pool" \
              | grep throughput
          done

      # Not for macos-v8, and the exclusion is the product's definition rather
      # than an exemption: that archive links in-process V8 on purpose, so an
      # assertion that it carries no engine symbols would be asserting the
      # opposite of what the product is. The other three carry no engine and this
      # is what holds them to it.
      - name: The external-frame archive contains no engine symbols
        if: matrix.product != 'macos-v8'
        run: >-
          bash scripts/test-apple-performance-rust-closure.sh
          --artifact "$MIGO_APPLE_BUILD_ROOT/${{ matrix.product }}/Debug/${{ matrix.platform }}/libmigo.a"

      - name: The package builds for its artifact destination
        working-directory: ${{ env.MIGO_APPLE_PACKAGE_ROOT }}
        run: |
          xcodebuild -list
          xcodebuild build \
            -scheme ${{ matrix.scheme }} \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Record the native static-library dependencies
        continue-on-error: true
        working-directory: engine
        env:
          LEG_TARGETS: ${{ matrix.targets }}
        run: >-
          cargo rustc -p migo-capi --locked --target "${LEG_TARGETS%%,*}"
          --no-default-features --features external-frames
          -- --print native-static-libs

      # This uses the same helper shipped to app consumers. SwiftPM's CLI test
      # runner has no .app embedding phase, so its loader directory is explicit.
      - name: Embed the macOS diagnostic runtime pair
        if: matrix.host_slice
        run: |
          bash "$MIGO_APPLE_PACKAGE_ROOT/Frameworks/Scripts/embed-apple-angle.sh" \
            --frameworks-dir "$MIGO_APPLE_PACKAGE_ROOT/Frameworks" \
            --destination "$RUNNER_TEMP/migo-diagnostic-angle" \
            --architectures 'arm64 x86_64'
          echo "MIGO_DIAGNOSTIC_ANGLE=$RUNNER_TEMP/migo-diagnostic-angle" >> "$GITHUB_ENV"

      - name: The isolated diagnostic package links and runs its ABI tests
        if: matrix.host_slice
        # No MIGO_CAPI_LOG here, and that is a correction rather than an
        # omission. It was added on the theory that the engine's release warning
        # was speaking into a void; the engine's own "diagnostics installed"
        # line then reported `level=Info` on a step that had set `warn`, because
        # MigoSurfaceAttachTests' setUp already does
        # `setenv("MIGO_CAPI_LOG", "info", 1)` with overwrite. The subscriber was
        # never missing on this lane -- 28 engine lines are in the log of the run
        # that established this -- so setting it here changed nothing and said
        # something untrue about why.
        working-directory: ${{ env.MIGO_APPLE_PACKAGE_ROOT }}
        run: |
          swift build
          DYLD_LIBRARY_PATH="$MIGO_DIAGNOSTIC_ANGLE" swift test

      # `migo-shared` carries two things that only exist on Apple and that every
      # other lane compiles out: the Objective-C autorelease pool the render thread
      # depends on, and the release-boundary check that reads a surface's native
      # owner count. Their cross-platform tests pass against a `new()` that pushes
      # nothing; the one that would not is `#[cfg(target_vendor = "apple")]`, and
      # until this step no job ran it. A test no lane executes is a test that has
      # never been seen to fail.
      - name: The engine's Apple-only unit tests run
        if: matrix.host_slice
        working-directory: engine
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          cargo test -p migo-shared --locked --target "$host"

      # The 2D goldens, on the Apple build of Skia. They had never run on an
      # Apple target: this workflow tests `migo-shared` and `migo-platform`, and
      # `migo-graphics` -- the crate that owns every Canvas2D surface -- ran only
      # on Linux. Its goldens rasterise to memory and need no GPU, so what they
      # check here is the part of 2D that is the Apple build rather than the
      # driver: CoreText instead of FreeType, a different font manager, different
      # SIMD.
      #
      # On the macos-v8 row rather than the diagnostic one, and that is about
      # cost, not coverage: this row builds the full profile for the host triple
      # already, so the tests reuse its Skia. The diagnostic row builds the
      # engine-free profile, whose Skia feature set differs by `embed-icudtl`,
      # and asking there would have meant a third from-source Skia in one job.
      - name: The 2D goldens run on the Apple build of Skia
        if: matrix.product == 'macos-v8'
        working-directory: engine
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          # shellcheck source=scripts/apple-skia-gl-env.sh
          . ../scripts/apple-skia-gl-env.sh
          cargo test -p migo-graphics --locked --target "$host" --tests

      - name: The Apple presenter's ANGLE bring-up runs on Apple silicon
        if: matrix.host_slice
        working-directory: engine
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          # Same Skia configuration the shipped macOS slice is built with. It has
          # to be the same one: this step asks whether Skia builds a Canvas2D
          # context on ANGLE, and a Skia compiled for desktop GL answers no for a
          # reason that is about this command line rather than about the product.
          . ../scripts/apple-skia-gl-env.sh
          DYLD_LIBRARY_PATH="$MIGO_DIAGNOSTIC_ANGLE" \
            cargo test -p migo-platform --locked --target "$host" \
            --no-default-features --features external-frames

      # The runtime is supplied by Package.swift's framework dependencies.
      # No copy into DerivedData or test products repairs the package afterward.
      #
      # `-parallel-testing-enabled NO`, and it is measured rather than cautious.
      # This package grew a second test bundle (MigoAppleWebKitTests) and
      # xcodebuild runs bundles concurrently by default -- so two suites that both
      # drive one simulator's WebKit and GPU began racing each other, on the one
      # simulator they share. The evidence is that whichever lost the race failed:
      # in one run MigoSurfaceAttachTests' release assertion failed while every
      # WebView test passed, and in the next run on the same code the WebView
      # bundle's first test exceeded a 120-second budget while the release
      # assertion passed in 0.388 seconds.
      #
      # Serial is the honest configuration for what these are. They are not unit
      # tests that happen to share a process: one waits on a native surface
      # retirement and the other mounts real web views, and timing is the thing
      # both of them assert about. Parallelism here does not make them faster than
      # it makes them wrong -- the whole step is about six minutes either way.
      - name: The ABI tests run on iOS with package-embedded ANGLE
        if: matrix.platform == 'ios-simulator'
        working-directory: ${{ env.MIGO_APPLE_PACKAGE_ROOT }}
        # The engine's own log IS visible on this lane, and this comment used to
        # say the opposite.
        #
        # It said so on a real measurement -- 28 `INFO graphics::` lines in the
        # macOS leg and zero here, from identical test code -- but that was taken
        # before `install_dev_logging` was changed to write to stderr rather than
        # stdout, which is the stream `xcodebuild` folds into its log. The fix
        # landed and this comment did not, and what it advised was to stop asking
        # engine-side questions on the one lane where this defect reproduces.
        #
        # Re-measured 2026-09-10: `gh run view --job <this job> --log` returns
        # lines prefixed with THIS job's name carrying
        # `shared::surface::attachment: ... has_anchor=true outstanding=1
        # native_owners=Some(1)`, which is how the surface-retirement
        # investigation read the engine's account of a red run. Check the job
        # prefix when reading, because a run-level log carries every job's lines
        # and it is easy to read the macOS leg's answer and believe it came from
        # here.
        run: |
          udid="$(bash "$GITHUB_WORKSPACE/scripts/pick-iphone-simulator.sh")"
          xcodebuild test \
            -scheme Migo-Package \
            -destination "platform=iOS Simulator,id=$udid" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$GITHUB_WORKSPACE/build/apple-sim-dd" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: The assembled artifact honors the deployment floor
        run: >-
          bash scripts/test-apple-deployment-floor-contract.sh
          --artifacts "$MIGO_APPLE_PACKAGE_ROOT/Frameworks/MigoEngine.xcframework"

      - name: Keep the package artifacts and consumer helper
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apple-sdk-${{ matrix.product }}-${{ matrix.platform }}-debug
          path: |
            ${{ env.MIGO_APPLE_PACKAGE_ROOT }}/Frameworks/
          if-no-files-found: warn
          retention-days: 14

      - name: Keep the validated shipping group for iOS assembly
        if: matrix.product == 'performance-plus'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apple-engine-${{ matrix.platform }}-debug
          path: ${{ env.MIGO_APPLE_BUILD_ROOT }}/performance-plus/Debug/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14

  assemble-ios:
    needs: performance-plus
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MIGO_APPLE_BUILD_ROOT: ${{ github.workspace }}/build/apple
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download the device group
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: apple-engine-ios-debug
          path: ${{ env.MIGO_APPLE_BUILD_ROOT }}/performance-plus/Debug/ios
      - name: Download the simulator group
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: apple-engine-ios-simulator-debug
          path: ${{ env.MIGO_APPLE_BUILD_ROOT }}/performance-plus/Debug/ios-simulator
      - name: Install the pinned iOS runtime pair
        run: |
          bash scripts/fetch-apple-angle.sh ios
          bash scripts/fetch-apple-angle.sh ios-simulator
      - name: Assemble the iOS family from both validated groups
        run: |
          bash scripts/build-apple-sdk.sh --platform ios --configuration Debug --assemble-only
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          receipt = json.loads(Path('platforms/apple/Frameworks/MigoEngine.xcframework/migo-build.json').read_text())
          assert not receipt['diagnostic']
          assert {s['platform']: s['product'] for s in receipt['slices']} == {
