name: C ABI Candidate Contract

on:
  pull_request:
    paths:
      - "include/migo/**"
      - "tests/c_abi/**"
      - "engine/crates/capi-abi/**"
      - "scripts/test-c-abi-surface-candidate.sh"
      - "scripts/test-c-abi-msvc-lane.ps1"
      - ".github/workflows/c-abi-candidate.yml"
      - ".github/workflows/pr-ci.yml"
      - ".github/workflows/release.yml"
  push:
    branches:
      - master
    paths:
      - "include/migo/**"
      - "tests/c_abi/**"
      - "engine/crates/capi-abi/**"
      - "scripts/test-c-abi-surface-candidate.sh"
      - "scripts/test-c-abi-msvc-lane.ps1"
      - ".github/workflows/c-abi-candidate.yml"
      - ".github/workflows/pr-ci.yml"
      - ".github/workflows/release.yml"

concurrency:
  group: c-abi-candidate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compile C ABI candidate with GCC and Clang
        run: |
          bash scripts/test-c-abi-surface-candidate.sh
          CC=clang CXX=clang++ bash scripts/test-c-abi-surface-candidate.sh

  msvc-contract:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compile C ABI candidate for LLP64 and x86 ILP32 with MSVC
        shell: pwsh
        run: ./scripts/test-c-abi-msvc-lane.ps1 -RepoRoot $PWD.Path

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: i686-pc-windows-msvc

      - name: Verify the dependency-free Rust ABI records on LLP64 and ILP32
        working-directory: engine
        run: |
          cargo test -p migo-capi-abi --all-targets --locked
          cargo test -p migo-capi-abi --all-targets --target i686-pc-windows-msvc --locked
