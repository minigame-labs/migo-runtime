name: Apple Toolchain

# The Apple-facing layer of this tree has never been compiled by an Apple
# compiler.
#
# `migo-frame-wire`, `migo-frame-decode` and `migo-capi-abi` exist so that the
# iOS Performance+ product can receive, validate and decode a frame stream in a
# process that links no JavaScript engine. Every line of them was written,
# reviewed and tested on x86_64 Linux. Nothing in this repository has ever
# asked Apple's clang, Apple's linker or Apple's ABI whether they agree.
#
# THE DRIFT THIS EXISTS TO CATCH is the one this repository has already been
# bitten by once, recorded as "writing a platform arm twice is not testing it
# twice": the ILP32 assertions in the C ABI lane had never been compiled, and
# when they finally were, two of them were wrong about pointer width. An Apple
# arm written today would sit in exactly that state -- present, plausible, and
# unexamined -- until a Mac arrives, which on the current plan is weeks away.
# This lane makes the compiler answer now instead.
#
# Since this lane was written it has acquired a second half. `platforms/apple`
# declares a `.binaryTarget` for an xcframework that scripts/build-apple-sdk.sh
# produces, so that package does not resolve until an hour of Skia has run --
# which meant no Swift in this repository had ever been compiled, including the
# two files that mirror contracts/apple/*.json and whose gates compare only
# their text. The engine-free Swift now lives in `platforms/apple/core`, a
# package with no binary target and no dependencies, and it is built and tested
# here in seconds.
#
# Scope is deliberately the engine-free layer and not the whole product.
# `migo-capi --features external-frames` cannot build here yet for a reason
# that has nothing to do with Apple: skia-bindings compiles Skia from source
# and that is an hour of C++ per cold cache. It is a separate lane to add when
# there is something Apple-specific in the graphics path to protect; adding it
# now would buy a long red build and no new fact. The boundary is drawn where
# the facts are.
#
# Two things this lane proves that no Linux runner can:
#
#   1. The layer compiles for `aarch64-apple-ios` through Apple's own
#      toolchain, rather than through rustc's cross-compilation of the parts
#      that happen not to need a system SDK.
#   2. Its tests *run* on Apple hardware. The runner is Apple silicon, so
#      `aarch64-apple-darwin` is native: assertions about layout, alignment and
#      integer width are executed on the ABI they are about, not reasoned about
#      from another one.
#
# Free for this repository. GitHub bills macOS minutes at 10x, but public
# repositories are unmetered on standard runners, so this lane costs nothing
# and does not compete with the Linux gates for quota.

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: apple-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apple-engine-free:
    # `macos-15` and not `macos-latest`: the label that floats is the label
    # that changes the toolchain under a green build without a commit. This
    # image is Apple silicon, which is what makes the native half meaningful --
    # an Intel runner would test an ABI no shipping Apple device has used
    # since 2020.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine -> target
          cache-on-failure: true

      # Report what actually answered, so a future failure can be read without
      # guessing which toolchain produced it. `xcodebuild -version` is the one
      # line that distinguishes "the runner image moved" from "our code broke".
      - name: Record the toolchain that is answering
        working-directory: engine
        run: |
          rustc --version --verbose
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # Native, on Apple silicon. This is the half that executes rather than
      # merely compiles -- the tests in these three crates assert record
      # lengths, field offsets and opcode agreement, and until this step they
      # had only ever asserted them against x86_64 Linux.
      - name: Run the engine-free layer's tests on Apple silicon
        working-directory: engine
        run: >-
          cargo test --locked
          -p migo-frame-wire
          -p migo-frame-decode
          -p migo-capi-abi

      # The shipping shape of the wire crate. Its own manifest explains why the
      # builder is a default feature rather than an opt-in -- with the feature
      # off there is no test binary at all, which reports success having run
      # nothing -- so the exclusion has to be checked by building it, here as
      # on Linux.
      - name: The frame reader still stands alone with no test support
        working-directory: engine
        run: cargo check --locked --no-default-features -p migo-frame-wire

      # Cross to the device target. `check` and not `test`: running a binary
      # for a physical iPhone needs a device, which is the whole reason gate G0
      # is blocked. What is provable without one is that the code the device
      # would run compiles for it.
      - name: Cross-compile the engine-free layer for aarch64-apple-ios
        working-directory: engine
        run: >-
          cargo check --locked --target aarch64-apple-ios
          -p migo-frame-wire
          -p migo-frame-decode
          -p migo-capi-abi

      # The Swift half, and the first time any Swift here meets a compiler.
      #
      # `swift test` and not just `swift build`: MigoAppleCoreTests asserts the
      # relationship between the deployment floor and the Performance+ lane
      # minimum, which is the one thing the text-comparing floor contract
      # cannot check -- it verifies each number against the contract and has no
      # way to run the comparison between them.
      # The ANGLE pin, exercised on the platform that will consume it. Three
      # archives and about 10 MB, so it is cheap enough for a per-pull-request
      # lane -- and it is the only place any of this runs on a Mac: the pin
      # gate on Linux checks that the lock is complete and that nothing hardcodes
      # an asset, and cannot check that the bytes are still THERE, still hash to
      # what is committed, and still unpack to the layout ANGLE opens.
      #
      # It also puts scripts/fetch-apple-angle.sh inside the scope
      # scripts/test-macos-bash32-contract.sh derives from the workflows, which
      # is where a script that runs on macOS has to be: /bin/bash there is 3.2.
      - name: The pinned ANGLE is still fetchable and still hashes to the pin
        run: bash scripts/fetch-apple-angle.sh

      - name: Build and test the engine-free Swift package on Apple silicon
        working-directory: platforms/apple/core
        run: |
          swift --version
          swift build
          swift test

      # The same sources, compiled for the platform the floor is about. `swift
      # build` above ran natively on macOS; a deployment floor of iOS 15 is a
      # statement about a system this step is the only one to ask.
      - name: Compile the engine-free Swift package for iOS
        working-directory: platforms/apple/core
        run: >-
          xcodebuild build
          -scheme MigoAppleCore
          -destination 'generic/platform=iOS'
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO

      # G0.1b, the probe app, built for the platform it will run on.
      #
      # It links no engine on purpose: the plan defines measurement gate 1 as
      # the gate that runs with no renderer and no validator, so the app that
      # carries it has nothing to link and costs this lane a few seconds rather
      # than an hour of Skia.
      #
      # Compiling it here is what keeps it honest. Everything that decides an
      # answer lives in the package above and is tested natively; what is left
      # in the app target is a window, a web view and two segmented controls --
      # and an Xcode target that no lane builds is a target that stops building
      # without anybody finding out until the devices are already booked.
      - name: Compile the G0 probe app for iOS
        working-directory: platforms/apple/ProbeApp
        run: >-
          xcodebuild build
          -project MigoProbe.xcodeproj
          -scheme MigoProbe
          -destination 'generic/platform=iOS'
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
