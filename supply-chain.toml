# Central, fail-closed policy consumed by check-supply-chain.py and SBOM output.
# Advisory exceptions are exact and time-bounded; an upgrade that removes the
# warning also makes the stale exception fail, forcing this file to shrink.
schema = 1

[licenses]
allowed = [
  "0BSD",
  "Apache-2.0",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "BSL-1.1",
  "CDLA-Permissive-2.0",
  "IJG",
  "ISC",
  "LGPL-2.1-or-later",
  "LLVM-exception",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[gradle]
distribution_url = "https://services.gradle.org/distributions/gradle-8.4-bin.zip"
distribution_sha256 = "3e1af3ae886920c3ac87f7a91f816c0c7c436f276a6eefdb3da152100fef72ae"
wrapper_jar_sha256 = "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172"

[[advisory_exceptions]]
id = "RUSTSEC-2024-0436"
package = "paste"
version = "1.0.15"
kind = "unmaintained"
expires = "2027-02-28"
reason = "V8 code generation and a test decoder still pull paste; review on upstream update."
tracking = "https://rustsec.org/advisories/RUSTSEC-2024-0436.html"
