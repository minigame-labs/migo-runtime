plugins { id 'com.android.application' }

android {
    namespace 'com.migo.chost'
    compileSdk 34
    ndkVersion '23.2.8568313'

    defaultConfig {
        applicationId 'com.migo.chost'
        minSdk 26          // project floor; do not raise
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // Which ABIs to build is a property because the staticlib CMake links
        // is staged per ABI by scripts/build-android-c-host.sh: the script
        // passes the ABI it staged, and the phone ABI is the default.
        ndk { abiFilters(*((project.findProperty('migoAbis') ?: 'arm64-v8a') as String).split(',')) }
        externalNativeBuild {
            // Skia and V8 are C++; the engine links libc++ dynamically rather
            // than statically because a static libc++ duplicates std::* symbols
            // across their two archives (see engine/.cargo/config.toml).
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                // A published C ABI package to link instead of this tree's
                // engine (scripts/build-android-c-host.sh --package). Both
                // search paths: the NDK toolchain confines find_package to
                // CMAKE_FIND_ROOT_PATH when cross-compiling.
                def pkg = project.findProperty('migoPackage')
                if (pkg) {
                    arguments "-DMIGO_PACKAGE_PREFIX=${pkg}", "-DCMAKE_PREFIX_PATH=${pkg}",
                            "-DCMAKE_FIND_ROOT_PATH=${pkg}"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // The Rust staticlib is an input to the CMake link, not a packaged .so, so
    // it is staged outside jniLibs by scripts/build-android-c-host.sh.
    sourceSets {
        main { jniLibs.srcDirs = [] }
    }

    buildTypes {
        debug { debuggable true }
    }
}
